<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12335f"><title>Bio Study Hub</title><style>*{box-sizing:border-box}:root{--b:#2563eb;--n:#10233d;--m:#66758a;--l:#dfe6ef;--bg:#f4f7fb;--g:#0c9b6b;--r:#dc4963;--a:#a35300}body{margin:0;background:var(--bg);color:var(--n);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.82}header{height:64px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100% - 1120px)/2));position:sticky;top:0;z-index:5}header b{display:flex;align-items:center;gap:9px}header i{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#10b981);color:#fff;display:grid;place-items:center;font-style:normal}nav button{border:0;background:transparent;padding:10px;color:var(--m);border-radius:10px}nav button.active{background:#eaf2ff;color:var(--b);font-weight:700}main{max-width:1120px;margin:auto;padding:28px 18px 92px}.hero{background:linear-gradient(120deg,#12335f,#087b7b);color:#fff;border-radius:25px;padding:34px;display:grid;grid-template-columns:1fr auto;gap:22px}.hero h1{font-size:clamp(29px,5vw,48px);margin:4px 0}.hero p{color:#d9e9f4}.goal{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#5ce1c3 calc(var(--p)*1%),#ffffff30 0);font-weight:800}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary,.danger{border:0;border-radius:12px;padding:12px 16px;font-weight:750}.primary{background:var(--b);color:#fff}.secondary{background:#fff;border:1px solid var(--l);color:var(--n)}.danger{background:#fff0f3;color:#a2213b;border:1px solid #f5bdc7}.hero .primary{background:#fff;color:#174276}.hero .secondary{background:transparent;border-color:#9 f2f7;border-radius:8px;display:grid;place-items:center}.options .correct{background:#e9faf3;border-color:var(--g)}.options .wrong{background:#fff0f3;border-color:var(--r)}textarea{width:100%;min-height:130px;border:1px solid var(--l);border-radius:12px;padding:12px;margin:15px 0}.feedback{padding:17px;border-radius:13px;margin-top:18px}.good{background:#e9faf3}.bad{background:#fff0f3}.neutral{background:#f1f5f9}.next{display:block;margin:14px 0 0 auto}.library article,.mistake{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding:12px 0;gap:12px}.library span{display:block;color:var(--m);font-size:12px}.library article button{border:0;background:transparent;color:var(--b)}.import{display:grid;grid-template-columns:1fr 1fr;gap:22px}.search,input,select{border:1px solid var(--l);border-radius:10px;padding:11px}.form{display:grid;gap:10px}.form label{display:grid;gap:5px}.heat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.heat div{padding:10px;border-radius:9px;text-align:center;font-size:12px;border:1px solid var(--l)}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}.status{font-weight:800}.finish{text-align:center;max-width:720px;margin:50px auto;background:#fff;border-radius:22px;padding:40px}.finish strong{display:grid;place-items:center;margin:auto;width:65px;height:65px;border-radius:50%;background:#dff8ee;color:var(--g);font-size:30px}.notice{padding:12px;border-radius:10px;background:#fff7e6;color:#744600;border:1px solid #f1d28d;margin:12px 0}body>footer{display:none}@media(max-width:780px){header nav{display:none}.hero{grid-template-columns:1fr}.goal{width:82px;height:82px}.stats{grid-template-columns:1fr 1fr}.grid,.modes,.import,.heat{grid-template-columns:1fr}.title,.head{align-items:flex-start;flex-direction:column}.search{width:100%}body>footer{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);z-index:6;padding:6px}body>footer button{border:0;background:transparent;color:var(--m);font-size:18px}body>footer small{display:block;font-size:10px}main{padding-top:18px}.card{border-radius:17px;padding:21px}.studytop{grid-template-columns:auto 1fr auto}.timer{grid-column:2/4;text-align:right}}.module-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.module-card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:22px;box-shadow:0 8px 22px #18375c0b}.module-card h2{margin:0 0 6px}.module-card .counts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.pill{display:inline-block;background:#eef4ff;color:#245aae;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}.module-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.module-actions button{text-align:left;border:1px solid var(--l);background:#f8faff;border-radius:12px;padding:13px}.module-actions b,.module-actions small{display:block}.module-actions small{color:var(--m);margin-top:3px}.section-label{margin-top:28px}.other-card{border-style:dashed;background:#fffdf7}.filter-row{display:flex;gap:9px;flex-wrap:wrap}.filter-row select{min-width:160px}@media(max-width:780px){.module-grid,.module-actions{grid-template-columns:1fr}}.form-options{display:grid;gap:9px}.option-input{display:grid!important;grid-template-columns:auto 28px 1fr;align-items:center;gap:8px}.option-input input[type="text"],.option-input input:not([type]){width:100%}.reveal{margin-top:16px}.filter-row{display:flex;gap:8px;flex-wrap:wrap}.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.module-card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px}.module-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.module-actions button{text-align:left;background:#f8faff;border:1px solid var(--l);border-radius:12px;padding:12px}.module-actions b,.module-actions small{display:block}.module-actions small{color:var(--m)}.counts{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.pill{background:#eaf2ff;color:var(--b);padding:6px 9px;border-radius:99px;font-size:12px;font-weight:700}.section-label{margin-top:28px}@media(max-width:850px){.module-grid{grid-template-columns:1fr}.module-actions{grid-template-columns:1fr}}

</style></head><body><header><b><i>B</i> Bio Study Hub</b><nav><button data-p="home">Dashboard</button><button data-p="topics">Topics</button><button data-p="library">Questions</button><button data-p="errors">Error notebook</button><button data-p="settings">Settings</button></nav></header><main id="home"></main><main id="topics" hidden></main><main id="study" hidden></main><main id="library" hidden></main><main id="errors" hidden></main><main id="settings" hidden></main><footer><button data-p="home">⌂<small>Home</small></button><button data-p="topics">▦<small>Topics</small></button><button onclick="startMode('mix',10)">▶<small>Study</small></button><button data-p="library">＋<small>Questions</small></button><button data-p="errors">!<small>Errors</small></button><button data-p="settings">⚙<small>Settings</small></button></footer><script>const BUILTIN=[{"id":"q1","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"1","q":"Why are phosphates charged at neutral pH?","opts":[],"a":"Phosphate groups are negatively charged at neutral pH because their acidic protons have pKa values below neutral pH and are therefore largely dissociated.","type":"Short answer","notes":"At pH values above an acid’s pKa, deprotonation is favoured. The phosphate groups in nucleic acids therefore carry negative charge near pH 7.","calc":false,"mode":"Flashcard"},{"id":"q2","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"2","q":"What is the difference between DNA and RNA?","opts":[],"a":"DNA contains 2′-deoxyribose, whereas RNA contains ribose with a 2′-hydroxyl group.","type":"Short answer","notes":"The chemically important distinction is the 2′-OH present in RNA but absent from DNA; the bases also differ because DNA normally uses thymine and RNA uses uracil.","calc":false,"mode":"Flashcard"},{"id":"q3","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"3","q":"DNA contains deoxyribose, whereas RNA contains ribose with a 2′-OH group. How does this difference affect polymer stability?","opts":[],"a":"The lack of the slightly reactive C2-OH means that DNA is more stable than RNA","type":"Short answer","notes":"The lack of the slightly reactive C2-OH means that DNA is more stable than RNA.","calc":false,"mode":"Flashcard"},{"id":"q4","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"4","q":"Why are purine–purine and pyrimidine–pyrimidine base pairs not normally found in duplex DNA?","opts":[],"a":"They could not form optimal complementary \"Watson-Crick\" base pairs, but more importantly they would cause a narrowing or widening of the spacing between the DNA strands.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q5","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"5","q":"How many carbon atoms are in the ring of a ribose sugar?","opts":[],"a":"Four carbon atoms are in the five-membered ribose ring; the fifth ring atom is oxygen, and carbon 5′ lies outside the ring.","type":"Short answer","notes":"Ribose is a five-membered furanose ring containing four carbons and one oxygen.","calc":false,"mode":"Flashcard"},{"id":"q6","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"6","q":"What is a beta-glycosidic bond? How does it differ from a phosphodiester bond?","opts":[],"a":"A beta-glycosidic bond joins a nitrogenous base to the 1′ carbon of a pentose sugar. A phosphodiester bond links the 3′ and 5′ carbons of adjacent sugars through phosphate, forming the nucleic-acid backbone.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q7","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"7","q":"Why do we say that single stranded DNA is polar, but DNA duplexes are not polar?","opts":[],"a":"One strand of DNA has a 5' end and a 3' end. Duplex DNA has both 5' and 3' ends at each end of the duplex.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q8","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"8","q":"What is the sequence hypothesis?","opts":[],"a":"The sequence of bases in DNA determines the sequence of amino acids in proteins.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q9","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"9","q":"List the main interactions that determine macromolecular structure, from strongest to weakest.","opts":[],"a":"Covalent bonds - Electrostatic bonds - Hydrogen bonds - Van der Waals interactions.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q10","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"10","q":"Which type of bond is generally not used as a reversible interaction between two separate macromolecules, and why?","opts":[],"a":"Covalent bonds - if there were covalent interactions between \"two\" macromolecules they would be \"one\" macromolecule","type":"Short answer","notes":"Covalent bonds - if there were covalent interactions between \"two\" macromolecules they would be \"one\" macromolecule.","calc":false,"mode":"Flashcard"},{"id":"q11","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"11","q":"What suggests the DNA is helical?","opts":[],"a":"The \"X\" shaped diffraction pattern.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q12","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"12","q":"How does a DNA double helix differ from a protein α-helix?","opts":[],"a":"A DNA double helix consists of two antiparallel nucleic-acid strands held together by base pairing. A protein α-helix is a single polypeptide segment stabilised by backbone hydrogen bonds.","type":"Short answer","notes":"The structures involve different polymers and different stabilising interactions: inter-strand base pairing in DNA versus intra-chain backbone hydrogen bonding in an α-helix.","calc":false,"mode":"Flashcard"},{"id":"q13","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"13","q":"How can DNA-binding proteins (such as restriction enzymes) recognise the base sequence in a DNA duplex?","opts":[],"a":"They can \"recognise\" the edges of the base-pairs in the major groove","type":"Short answer","notes":"They can \"recognise\" the edges of the base-pairs in the major groove.","calc":false,"mode":"Flashcard"},{"id":"q14","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"14","q":"Why do DNA circles or constrained loops help DNA packaging?","opts":[],"a":"They can be super-coiled to increase local density. This is effectively one of the functions of the histone octamers.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q15","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"15","q":"What are the conditions needed for two DNA strands to re-anneal?","opts":[],"a":"They must have complementary sequence and be annealed by slow cooling.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q16","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"16","q":"Why are restriction enzymes useful to microorganisms?","opts":[],"a":"They serve a protective role by degrading foreign DNA","type":"Short answer","notes":"They serve a protective role by degrading foreign DNA.","calc":false,"mode":"Flashcard"},{"id":"q17","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"17","q":"Why are restriction enzymes useful to molecular biologists?","opts":[],"a":"They enable us to create DNA fragments with complementary sticky ends that can be joined together using DNA ligase.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q18","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"18","q":"What are the three enzymatic activities of bacterial DNA polymerase I?","opts":[],"a":"5′→3′ DNA polymerase; 3′→5′ proofreading exonuclease; and 5′→3′ exonuclease.","type":"Short answer","notes":"The polymerase activity extends DNA, the 3′→5′ exonuclease proofreads, and the 5′→3′ exonuclease removes nucleotides ahead of the enzyme, including RNA primers.","calc":false,"mode":"Flashcard"},{"id":"q19","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"19","q":"How does the DNA clamp (two beta-subunits of DNA Pol III) contribute to the activity of the polymerase enzyme?","opts":[],"a":"It reduces dissociation from the DNA template and thereby increases processivity","type":"Short answer","notes":"It reduces dissociation from the DNA template and thereby increases processivity.","calc":false,"mode":"Flashcard"},{"id":"q21","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"21","q":"What is a replication fork?","opts":[],"a":"A replication fork is the Y-shaped region where parental DNA strands separate and are copied by the replication machinery.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q22","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"22","q":"Why do we call one strand discontinuous? Why must it be like that?","opts":[],"a":"It is discontinuous because the DNA is copied in \"Okazaki fragments\" because DNA polymerases can only replicate DNA in the 5' to 3' direction.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q23","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"23","q":"Which enzymes act at or close to a bacterial DNA replication fork?","opts":[],"a":"Helicase, primase, DNA polymerase III and the sliding clamp act directly at the bacterial replication fork. DNA polymerase I and ligase mainly process Okazaki fragments behind the fork.","type":"Short answer","notes":"The original answer placed DNA polymerase I and ligase at the fork itself; their principal roles are primer removal, gap filling and nick sealing behind the moving replisome.","calc":false,"mode":"Flashcard"},{"id":"q24","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"24","q":"Which enzymes support bacterial DNA replication without necessarily remaining at the replication fork?","opts":[],"a":"DNA gyrase relieves torsional strain ahead of the fork, and pyrophosphatase helps drive nucleotide addition by hydrolysing pyrophosphate.","type":"Short answer","notes":"These enzymes support replication without being core components of the polymerase complex at the fork.","calc":false,"mode":"Flashcard"},{"id":"q25","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"1","q":"Which statement best explains why phospholipids spontaneously form bilayers in water?","opts":["Their hydrophilic tails bind one another covalently","Their hydrophobic tails cluster away from water while hydrophilic heads face water","Their phosphate groups move into the bilayer centre","Every phospholipid is permanently attached to a membrane protein"],"a":"B","type":"Multiple choice","notes":"B is correct: Their hydrophobic tails cluster away from water while hydrophilic heads face water. A is incorrect for this stem. C is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ"},{"id":"q26","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"2","q":"A cell is transferred to a hypotonic solution. What is the most immediate expected change?","opts":["Water leaves the cell and it shrinks","Water enters the cell and it swells","K+ enters and water follows immediately","The plasma membrane becomes impermeable to water"],"a":"B","type":"Multiple choice","notes":"B is correct: Water enters the cell and it swells. A is wrong: Water leaves the cell and it shrinks. C is wrong: K+ enters and water follows immediately. D is wrong: The plasma membrane becomes impermeable to water.","calc":false,"mode":"MCQ"},{"id":"q27","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"3","q":"During regulatory volume decrease, why does loss of intracellular K+ help a swollen cell recover?","opts":["It raises intracellular osmolality","It lowers intracellular osmolality so water can leave","It directly digests excess water","It makes the membrane completely rigid"],"a":"B","type":"Multiple choice","notes":"B is correct: It lowers intracellular osmolality so water can leave. A is wrong: It raises intracellular osmolality. C is wrong: It directly digests excess water. D is wrong: It makes the membrane completely rigid.","calc":false,"mode":"MCQ"},{"id":"q28","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"4","q":"The osmotic gradient is unchanged, but a cell inserts more aquaporins into its membrane. What is most likely?","opts":["Water permeability and water flux increase","Water permeability decreases but flux increases","Only solute permeability increases","No membrane property changes"],"a":"A","type":"Multiple choice","notes":"A is correct: Water permeability and water flux increase. B is wrong: Water permeability decreases but flux increases. C is wrong: Only solute permeability increases. D is wrong: No membrane property changes.","calc":false,"mode":"MCQ"},{"id":"q29","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"5","q":"Which statement correctly distinguishes water flux from membrane permeability?","opts":["Flux is a membrane property only; permeability is the driving force","Flux is movement per unit time; permeability describes how readily the membrane permits movement","They are identical terms","Permeability always increases when osmolality increases"],"a":"B","type":"Multiple choice","notes":"B is correct: Flux is movement per unit time; permeability describes how readily the membrane permits movement. A is incorrect for this stem. C is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ"},{"id":"q30","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"6","q":"An inhibitor prevents ATP hydrolysis by an ABC transporter. What is the most direct consequence?","opts":["Transport driven by that ABC protein decreases or stops","Passive diffusion through the lipid bilayer accelerates","All membrane proteins are degraded","The transported solute is converted into ATP"],"a":"A","type":"Multiple choice","notes":"A is correct: Transport driven by that ABC protein decreases or stops. B is wrong: Passive diffusion through the lipid bilayer accelerates. C is wrong: All membrane proteins are degraded. D is wrong: The transported solute is converted into ATP.","calc":false,"mode":"MCQ"},{"id":"q31","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"7","q":"A receptor-bound ligand is internalised by receptor-mediated endocytosis. Which compartment does it usually enter first?","opts":["Nucleus","Early endosome","Mitochondrial matrix","Golgi trans face"],"a":"B","type":"Multiple choice","notes":"B is correct: Early endosome. A is wrong: Nucleus. C is wrong: Mitochondrial matrix. D is wrong: Golgi trans face.","calc":false,"mode":"MCQ"},{"id":"q32","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"8","q":"Which route best describes recycling of an internalised plasma-membrane receptor?","opts":["Early endosome -> recycling endosome -> plasma membrane","Lysosome -> nucleus -> plasma membrane","ER -> lysosome -> mitochondrion","Plasma membrane -> nucleolus -> Golgi"],"a":"A","type":"Multiple choice","notes":"A is correct: Early endosome -> recycling endosome -> plasma membrane. B is wrong: Lysosome -> nucleus -> plasma membrane. C is wrong: ER -> lysosome -> mitochondrion. D is wrong: Plasma membrane -> nucleolus -> Golgi.","calc":false,"mode":"MCQ"},{"id":"q33","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"9","q":"Which sequence best represents a common degradative endocytic pathway?","opts":["Plasma membrane -> early endosome -> late endosome -> lysosome","Plasma membrane -> nucleus -> peroxisome","Golgi -> ribosome -> lysosome","Early endosome -> ER -> chloroplast"],"a":"A","type":"Multiple choice","notes":"A is correct: Plasma membrane -> early endosome -> late endosome -> lysosome. B is wrong: Plasma membrane -> nucleus -> peroxisome. C is wrong: Golgi -> ribosome -> lysosome. D is wrong: Early endosome -> ER -> chloroplast.","calc":false,"mode":"MCQ"},{"id":"q34","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"10","q":"A signalling response begins normally but remains activated much longer than usual. Which defect best explains this?","opts":["Excessive negative feedback","Loss of negative feedback or pathway deactivation","Complete absence of receptors","Failure to produce the initial signal"],"a":"B","type":"Multiple choice","notes":"B is correct: Loss of negative feedback or pathway deactivation. A is wrong: Excessive negative feedback. C is wrong: Complete absence of receptors. D is wrong: Failure to produce the initial signal.","calc":false,"mode":"MCQ"},{"id":"q35","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"11","q":"A protein contains the sequence KKKRK. What destination is most consistent with this motif?","opts":["Nucleus","Extracellular space only","Lysosome via mannose-6-phosphate","Peroxisome via SKL"],"a":"A","type":"Multiple choice","notes":"A is correct: Nucleus. B is wrong: Extracellular space only. C is wrong: Lysosome via mannose-6-phosphate. D is wrong: Peroxisome via SKL.","calc":false,"mode":"MCQ"},{"id":"q36","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"12","q":"What is the main role of an importin?","opts":["To synthesise proteins in the nucleus","To recognise nuclear localisation signals and mediate nuclear import","To digest proteins entering the nucleus","To export all RNA without selection"],"a":"B","type":"Multiple choice","notes":"B is correct: To recognise nuclear localisation signals and mediate nuclear import. A is wrong: To synthesise proteins in the nucleus. C is wrong: To digest proteins entering the nucleus. D is wrong: To export all RNA without selection.","calc":false,"mode":"MCQ"},{"id":"q37","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"13","q":"A secreted protein is being synthesised. Which pathway is most appropriate?","opts":["Free ribosome -> nucleus -> plasma membrane","Rough ER -> Golgi apparatus -> secretory vesicle -> plasma membrane","Lysosome -> peroxisome -> cytosol","Mitochondrion -> nucleus -> Golgi"],"a":"B","type":"Multiple choice","notes":"B is correct: Rough ER -> Golgi apparatus -> secretory vesicle -> plasma membrane. A is wrong: Free ribosome -> nucleus -> plasma membrane. C is wrong: Lysosome -> peroxisome -> cytosol. D is wrong: Mitochondrion -> nucleus -> Golgi.","calc":false,"mode":"MCQ"},{"id":"q38","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"14","q":"Which organelle is especially associated with protein modification and the start of the secretory pathway?","opts":["Rough endoplasmic reticulum","Centrosome","Nucleolus","Peroxisome only"],"a":"A","type":"Multiple choice","notes":"A is correct: Rough endoplasmic reticulum. B is wrong: Centrosome. C is wrong: Nucleolus. D is wrong: Peroxisome only.","calc":false,"mode":"MCQ"},{"id":"q39","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells","number":"15","q":"Where do oxidative-phosphorylation reactions occur in a eukaryotic cell?","opts":["Cytosol","Inner mitochondrial membrane","Nuclear envelope only","Lysosomal lumen"],"a":"B","type":"Multiple choice","notes":"B is correct: Inner mitochondrial membrane. A is wrong: Cytosol. C is wrong: Nuclear envelope only. D is wrong: Lysosomal lumen.","calc":false,"mode":"MCQ"},{"id":"q40","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","number":"16","q":"A plate contains 42 colonies after 0.20 ml of a 10⁻⁵ dilution is plated. What was the original concentration?","opts":["2.1 × 10⁵ CFU ml⁻¹","2.1 × 10⁶ CFU ml⁻¹","2.1 × 10⁷ CFU ml⁻¹","8.4 × 10⁷ CFU ml⁻¹"],"a":"C","type":"Multiple choice","notes":"CFU ml⁻¹ = 42 ÷ (0.20 × 10⁻⁵) = 2.1 × 10⁷. The other values result from omitting or misapplying the plated volume or dilution factor.","calc":true,"mode":"MCQ"},{"id":"q41","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","number":"17","q":"A count of 60 plaques is obtained from 0.10 ml of a 10^-7 dilution. What is the original titre?","opts":["6.0 × 10⁷ PFU ml⁻¹","6.0 × 10⁸ PFU ml⁻¹","6.0 × 10⁹ PFU ml⁻¹","6.0 × 10¹⁰ PFU ml⁻¹"],"a":"C","type":"Multiple choice","notes":"PFU ml⁻¹ = 60 ÷ (0.10 × 10⁻⁷) = 6.0 × 10⁹. The other options mis-handle the plated volume or dilution exponent.","calc":true,"mode":"MCQ"},{"id":"q42","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","number":"18","q":"You have 2 x 10^6 cells and require an MOI of 5. How many infectious units are needed?","opts":["4 x 10^5","2 x 10^6","1 x 10^7","1 x 10^8"],"a":"C","type":"Multiple choice","notes":"C is correct: 1 x 10^7. A is wrong: 4 x 10^5. B is wrong: 2 x 10^6. D is wrong: 1 x 10^8.","calc":true,"mode":"MCQ"},{"id":"q43","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","number":"19","q":"A viral stock is 5 x 10^8 PFU/ml. What volume supplies 1 x 10^8 PFU?","opts":["0.02 ml","0.20 ml","2.0 ml","5.0 ml"],"a":"B","type":"Multiple choice","notes":"Volume = required PFU ÷ stock concentration = 1 × 10⁸ ÷ 5 × 10⁸ = 0.20 ml. The other options are tenfold or larger volume errors.","calc":true,"mode":"MCQ"},{"id":"q44","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"20","q":"Why can optical density remain high when a viable-count result is low?","opts":["Optical density detects only living cells","Dead cells and debris can still scatter light","CFU counts every physical particle","Optical density measures DNA sequence"],"a":"B","type":"Multiple choice","notes":"B is correct: Dead cells and debris can still scatter light. A is wrong: Optical density detects only living cells. C is wrong: CFU counts every physical particle. D is wrong: Optical density measures DNA sequence.","calc":false,"mode":"MCQ"},{"id":"q45","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"21","q":"What mainly occurs during the lag phase of a batch-culture growth curve?","opts":["Cells adapt to the new conditions before maximal division","The viable count necessarily falls to zero","Nutrients are unlimited and division is maximal","Cell division exactly balances cell death"],"a":"A","type":"Multiple choice","notes":"A is correct: Cells adapt to the new conditions before maximal division. B is wrong: The viable count necessarily falls to zero. C is wrong: Nutrients are unlimited and division is maximal. D is wrong: Cell division exactly balances cell death.","calc":false,"mode":"MCQ"},{"id":"q46","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"22","q":"Which description best fits exponential phase?","opts":["Cells divide at an approximately maximal and regular rate","Cells never divide","Growth equals death exactly","Only secondary metabolites can be produced"],"a":"A","type":"Multiple choice","notes":"A is correct: Cells divide at an approximately maximal and regular rate. B is wrong: Cells never divide. C is wrong: Growth equals death exactly. D is wrong: Only secondary metabolites can be produced.","calc":false,"mode":"MCQ"},{"id":"q47","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"23","q":"What best characterises stationary phase in a closed batch culture?","opts":["Growth rate exceeds death indefinitely","Overall cell number is relatively stable because growth and death are balanced or net growth has ceased","Every cell is metabolically inactive","The culture has returned to lag phase"],"a":"B","type":"Multiple choice","notes":"B is correct: Overall cell number is relatively stable because growth and death are balanced or net growth has ceased. A is incorrect for this stem. C is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ"},{"id":"q48","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"24","q":"In microbial nutritional classification, what does 'photo-' specify?","opts":["Carbon source","Energy source","Electron acceptor only","Cell-wall type"],"a":"B","type":"Multiple choice","notes":"B is correct: Energy source. A is wrong: Carbon source. C is wrong: Electron acceptor only. D is wrong: Cell-wall type.","calc":false,"mode":"MCQ"},{"id":"q49","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"25","q":"What does 'heterotroph' specify?","opts":["Use of organic carbon as a carbon source","Use of light as energy","Use of inorganic electron donors only","Complete inability to use carbon"],"a":"A","type":"Multiple choice","notes":"A is correct: Use of organic carbon as a carbon source. B is wrong: Use of light as energy. C is wrong: Use of inorganic electron donors only. D is wrong: Complete inability to use carbon.","calc":false,"mode":"MCQ"},{"id":"q50","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"26","q":"Which statement about secondary metabolites is most accurate?","opts":["They are always essential for basic growth","They are often produced in later growth phases and are not directly required for basic growth","They are identical to ATP","They can be produced only by viruses"],"a":"B","type":"Multiple choice","notes":"B is correct: They are often produced in later growth phases and are not directly required for basic growth. A is incorrect for this stem. C is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ"},{"id":"q52","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"28","q":"What main conclusion came from Pasteur's swan-neck flask experiments?","opts":["Microorganisms arise spontaneously from sterile broth","Air itself prevents growth","Microorganisms come from pre-existing contamination rather than spontaneous generation","Broth cannot support microbial growth"],"a":"C","type":"Multiple choice","notes":"C is correct: Microorganisms come from pre-existing contamination rather than spontaneous generation. A is wrong: Microorganisms arise spontaneously from sterile broth. B is wrong: Air itself prevents growth. D is wrong: Broth cannot support microbial growth.","calc":false,"mode":"MCQ"},{"id":"q53","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"29","q":"Which method specifically estimates viable colony-forming units under the chosen culture conditions?","opts":["Plate count","Gram stain alone","Dry mass only","Genome sequencing"],"a":"A","type":"Multiple choice","notes":"A is correct: Plate count. B is wrong: Gram stain alone. C is wrong: Dry mass only. D is wrong: Genome sequencing.","calc":false,"mode":"MCQ"},{"id":"q55","source":"BS1040 Timed Mock","module":"BS1040","topic":"Describe how micro-organisms are used in biotechnology","number":"31","q":"Which observation most strongly supports transduction?","opts":["DNA transfer requires a bacteriophage","DNA transfer is stopped by removing cell contact","Cells take up purified DNA directly","Only plasmids move through a pilus"],"a":"A","type":"Multiple choice","notes":"A is correct: DNA transfer requires a bacteriophage. B is wrong: DNA transfer is stopped by removing cell contact. C is wrong: Cells take up purified DNA directly. D is wrong: Only plasmids move through a pilus.","calc":false,"mode":"MCQ"},{"id":"q56","source":"BS1040 Timed Mock","module":"BS1040","topic":"Describe how micro-organisms are used in biotechnology","number":"32","q":"Which feature defines conjugation most directly?","opts":["Uptake of naked DNA","Phage-mediated transfer","Direct cell-to-cell DNA transfer, often involving a conjugative plasmid","Transfer of protein without nucleic acid"],"a":"C","type":"Multiple choice","notes":"C is correct: Direct cell-to-cell DNA transfer, often involving a conjugative plasmid. A is wrong: Uptake of naked DNA. B is wrong: Phage-mediated transfer. D is wrong: Transfer of protein without nucleic acid.","calc":false,"mode":"MCQ"},{"id":"q57","source":"BS1040 Timed Mock","module":"BS1040","topic":"Describe how micro-organisms are used in biotechnology","number":"33","q":"Extracellular DNase prevents acquisition of a resistance marker. Which mechanism was most likely responsible?","opts":["Transformation","Transduction","Conjugation","Binary fission"],"a":"A","type":"Multiple choice","notes":"A is correct: Transformation. B is wrong: Transduction. C is wrong: Conjugation. D is wrong: Binary fission.","calc":false,"mode":"MCQ"},{"id":"q59","source":"BS1040 Timed Mock","module":"BS1040","topic":"Describe how micro-organisms are used in biotechnology","number":"35","q":"What does an antibiotic-resistance marker on a cloning vector allow you to identify?","opts":["Cells that retained the vector","Cells containing any DNA mutation","Cells that lost the vector","Viruses without nucleic acid"],"a":"A","type":"Multiple choice","notes":"A is correct: Cells that retained the vector. B is wrong: Cells containing any DNA mutation. C is wrong: Cells that lost the vector. D is wrong: Viruses without nucleic acid.","calc":false,"mode":"MCQ"},{"id":"q60","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss similarities and differences in structures and replication between viruses","number":"36","q":"Which component is present in every virion?","opts":["A lipid envelope","Both DNA and RNA","Nucleic acid and a protein capsid","A cellular ribosome"],"a":"C","type":"Multiple choice","notes":"C is correct: Nucleic acid and a protein capsid. A is wrong: A lipid envelope. B is wrong: Both DNA and RNA. D is wrong: A cellular ribosome.","calc":false,"mode":"MCQ"},{"id":"q61","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss similarities and differences in structures and replication between viruses","number":"37","q":"What distinguishes an enveloped virus from a non-enveloped virus?","opts":["The presence of a host-derived lipid bilayer around the capsid","The absence of a genome","The presence of bacterial ribosomes","The ability to infect cells"],"a":"A","type":"Multiple choice","notes":"A is correct: The presence of a host-derived lipid bilayer around the capsid. B is wrong: The absence of a genome. C is wrong: The presence of bacterial ribosomes. D is wrong: The ability to infect cells.","calc":false,"mode":"MCQ"},{"id":"q62","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss similarities and differences in structures and replication between viruses","number":"38","q":"A viral genome can be translated immediately after uncoating. Which genome type is most consistent with this?","opts":["Positive-sense single-stranded RNA","Negative-sense single-stranded RNA without polymerase","Double-stranded DNA that has not been transcribed","A protein-only genome"],"a":"A","type":"Multiple choice","notes":"A is correct: Positive-sense single-stranded RNA. B is wrong: Negative-sense single-stranded RNA without polymerase. C is wrong: Double-stranded DNA that has not been transcribed. D is wrong: A protein-only genome.","calc":false,"mode":"MCQ"},{"id":"q63","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss similarities and differences in structures and replication between viruses","number":"39","q":"Why must a negative-sense RNA virus supply or encode an RNA-dependent RNA polymerase?","opts":["To convert its genome into positive-sense RNA that can be translated","To build a peptidoglycan wall","To make host DNA enter a lysosome","To translate proteins without RNA"],"a":"A","type":"Multiple choice","notes":"A is correct: To convert its genome into positive-sense RNA that can be translated. B is wrong: To build a peptidoglycan wall. C is wrong: To make host DNA enter a lysosome. D is wrong: To translate proteins without RNA.","calc":false,"mode":"MCQ"},{"id":"q64","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss similarities and differences in structures and replication between viruses","number":"40","q":"What must occur before a retroviral RNA genome can become integrated DNA?","opts":["Reverse transcription","Translation into peptidoglycan","Conversion into a protein capsid only","Direct chromosome segregation"],"a":"A","type":"Multiple choice","notes":"A is correct: Reverse transcription. B is wrong: Translation into peptidoglycan. C is wrong: Conversion into a protein capsid only. D is wrong: Direct chromosome segregation.","calc":false,"mode":"MCQ"},{"id":"q65","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss similarities and differences in structures and replication between viruses","number":"41","q":"What does PFU measure most directly?","opts":["All physical virus particles","Infectious units capable of forming plaques under the assay conditions","Only viral proteins","Host-cell concentration"],"a":"B","type":"Multiple choice","notes":"B is correct: Infectious units capable of forming plaques under the assay conditions. A is wrong: All physical virus particles. C is wrong: Only viral proteins. D is wrong: Host-cell concentration.","calc":false,"mode":"MCQ"},{"id":"q66","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss similarities and differences in structures and replication between viruses","number":"42","q":"A virus acquires a mutation. Which conclusion is justified without further evidence?","opts":["It must be more virulent","Its genotype changed, but its effect on phenotype or virulence must be tested","It can no longer replicate","It has become a bacterium"],"a":"B","type":"Multiple choice","notes":"B is correct: Its genotype changed, but its effect on phenotype or virulence must be tested. A is wrong: It must be more virulent. C is wrong: It can no longer replicate. D is wrong: It has become a bacterium.","calc":false,"mode":"MCQ"},{"id":"q67","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells","number":"43","q":"Which cytoskeletal component is the principal structural element of the mitotic spindle?","opts":["Microtubules","Peptidoglycan","Cellulose","Phospholipid tails"],"a":"A","type":"Multiple choice","notes":"A is correct: Microtubules. B is wrong: Peptidoglycan. C is wrong: Cellulose. D is wrong: Phospholipid tails.","calc":false,"mode":"MCQ"},{"id":"q68","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells","number":"44","q":"Which cytoskeletal component is most directly associated with lamellipodia and the contractile ring?","opts":["Actin filaments","Microtubules only","Bacterial flagellin","Collagen fibres"],"a":"A","type":"Multiple choice","notes":"A is correct: Actin filaments. B is wrong: Microtubules only. C is wrong: Bacterial flagellin. D is wrong: Collagen fibres.","calc":false,"mode":"MCQ"},{"id":"q69","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells","number":"45","q":"Which statement about post-translational modifications is best?","opts":["They can alter protein charge, shape, activity or interactions","They always destroy the protein","They occur only in bacteria","They never affect localisation"],"a":"A","type":"Multiple choice","notes":"A is correct: They can alter protein charge, shape, activity or interactions. B is wrong: They always destroy the protein. C is wrong: They occur only in bacteria. D is wrong: They never affect localisation.","calc":false,"mode":"MCQ"},{"id":"q70","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells","number":"46","q":"What is the outcome of meiosis from one diploid precursor, in general terms?","opts":["One DNA replication followed by two divisions produces haploid cells","Two DNA replications followed by one division produces diploid cells","No DNA replication occurs","The chromosome number always doubles"],"a":"A","type":"Multiple choice","notes":"A is correct: One DNA replication followed by two divisions produces haploid cells. B is wrong: Two DNA replications followed by one division produces diploid cells. C is wrong: No DNA replication occurs. D is wrong: The chromosome number always doubles.","calc":false,"mode":"MCQ"},{"id":"q71","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells","number":"47","q":"During meiotic recombination, crossing over normally occurs between which structures?","opts":["Non-sister chromatids of homologous chromosomes","Sister chromatids only","Unrelated proteins","Cell membranes"],"a":"A","type":"Multiple choice","notes":"A is correct: Non-sister chromatids of homologous chromosomes. B is wrong: Sister chromatids only. C is wrong: Unrelated proteins. D is wrong: Cell membranes.","calc":false,"mode":"MCQ"},{"id":"q72","source":"BS1040 Timed Mock","module":"BS1040","topic":"Describe how micro-organisms cause disease","number":"48","q":"Which statement best describes innate immunity?","opts":["Rapid and broadly acting, without antigen-specific adaptive memory","Dependent entirely on antibodies","Present only after vaccination","Specific to one pathogen strain from birth"],"a":"A","type":"Multiple choice","notes":"A is correct: Rapid and broadly acting, without antigen-specific adaptive memory. B is wrong: Dependent entirely on antibodies. C is wrong: Present only after vaccination. D is wrong: Specific to one pathogen strain from birth.","calc":false,"mode":"MCQ"},{"id":"q73","source":"BS1040 Timed Mock","module":"BS1040","topic":"Describe how micro-organisms cause disease","number":"49","q":"How can cholera produce severe watery diarrhoea without extensive killing of intestinal epithelial cells?","opts":["The toxin alters ion transport, causing water secretion","The bacterium removes all intestinal blood vessels","The toxin converts epithelial cells into viruses","The disease is caused only by dehydration before infection"],"a":"A","type":"Multiple choice","notes":"A is correct: The toxin alters ion transport, causing water secretion. B is wrong: The bacterium removes all intestinal blood vessels. C is wrong: The toxin converts epithelial cells into viruses. D is wrong: The disease is caused only by dehydration before infection.","calc":false,"mode":"MCQ"},{"id":"q74","source":"BS1040 Timed Mock","module":"BS1040","topic":"Describe how micro-organisms cause disease","number":"50","q":"What is the principal target of penicillin and related beta-lactam antibiotics?","opts":["Peptidoglycan cell-wall synthesis","Eukaryotic cholesterol synthesis","Viral capsid assembly","Host mitochondrial DNA replication"],"a":"A","type":"Multiple choice","notes":"A is correct: Peptidoglycan cell-wall synthesis. B is wrong: Eukaryotic cholesterol synthesis. C is wrong: Viral capsid assembly. D is wrong: Host mitochondrial DNA replication.","calc":false,"mode":"MCQ"},{"id":"q75","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells","number":"51","q":"Which statement is a fair comparison of typical bacterial and eukaryotic cells?","opts":["Both commonly use double-stranded DNA as genetic material","Bacteria always contain a nucleus","Eukaryotes never contain ribosomes","Only bacteria have plasma membranes"],"a":"A","type":"Multiple choice","notes":"A is correct: Both commonly use double-stranded DNA as genetic material. B is wrong: Bacteria always contain a nucleus. C is wrong: Eukaryotes never contain ribosomes. D is wrong: Only bacteria have plasma membranes.","calc":false,"mode":"MCQ"},{"id":"q76","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain some of the diversity of life on earth","number":"52","q":"Which list correctly gives Woese's three domains?","opts":["Plants, animals and fungi","Bacteria, Archaea and Eukaryotes","Prokaryotes, viruses and eukaryotes","Bacteria, protists and fungi"],"a":"B","type":"Multiple choice","notes":"B is correct: Bacteria, Archaea and Eukaryotes. A is wrong: Plants, animals and fungi. C is wrong: Prokaryotes, viruses and eukaryotes. D is wrong: Bacteria, protists and fungi.","calc":false,"mode":"MCQ"},{"id":"q77","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain some of the diversity of life on earth","number":"53","q":"On a phylogenetic tree, which feature is the best guide to evolutionary relatedness?","opts":["How close names appear on the printed page","The most recent common ancestor indicated by branching order","The colour of each branch","The length of each organism's name"],"a":"B","type":"Multiple choice","notes":"B is correct: The most recent common ancestor indicated by branching order. A is wrong: How close names appear on the printed page. C is wrong: The colour of each branch. D is wrong: The length of each organism's name.","calc":false,"mode":"MCQ"},{"id":"q78","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain some of the diversity of life on earth","number":"54","q":"An internal branch of a phylogenetic tree is rotated around a node. What changes?","opts":["The evolutionary relationships","Only the visual arrangement, not the clades or ancestry","The DNA sequence of every species","The identity of the root"],"a":"B","type":"Multiple choice","notes":"B is correct: Only the visual arrangement, not the clades or ancestry. A is wrong: The evolutionary relationships. C is wrong: The DNA sequence of every species. D is wrong: The identity of the root.","calc":false,"mode":"MCQ"},{"id":"q79","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate competency in numeracy and basic statistical skills","number":"55","q":"Which hypothesis is most scientifically useful?","opts":["Cells are interesting","If aquaporin abundance increases while osmotic conditions are held constant, water permeability will increase","This result will definitely prove the theory","Membranes always behave normally"],"a":"B","type":"Multiple choice","notes":"B is correct: If aquaporin abundance increases while osmotic conditions are held constant, water permeability will increase. A is wrong: Cells are interesting. C is wrong: This result will definitely prove the theory. D is wrong: Membranes always behave normally.","calc":false,"mode":"MCQ"},{"id":"q80","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate competency in numeracy and basic statistical skills","number":"56","q":"Two independent groups are compared for a continuous normally distributed outcome. Which test may be appropriate if assumptions are met?","opts":["Independent-samples t-test","Paired t-test automatically","A test for sequence alignment","No statistical test can compare means"],"a":"A","type":"Multiple choice","notes":"A is correct: Independent-samples t-test. B is wrong: Paired t-test automatically. C is wrong: A test for sequence alignment. D is wrong: No statistical test can compare means.","calc":false,"mode":"MCQ"},{"id":"q81","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"57","q":"Which experimental design gives the strongest test of whether aquaporin abundance affects water permeability?","opts":["Change aquaporin abundance while controlling osmotic gradient, temperature and other relevant variables","Change aquaporins and osmolality at the same time","Measure only one untreated cell and generalise","Choose results after seeing which support the prediction"],"a":"A","type":"Multiple choice","notes":"A is correct: Change aquaporin abundance while controlling osmotic gradient, temperature and other relevant variables. B is incorrect for this stem. C is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ"},{"id":"q82","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate competency in numeracy and basic statistical skills","number":"58","q":"A plate count is repeated three times under identical conditions and gives very different results. What is the best first interpretation?","opts":["The method may have poor precision or uncontrolled variation","The mean is automatically correct","The dilution factor no longer matters","The organism has become a virus"],"a":"A","type":"Multiple choice","notes":"A is correct: The method may have poor precision or uncontrolled variation. B is wrong: The mean is automatically correct. C is wrong: The dilution factor no longer matters. D is wrong: The organism has become a virus.","calc":false,"mode":"MCQ"},{"id":"q83","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate competency in numeracy and basic statistical skills","number":"59","q":"Which action best improves reliability of a quantitative microbiology result?","opts":["Use replicate measurements and a consistent method","Discard every value that differs from expectation","Change several variables between repeats","Report a value without units"],"a":"A","type":"Multiple choice","notes":"A is correct: Use replicate measurements and a consistent method. B is wrong: Discard every value that differs from expectation. C is wrong: Change several variables between repeats. D is wrong: Report a value without units.","calc":false,"mode":"MCQ"},{"id":"q84","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate competency in numeracy and basic statistical skills","number":"60","q":"Which conclusion is most appropriate when an experiment supports a prediction?","opts":["The hypothesis is proven permanently","The result supports the hypothesis under the tested conditions, while alternatives and limitations should still be considered","Every related mechanism is now known","Contradictory evidence can be ignored"],"a":"B","type":"Multiple choice","notes":"B is correct: The result supports the hypothesis under the tested conditions, while alternatives and limitations should still be considered. A is wrong: The hypothesis is proven permanently. C is wrong: Every related mechanism is now known. D is wrong: Contradictory evidence can be ignored.","calc":false,"mode":"MCQ"},{"id":"q85","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"1","q":"Which of the following is a normal component of DNA?","opts":["Adenine","Alanine","AMP","ATP"],"a":"A","type":"Multiple choice","notes":"A is correct: Adenine. B is wrong: Alanine. C is wrong: AMP. D is wrong: ATP.","calc":false,"mode":"MCQ"},{"id":"q86","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"2","q":"In the structure of DNA, the backbone forms by:","opts":["hydrogen bonding between deoxyribose sugars.","hydrogen bonding between nitrogenous bases.","phosphodiester linkages between deoxyribose sugars.","phosphodiester linkages between nitrogenous bases."],"a":"C","type":"Multiple choice","notes":"C is correct: phosphodiester linkages between deoxyribose sugars. A is wrong: hydrogen bonding between deoxyribose sugars. B is wrong: hydrogen bonding between nitrogenous bases. D is wrong: phosphodiester linkages between nitrogenous bases.","calc":false,"mode":"MCQ"},{"id":"q87","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"3","q":"In the structure of DNA most commonly found in cells:","opts":["pairing of pyrimidine with purine bases creates a double helix with a diameter of 0.34 nm.","pairing of pyrimidine with purine bases creates a double helix with a diameter of 2 nm.","pairing of pyrimidine with pyrimidine and purine with purine bases creates a double helix with a diameter of 0.34 nm.","pairing of pyrimidine with pyrimidine and purine with purine bases creates a double helix with a diameter of 2 nm."],"a":"B","type":"Multiple choice","notes":"B is correct: pairing of pyrimidine with purine bases creates a double helix with a diameter of 2 nm. A is incorrect for this stem. C is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ"},{"id":"q88","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"4","q":"During prokaryotic DNA replication, 3' to 5' exonuclease activity is required for:","opts":["proofreading.","removal of supercoils ahead of the replication fork.","RNA primer removal.","unwinding the double helix."],"a":"A","type":"Multiple choice","notes":"A is correct: proofreading. B is wrong: removal of supercoils ahead of the replication fork. C is wrong: RNA primer removal. D is wrong: unwinding the double helix.","calc":false,"mode":"MCQ"},{"id":"q89","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"5","q":"In the replication of prokaryotic DNA, DNA ligase catalyses:","opts":["formation of hydrogen bonds between the template and daughter strands of DNA.","formation of hydrogen bonds between Okazaki fragments.","formation of phosphodiester bonds between the template and daughter strands of DNA.","formation of phosphodiester bonds between Okazaki fragments."],"a":"D","type":"Multiple choice","notes":"D is correct: formation of phosphodiester bonds between Okazaki fragments. A is incorrect for this stem. B is incorrect for this stem. C is incorrect for this stem.","calc":false,"mode":"MCQ"},{"id":"q90","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"6","q":"The enzyme primase, involved in the replication of prokaryotic DNA, is a(n):","opts":["DNA polymerase","helicase","RNA ligase","RNA polymerase"],"a":"D","type":"Multiple choice","notes":"D is correct: RNA polymerase. A is wrong: DNA polymerase. B is wrong: helicase. C is wrong: RNA ligase.","calc":false,"mode":"MCQ"},{"id":"q91","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"7","q":"Regarding the transcription of mRNA, which of the following statements is INCORRECT?","opts":["All the nucleotides that are transcribed will be translated into amino acids.","The nucleotide after the transcription start site is called the +1 nucleotide.","The promoter region is upstream (to the 5' side) of the transcription start site.","The transcription termination site is downstream (to the 3' side) of the transcription start site."],"a":"A","type":"Multiple choice","notes":"A is correct: All the nucleotides that are transcribed will be translated into amino acids. B is incorrect for this stem. C is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ"},{"id":"q92","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"8","q":"The processing of pre-mRNA to mRNA includes:","opts":["addition of a cap at the 5' end.","joining of Okazaki fragments by ligase.","removal of exons.","stabilisation of RNA through addition of a poly-U tail at the 3' end."],"a":"A","type":"Multiple choice","notes":"A is correct: addition of a cap at the 5' end. B is wrong: joining of Okazaki fragments by ligase. C is wrong: removal of exons. D is wrong: stabilisation of RNA through addition of a poly-U tail at the 3' end.","calc":false,"mode":"MCQ"},{"id":"q93","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"9","q":"What does a stop codon in mRNA signal?","opts":["The end of transcription","The end of translation","The coding strand of DNA","The non-coding strand of DNA"],"a":"B","type":"Multiple choice","notes":"A stop codon is read by the ribosome and ends translation. Transcription termination relies on separate DNA/RNA signals, not stop codons.","calc":false,"mode":"MCQ"},{"id":"q94","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"10","q":"Termination of transcription in prokaryotes may involve","opts":["addition of a poly-A tail.","a stem-loop structure in the transcript.","a stop codon.","GTP hydrolysis by release factors."],"a":"B","type":"Multiple choice","notes":"B is correct: a stem-loop structure in the transcript. A is wrong: addition of a poly-A tail. C is wrong: a stop codon. D is wrong: GTP hydrolysis by release factors.","calc":false,"mode":"MCQ"},{"id":"q95","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"11","q":"During the process of translation, ribosomes move in which way?","opts":["along mRNA in the direction 3' to 5', synthesising a polypeptide in the C- to N-terminal direction.","along mRNA in the direction 3' to 5', synthesising a polypeptide in the N- to C-terminal direction.","along mRNA in the direction 5' to 3', synthesising a polypeptide in the C- to N-terminal direction.","along mRNA in the direction 5' to 3', synthesising a polypeptide in the N- to C-terminal direction."],"a":"D","type":"Multiple choice","notes":"D is correct: along mRNA in the direction 5' to 3', synthesising a polypeptide in the N- to C-terminal direction. A is incorrect for this stem. B is incorrect for this stem. C is incorrect for this stem.","calc":false,"mode":"MCQ"},{"id":"q96","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"12","q":"During translation in prokaryotes, the majority of activated tRNA molecules enter the ribosome at the:","opts":["5' end","3' end","A-site.","P-site."],"a":"C","type":"Multiple choice","notes":"C is correct: A-site. A is wrong: 5' end. B is wrong: 3' end. D is wrong: P-site.","calc":false,"mode":"MCQ"},{"id":"q97","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Discuss the relationship between protein structure and function","number":"21","q":"Which of the following best describes the peptide aspartate-alanine-phenylalanine? It contains:","opts":["one amino acid with a hydrophobic side chain and has phenylalanine at its carboxyl (C)-terminus.","one amino acid with a hydrophobic side chain and has phenylalanine at its amino (N)-terminus.","one amino acid with an acidic side chain and has phenylalanine at its carboxyl (C)-terminus.","one amino acid with an acidic side chain and has phenylalanine at its amino (N)-terminus."],"a":"C","type":"Multiple choice","notes":"C is correct: one amino acid with an acidic side chain and has phenylalanine at its carboxyl (C)-terminus. A is incorrect for this stem. B is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ"},{"id":"q98","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Discuss the relationship between protein structure and function","number":"22","q":"The pKa for the side-chain amino group in histidine is 6.0. If working at physiological pH 7.0, what would be the ratio of protonated to unprotonated histidine?","opts":["1:1","1:10","2:1","10:1"],"a":"B","type":"Multiple choice","notes":"B is correct: 1:10. A is wrong: 1:1. C is wrong: 2:1. D is wrong: 10:1.","calc":true,"mode":"MCQ"},{"id":"q99","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Discuss the relationship between protein structure and function","number":"23","q":"Which one of the following statements is FALSE? The alpha-helix:","opts":["has the side chains of hydrophobic amino acids oriented towards the centre of the helix.","is a right-handed helix.","is stabilised by hydrogen bonds between N-H and C=O groups in peptide bonds.","is disrupted by the amino acid proline."],"a":"A","type":"Multiple choice","notes":"A is correct: has the side chains of hydrophobic amino acids oriented towards the centre of the helix. B is incorrect for this stem. C is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ"},{"id":"q100","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"34","q":"Which bases are lost during depurination?","opts":["Adenine and Guanine","Thymine and Adenine","Thymine and Uracil","Cytosine and Guanine"],"a":"A","type":"Multiple choice","notes":"A is correct: Adenine and Guanine. B is wrong: Thymine and Adenine. C is wrong: Thymine and Uracil. D is wrong: Cytosine and Guanine.","calc":false,"mode":"MCQ"},{"id":"q101","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"35","q":"Which of the following can cause spontaneous mutations in DNA?","opts":["alkylating agents","deamination of cytosine","errors in RNA polymerase action","intercalating agents"],"a":"B","type":"Multiple choice","notes":"B is correct: deamination of cytosine. A is wrong: alkylating agents. C is wrong: errors in RNA polymerase action. D is wrong: intercalating agents.","calc":false,"mode":"MCQ"},{"id":"q102","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"36","q":"A point mutation that occurs in the protein-coding region of a gene where one nucleotide is added to the DNA is known as a:","opts":["frameshift mutation.","missense mutation.","promoter mutation.","silent mutation."],"a":"A","type":"Multiple choice","notes":"A is correct: frameshift mutation. B is wrong: missense mutation. C is wrong: promoter mutation. D is wrong: silent mutation.","calc":false,"mode":"MCQ"},{"id":"q103","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"37","q":"What is the correct order of events in Base Excision Repair?","opts":["base excision, cutting sugar-phosphate backbone, polymerisation, ligation","base excision, polymerisation, cutting sugar-phosphate backbone, ligation","cutting sugar-phosphate backbone, base excision, polymerisation, ligation","cutting sugar-phosphate backbone, base excision, ligation, polymerisation"],"a":"A","type":"Multiple choice","notes":"A is correct: base excision, cutting sugar-phosphate backbone, polymerisation, ligation. B is wrong: base excision, polymerisation, cutting sugar-phosphate backbone, ligation. C is wrong: cutting sugar-phosphate backbone, base excision, polymerisation, ligation. D is wrong: cutting sugar-phosphate backbone, base excision, ligation, polymerisation.","calc":false,"mode":"MCQ"},{"id":"q104","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"38","q":"Which type of DNA repair is most prone to errors?","opts":["base excision repair","double-strand break repair","mismatch repair","single-strand break repair"],"a":"B","type":"Multiple choice","notes":"B is correct: double-strand break repair. A is wrong: base excision repair. C is wrong: mismatch repair. D is wrong: single-strand break repair.","calc":false,"mode":"MCQ"},{"id":"q105","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"39","q":"The polymerase chain reaction involves repeated cycles of three reactions at different temperatures. The denaturation reaction takes place at:","opts":["37 °C","60 °C","72 °C","95 °C"],"a":"D","type":"Multiple choice","notes":"Around 95 °C separates the DNA strands. Around 50–65 °C is typically used for primer annealing and around 72 °C for extension with Taq polymerase.","calc":false,"mode":"MCQ"},{"id":"q106","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"52","q":"Which statement is correct regarding production and utilisation of ketone bodies by adipocytes and hepatocytes (liver cells)? Ketone bodies are:","opts":["produced exclusively in adipocytes and utilised by hepatocytes as fuel in starvation.","produced exclusively in adipocytes and utilised by them as fuel in starvation.","produced exclusively in hepatocytes but cannot be utilised by them as fuel in starvation.","produced exclusively in hepatocytes and utilised by them as fuel in starvation."],"a":"C","type":"Multiple choice","notes":"C is correct: produced exclusively in hepatocytes but cannot be utilised by them as fuel in starvation. A is incorrect for this stem. B is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ"},{"id":"q107","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"53","q":"How many molecules of ATP would be produced by complete oxidation of one molecule of palmitic acid (16C)?","opts":["6","26","56","106"],"a":"D","type":"Multiple choice","notes":"D is correct: 106. A is wrong: 6. B is wrong: 26. C is wrong: 56.","calc":true,"mode":"MCQ"},{"id":"q108","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"54","q":"Which one of the following amino acids is NOT glucogenic?","opts":["alanine","asparagine","leucine","phenylalanine"],"a":"C","type":"Multiple choice","notes":"C is correct: leucine. A is wrong: alanine. B is wrong: asparagine. D is wrong: phenylalanine.","calc":false,"mode":"MCQ"},{"id":"q109","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"55","q":"What best describes the reaction catalysed by glutamate dehydrogenase?","opts":["a hydrolysis reaction, in which the enzyme can use either NAD+ or NADP+ as a cofactor.","an oxidative deamination, in which the enzyme can use either NAD+ or NADP+ as a cofactor.","an oxidative decarboxylation, in which the enzyme can use either NAD+ or NADP+ as a cofactor.","a transamination, in which the enzyme can use either NAD+ or NADP+ as a cofactor."],"a":"B","type":"Multiple choice","notes":"B is correct: an oxidative deamination, in which the enzyme can use either NAD+ or NADP+ as a cofactor. A is incorrect for this stem. C is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ"},{"id":"q110","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"56","q":"Which of the following amino acids transfers a nitrogen directly into the urea cycle?","opts":["alanine","aspartate","glycine","ornithine"],"a":"B","type":"Multiple choice","notes":"B is correct: aspartate. A is wrong: alanine. C is wrong: glycine. D is wrong: ornithine.","calc":false,"mode":"MCQ"},{"id":"q111","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"57","q":"Gluconeogenesis is a process in the liver by which glucose can be synthesised from:","opts":["alanine, fatty acids and glycerol.","alanine, fatty acids and lactate or pyruvate.","alanine, glycogen and fatty acids.","alanine, lactate or pyruvate, and glycerol."],"a":"D","type":"Multiple choice","notes":"D is correct: alanine, lactate or pyruvate, and glycerol. A is wrong: alanine, fatty acids and glycerol. B is wrong: alanine, fatty acids and lactate or pyruvate. C is wrong: alanine, glycogen and fatty acids.","calc":false,"mode":"MCQ"},{"id":"q112","source":"BS1040 Study Material","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"1","q":"Why can an osmotic gradient increase water movement without increasing permeability?","opts":[],"a":"The gradient changes the driving force, while permeability depends on membrane properties such as lipid composition and aquaporins.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q113","source":"BS1040 Study Material","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"2","q":"What happens if K+ release is blocked during hypotonic stress?","opts":[],"a":"Swelling is likely to persist, increasing the risk of membrane damage or lysis.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q114","source":"BS1040 Study Material","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"3","q":"Why may OD be high when CFU is low?","opts":[],"a":"OD includes scattering from nonviable cells and debris, whereas CFU counts colony-forming units under the culture conditions.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q115","source":"BS1040 Study Material","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"4","q":"What does a rising growth-curve segment usually indicate?","opts":[],"a":"Exponential growth: nutrients are not yet strongly limiting and cells are actively dividing.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q118","source":"BS1040 Study Material","module":"BS1040","topic":"Describe how micro-organisms cause disease","number":"7","q":"What is variolation?","opts":[],"a":"Deliberate inoculation with smallpox material to induce protection.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q120","source":"BS1040 Study Material","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"9","q":"What is an endosome?","opts":[],"a":"A membrane-bound sorting compartment entered during endocytosis.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q122","source":"BS1040 Study Material","module":"BS1040","topic":"Discuss similarities and differences in structures and replication between viruses","number":"11","q":"What is MOI?","opts":[],"a":"Multiplicity of infection (MOI) is the ratio of infectious units added to the number of target cells.","type":"Short answer","notes":"MOI describe
