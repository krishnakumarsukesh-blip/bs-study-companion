ign-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lecture{border-left:5px solid var(--cyan)}.lecture h3{margin:0 0 5px}.pill{display:inline-block;background:#cffafe;color:#155e75;padding:5px 8px;border-radius:99px;font-size:12px;font-weight:800;margin:3px}.bar{height:8px;background:#e7e2d8;border-radius:8px;overflow:hidden;margin:12px 0}.bar i{height:100%;display:block;background:var(--cyan)}.card{max-width:800px;margin:18px auto;background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--cyan);border-radius:18px;padding:clamp(20px,5vw,40px)}.chips span{display:inline-block;background:#e0f2fe;color:#075985;border-radius:99px;padding:5px 8px;margin:2px;font-size:12px}.options{display:grid;gap:10px;margin:20px 0}.options button{text-align:left;padding:14px;border:1px solid var(--line);background:white;border-radius:10px}.options button.correct{border-color:var(--green);background:#dcfce7}.options button.wrong{border-color:var(--red);background:#fee2e2}.feedback{padding:15px;border-radius:11px;margin-top:16px;background:#f1f5f9}.feedback.good{background:#dcfce7}.feedback.bad{background:#fee2e2}.studytop{max-width:800px;margin:auto;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.prog{height:8px;background:#ddd6c8;border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--amber)}textarea{width:100%;min-height:110px;padding:12px;border:1px solid var(--line);border-radius:10px}.muted{color:var(--muted);font-size:13px}.finish{text-align:center;max-width:700px;margin:50px auto}.library article{padding:12px 0;border-bottom:1px solid var(--line)}.error{border-left:5px solid var(--red)}footer{display:none}@media(max-width:760px){header nav{display:none}.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.goal{width:82px;height:82px}footer{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--ink);z-index:12}footer button{border:0;background:transparent;color:white;padding:9px 3px}footer small{display:block;font-size:10px}.focus button{margin-left:0;width:100%}}

.content-groups{display:grid;gap:18px}.group-title{display:flex;align-items:center;gap:10px;margin:26px 0 8px}.group-title span{font-size:12px;font-weight:800;background:#e0f2fe;color:#075985;padding:5px 8px;border-radius:99px}.advanced{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}.advanced summary{cursor:pointer;font-weight:800}.type-tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:#ede9fe;color:#5b21b6;padding:4px 7px;border-radius:99px;margin-bottom:7px}

.coverage-list{display:grid;gap:8px;margin-top:12px}.coverage-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 12px;background:white;border:1px solid var(--line);border-radius:10px}.coverage-mark{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:#e5e7eb;color:#4b5563}.coverage-mark.started{background:#fef3c7;color:#92400e}.coverage-mark.covered{background:#d1fae5;color:#065f46}.coverage-row small{color:var(--muted)}

const BUILTIN_BANK=[{"id":"q1","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"1","q":"Why are phosphates charged at neutral pH?","opts":[],"a":"Phosphate groups are negatively charged at neutral pH because their acidic protons have pKa values below neutral pH and are therefore largely dissociated.","type":"Short answer","notes":"At pH values above an acid’s pKa, deprotonation is favoured. The phosphate groups in nucleic acids therefore carry negative charge near pH 7.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q2","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"2","q":"What is the difference between DNA and RNA?","opts":[],"a":"DNA contains 2′-deoxyribose, whereas RNA contains ribose with a 2′-hydroxyl group.","type":"Short answer","notes":"The chemically important distinction is the 2′-OH present in RNA but absent from DNA; the bases also differ because DNA normally uses thymine and RNA uses uracil.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q3","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"3","q":"DNA contains deoxyribose, whereas RNA contains ribose with a 2′-OH group. How does this difference affect polymer stability?","opts":[],"a":"The lack of the slightly reactive C2-OH means that DNA is more stable than RNA","type":"Short answer","notes":"The lack of the slightly reactive C2-OH means that DNA is more stable than RNA.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q4","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"4","q":"Why are purine–purine and pyrimidine–pyrimidine base pairs not normally found in duplex DNA?","opts":[],"a":"They could not form optimal complementary \"Watson-Crick\" base pairs, but more importantly they would cause a narrowing or widening of the spacing between the DNA strands.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q5","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"5","q":"How many carbon atoms are in the ring of a ribose sugar?","opts":[],"a":"Four carbon atoms are in the five-membered ribose ring; the fifth ring atom is oxygen, and carbon 5′ lies outside the ring.","type":"Short answer","notes":"Ribose is a five-membered furanose ring containing four carbons and one oxygen.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q6","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"6","q":"What is a beta-glycosidic bond? How does it differ from a phosphodiester bond?","opts":[],"a":"A beta-glycosidic bond joins a nitrogenous base to the 1′ carbon of a pentose sugar. A phosphodiester bond links the 3′ and 5′ carbons of adjacent sugars through phosphate, forming the nucleic-acid backbone.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q7","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"7","q":"Why do we say that single stranded DNA is polar, but DNA duplexes are not polar?","opts":[],"a":"One strand of DNA has a 5' end and a 3' end. Duplex DNA has both 5' and 3' ends at each end of the duplex.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q8","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"8","q":"What is the sequence hypothesis?","opts":[],"a":"The sequence of bases in DNA determines the sequence of amino acids in proteins.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q9","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"9","q":"List the main interactions that determine macromolecular structure, from strongest to weakest.","opts":[],"a":"Covalent bonds - Electrostatic bonds - Hydrogen bonds - Van der Waals interactions.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q10","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","number":"10","q":"Which type of bond is generally not used as a reversible interaction between two separate macromolecules, and why?","opts":[],"a":"Covalent bonds - if there were covalent interactions between \"two\" macromolecules they would be \"one\" macromolecule","type":"Short answer","notes":"Covalent bonds - if there were covalent interactions between \"two\" macromolecules they would be \"one\" macromolecule.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q11","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"11","q":"What suggests the DNA is helical?","opts":[],"a":"The \"X\" shaped diffraction pattern.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q12","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"12","q":"How does a DNA double helix differ from a protein α-helix?","opts":[],"a":"A DNA double helix consists of two antiparallel nucleic-acid strands held together by base pairing. A protein α-helix is a single polypeptide segment stabilised by backbone hydrogen bonds.","type":"Short answer","notes":"The structures involve different polymers and different stabilising interactions: inter-strand base pairing in DNA versus intra-chain backbone hydrogen bonding in an α-helix.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q13","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"13","q":"How can DNA-binding proteins (such as restriction enzymes) recognise the base sequence in a DNA duplex?","opts":[],"a":"They can \"recognise\" the edges of the base-pairs in the major groove","type":"Short answer","notes":"They can \"recognise\" the edges of the base-pairs in the major groove.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q14","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"14","q":"Why do DNA circles or constrained loops help DNA packaging?","opts":[],"a":"They can be super-coiled to increase local density. This is effectively one of the functions of the histone octamers.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q15","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"15","q":"What are the conditions needed for two DNA strands to re-anneal?","opts":[],"a":"They must have complementary sequence and be annealed by slow cooling.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q16","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"16","q":"Why are restriction enzymes useful to microorganisms?","opts":[],"a":"They serve a protective role by degrading foreign DNA","type":"Short answer","notes":"They serve a protective role by degrading foreign DNA.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q17","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"17","q":"Why are restriction enzymes useful to molecular biologists?","opts":[],"a":"They enable us to create DNA fragments with complementary sticky ends that can be joined together using DNA ligase.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q18","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"18","q":"What are the three enzymatic activities of bacterial DNA polymerase I?","opts":[],"a":"5′→3′ DNA polymerase; 3′→5′ proofreading exonuclease; and 5′→3′ exonuclease.","type":"Short answer","notes":"The polymerase activity extends DNA, the 3′→5′ exonuclease proofreads, and the 5′→3′ exonuclease removes nucleotides ahead of the enzyme, including RNA primers.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q19","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"19","q":"How does the DNA clamp (two beta-subunits of DNA Pol III) contribute to the activity of the polymerase enzyme?","opts":[],"a":"It reduces dissociation from the DNA template and thereby increases processivity","type":"Short answer","notes":"It reduces dissociation from the DNA template and thereby increases processivity.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q21","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"21","q":"What is a replication fork?","opts":[],"a":"A replication fork is the Y-shaped region where parental DNA strands separate and are copied by the replication machinery.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q22","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"22","q":"Why do we call one strand discontinuous? Why must it be like that?","opts":[],"a":"It is discontinuous because the DNA is copied in \"Okazaki fragments\" because DNA polymerases can only replicate DNA in the 5' to 3' direction.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q23","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"23","q":"Which enzymes act at or close to a bacterial DNA replication fork?","opts":[],"a":"Helicase, primase, DNA polymerase III and the sliding clamp act directly at the bacterial replication fork. DNA polymerase I and ligase mainly process Okazaki fragments behind the fork.","type":"Short answer","notes":"The original answer placed DNA polymerase I and ligase at the fork itself; their principal roles are primer removal, gap filling and nick sealing behind the moving replisome.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q24","source":"BS1030 Self-test questions","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"24","q":"Which enzymes support bacterial DNA replication without necessarily remaining at the replication fork?","opts":[],"a":"DNA gyrase relieves torsional strain ahead of the fork, and pyrophosphatase helps drive nucleotide addition by hydrolysing pyrophosphate.","type":"Short answer","notes":"These enzymes support replication without being core components of the polymerase complex at the fork.","calc":false,"mode":"Flashcard","lecture":"BS1030 Self-test questions"},{"id":"q25","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"1","q":"Which statement best explains why phospholipids spontaneously form bilayers in water?","opts":["Their hydrophilic tails bind one another covalently","Their hydrophobic tails cluster away from water while hydrophilic heads face water","Their phosphate groups move into the bilayer centre","Every phospholipid is permanently attached to a membrane protein"],"a":"B","type":"Multiple choice","notes":"B is correct: Their hydrophobic tails cluster away from water while hydrophilic heads face water. A is incorrect for this stem. C is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q26","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"2","q":"A cell is transferred to a hypotonic solution. What is the most immediate expected change?","opts":["Water leaves the cell and it shrinks","Water enters the cell and it swells","K+ enters and water follows immediately","The plasma membrane becomes impermeable to water"],"a":"B","type":"Multiple choice","notes":"B is correct: Water enters the cell and it swells. A is wrong: Water leaves the cell and it shrinks. C is wrong: K+ enters and water follows immediately. D is wrong: The plasma membrane becomes impermeable to water.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q27","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"3","q":"During regulatory volume decrease, why does loss of intracellular K+ help a swollen cell recover?","opts":["It raises intracellular osmolality","It lowers intracellular osmolality so water can leave","It directly digests excess water","It makes the membrane completely rigid"],"a":"B","type":"Multiple choice","notes":"B is correct: It lowers intracellular osmolality so water can leave. A is wrong: It raises intracellular osmolality. C is wrong: It directly digests excess water. D is wrong: It makes the membrane completely rigid.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q28","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"4","q":"The osmotic gradient is unchanged, but a cell inserts more aquaporins into its membrane. What is most likely?","opts":["Water permeability and water flux increase","Water permeability decreases but flux increases","Only solute permeability increases","No membrane property changes"],"a":"A","type":"Multiple choice","notes":"A is correct: Water permeability and water flux increase. B is wrong: Water permeability decreases but flux increases. C is wrong: Only solute permeability increases. D is wrong: No membrane property changes.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q29","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"5","q":"Which statement correctly distinguishes water flux from membrane permeability?","opts":["Flux is a membrane property only; permeability is the driving force","Flux is movement per unit time; permeability describes how readily the membrane permits movement","They are identical terms","Permeability always increases when osmolality increases"],"a":"B","type":"Multiple choice","notes":"B is correct: Flux is movement per unit time; permeability describes how readily the membrane permits movement. A is incorrect for this stem. C is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q30","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"6","q":"An inhibitor prevents ATP hydrolysis by an ABC transporter. What is the most direct consequence?","opts":["Transport driven by that ABC protein decreases or stops","Passive diffusion through the lipid bilayer accelerates","All membrane proteins are degraded","The transported solute is converted into ATP"],"a":"A","type":"Multiple choice","notes":"A is correct: Transport driven by that ABC protein decreases or stops. B is wrong: Passive diffusion through the lipid bilayer accelerates. C is wrong: All membrane proteins are degraded. D is wrong: The transported solute is converted into ATP.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q31","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"7","q":"A receptor-bound ligand is internalised by receptor-mediated endocytosis. Which compartment does it usually enter first?","opts":["Nucleus","Early endosome","Mitochondrial matrix","Golgi trans face"],"a":"B","type":"Multiple choice","notes":"B is correct: Early endosome. A is wrong: Nucleus. C is wrong: Mitochondrial matrix. D is wrong: Golgi trans face.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q32","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"8","q":"Which route best describes recycling of an internalised plasma-membrane receptor?","opts":["Early endosome -> recycling endosome -> plasma membrane","Lysosome -> nucleus -> plasma membrane","ER -> lysosome -> mitochondrion","Plasma membrane -> nucleolus -> Golgi"],"a":"A","type":"Multiple choice","notes":"A is correct: Early endosome -> recycling endosome -> plasma membrane. B is wrong: Lysosome -> nucleus -> plasma membrane. C is wrong: ER -> lysosome -> mitochondrion. D is wrong: Plasma membrane -> nucleolus -> Golgi.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q33","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"9","q":"Which sequence best represents a common degradative endocytic pathway?","opts":["Plasma membrane -> early endosome -> late endosome -> lysosome","Plasma membrane -> nucleus -> peroxisome","Golgi -> ribosome -> lysosome","Early endosome -> ER -> chloroplast"],"a":"A","type":"Multiple choice","notes":"A is correct: Plasma membrane -> early endosome -> late endosome -> lysosome. B is wrong: Plasma membrane -> nucleus -> peroxisome. C is wrong: Golgi -> ribosome -> lysosome. D is wrong: Early endosome -> ER -> chloroplast.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q34","source":"BS1 rt all RNA without selection.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q37","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"13","q":"A secreted protein is being synthesised. Which pathway is most appropriate?","opts":["Free ribosome -> nucleus -> plasma membrane","Rough ER -> Golgi apparatus -> secretory vesicle -> plasma membrane","Lysosome -> peroxisome -> cytosol","Mitochondrion -> nucleus -> Golgi"],"a":"B","type":"Multiple choice","notes":"B is correct: Rough ER -> Golgi apparatus -> secretory vesicle -> plasma membrane. A is wrong: Free ribosome -> nucleus -> plasma membrane. C is wrong: Lysosome -> peroxisome -> cytosol. D is wrong: Mitochondrion -> nucleus -> Golgi.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q38","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"14","q":"Which organelle is especially associated with protein modification and the start of the secretory pathway?","opts":["Rough endoplasmic reticulum","Centrosome","Nucleolus","Peroxisome only"],"a":"A","type":"Multiple choice","notes":"A is correct: Rough endoplasmic reticulum. B is wrong: Centrosome. C is wrong: Nucleolus. D is wrong: Peroxisome only.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q39","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells","number":"15","q":"Where do oxidative-phosphorylation reactions occur in a eukaryotic cell?","opts":["Cytosol","Inner mitochondrial membrane","Nuclear envelope only","Lysosomal lumen"],"a":"B","type":"Multiple choice","notes":"B is correct: Inner mitochondrial membrane. A is wrong: Cytosol. C is wrong: Nuclear envelope only. D is wrong: Lysosomal lumen.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q40","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","number":"16","q":"A plate contains 42 colonies after 0.20 ml of a 10⁻⁵ dilution is plated. What was the original concentration?","opts":["2.1 × 10⁵ CFU ml⁻¹","2.1 × 10⁶ CFU ml⁻¹","2.1 × 10⁷ CFU ml⁻¹","8.4 × 10⁷ CFU ml⁻¹"],"a":"C","type":"Multiple choice","notes":"CFU ml⁻¹ = 42 ÷ (0.20 × 10⁻⁵) = 2.1 × 10⁷. The other values result from omitting or misapplying the plated volume or dilution factor.","calc":true,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q41","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","number":"17","q":"A count of 60 plaques is obtained from 0.10 ml of a 10^-7 dilution. What is the original titre?","opts":["6.0 × 10⁷ PFU ml⁻¹","6.0 × 10⁸ PFU ml⁻¹","6.0 × 10⁹ PFU ml⁻¹","6.0 × 10¹⁰ PFU ml⁻¹"],"a":"C","type":"Multiple choice","notes":"PFU ml⁻¹ = 60 ÷ (0.10 × 10⁻⁷) = 6.0 × 10⁹. The other options mis-handle the plated volume or dilution exponent.","calc":true,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q42","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","number":"18","q":"You have 2 x 10^6 cells and require an MOI of 5. How many infectious units are needed?","opts":["4 x 10^5","2 x 10^6","1 x 10^7","1 x 10^8"],"a":"C","type":"Multiple choice","notes":"C is correct: 1 x 10^7. A is wrong: 4 x 10^5. B is wrong: 2 x 10^6. D is wrong: 1 x 10^8.","calc":true,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q43","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","number":"19","q":"A viral stock is 5 x 10^8 PFU/ml. What volume supplies 1 x 10^8 PFU?","opts":["0.02 ml","0.20 ml","2.0 ml","5.0 ml"],"a":"B","type":"Multiple choice","notes":"Volume = required PFU ÷ stock concentration = 1 × 10⁸ ÷ 5 × 10⁸ = 0.20 ml. The other options are tenfold or larger volume errors.","calc":true,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q44","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"20","q":"Why can optical density remain high when a viable-count result is low?","opts":["Optical density detects only living cells","Dead cells and debris can still scatter light","CFU counts every physical particle","Optical density measures DNA sequence"],"a":"B","type":"Multiple choice","notes":"B is correct: Dead cells and debris can still scatter light. A is wrong: Optical density detects only living cells. C is wrong: CFU counts every physical particle. D is wrong: Optical density measures DNA sequence.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q45","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"21","q":"What mainly occurs during the lag phase of a batch-culture growth curve?","opts":["Cells adapt to the new conditions before maximal division","The viable count necessarily falls to zero","Nutrients are unlimited and division is maximal","Cell division exactly balances cell death"],"a":"A","type":"Multiple choice","notes":"A is correct: Cells adapt to the new conditions before maximal division. B is wrong: The viable count necessarily falls to zero. C is wrong: Nutrients are unlimited and division is maximal. D is wrong: Cell division exactly balances cell death.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q46","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"22","q":"Which description best fits exponential phase?","opts":["Cells divide at an approximately maximal and regular rate","Cells never divide","Growth equals death exactly","Only secondary metabolites can be produced"],"a":"A","type":"Multiple choice","notes":"A is correct: Cells divide at an approximately maximal and regular rate. B is wrong: Cells never divide. C is wrong: Growth equals death exactly. D is wrong: Only secondary metabolites can be produced.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q47","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"23","q":"What best characterises stationary phase in a closed batch culture?","opts":["Growth rate exceeds death indefinitely","Overall cell number is relatively stable because growth and death are balanced or net growth has ceased","Every cell is metabolically inactive","The culture has returned to lag phase"],"a":"B","type":"Multiple choice","notes":"B is correct: Overall cell number is relatively stable because growth and death are balanced or net growth has ceased. A is incorrect for this stem. C is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q48","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"24","q":"In microbial nutritional classification, what does 'photo-' specify?","opts":["Carbon source","Energy source","Electron acceptor only","Cell-wall type"],"a":"B","type":"Multiple choice","notes":"B is correct: Energy source. A is wrong: Carbon source. C is wrong: Electron acceptor only. D is wrong: Cell-wall type.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q49","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"25","q":"What does 'heterotroph' specify?","opts":["Use of organic carbon as a carbon source","Use of light as energy","Use of inorganic electron donors only","Complete inability to use carbon"],"a":"A","type":"Multiple choice","notes":"A is correct: Use of organic carbon as a carbon source. B is wrong: Use of light as energy. C is wrong: Use of inorganic electron donors only. D is wrong: Complete inability to use carbon.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q50","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"26","q":"Which statement about secondary metabolites is most accurate?","opts":["They are always essential for basic growth","They are often produced in later growth phases and are not directly required for basic growth","They are identical to ATP","They can be produced only by viruses"],"a":"B","type":"Multiple choice","notes":"B is correct: They are often produced in later growth phases and are not directly required for basic growth. A is incorrect for this stem. C is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q52","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"28","q":"What main conclusion came from Pasteur's swan-neck flask experiments?","opts":["Microorganisms arise spontaneously from sterile broth","Air itself prevents growth","Microorganisms come from pre-existing contamination rather than spontaneous generation","Broth cannot support microbial growth"],"a":"C","type":"Multiple choice","notes":"C is correct: Microorganisms come from pre-existing contamination rather than spontaneous generation. A is wrong: Microorganisms arise spontaneously from sterile broth. B is wrong: Air itself prevents growth. D is wrong: Broth cannot support microbial growth.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q53","source":"BS1040 Timed Mock","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"29","q":"Which method specifically estimates viable colony-forming units under the chosen culture conditions?","opts":["Plate count","Gram stain alone","Dry mass only","Genome sequencing"],"a":"A","type":"Multiple choice","notes":"A is correct: Plate count. B is wrong: Gram stain alone. C is wrong: Dry mass only. D is wrong: Genome sequencing.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q55","source":"BS1040 Timed Mock","module":"BS1040","topic":"Describe how micro-organisms are used in biotechnology","number":"31","q":"Which observation most strongly supports transduction?","opts":["DNA transfer requires a bacteriophage","DNA transfer is stopped by removing cell contact","Cells take up purified DNA directly","Only plasmids move through a pilus"],"a":"A","type":"Multiple choice","notes":"A is correct: DNA transfer requires a bacteriophage. B is wrong: DNA transfer is stopped by removing cell contact. C is wrong: Cells take up purified DNA directly. D is wrong: Only plasmids move through a pilus.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q56","source":"BS1040 Timed Mock","module":"BS1040","topic":"Describe how micro-organisms are used in biotechnology","number":"32","q":"Which feature defines conjugation most directly?","opts":["Uptake of naked DNA","Phage-mediated transfer","Direct cell-to-cell DNA transfer, often involving a conjugative plasmid","Transfer of protein without nucleic acid"],"a":"C","type":"Multiple choice","notes":"C is correct: Direct cell-to-cell DNA transfer, often involving a conjugative plasmid. A is wrong: Uptake of naked DNA. B is wrong: Phage-mediated transfer. D is wrong: Transfer of protein without nucleic acid.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q57","source":"BS1040 Timed Mock","module":"BS1040","topic":"Describe how micro-organisms are used in biotechnology","number":"33","q":"Extracellular DNase prevents acquisition of a resistance marker. Which mechanism w lication occurs","The chromosome number always doubles"],"a":"A","type":"Multiple choice","notes":"A is correct: One DNA replication followed by two divisions produces haploid cells. B is wrong: Two DNA replications followed by one division produces diploid cells. C is wrong: No DNA replication occurs. D is wrong: The chromosome number always doubles.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q71","source":"BS1040 Timed Mock","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells","number":"47","q":"During meiotic recombination, crossing over normally occurs between which structures?","opts":["Non-sister chromatids of homologous chromosomes","Sister chromatids only","Unrelated proteins","Cell membranes"],"a":"A","type":"Multiple choice","notes":"A is correct: Non-sister chromatids of homologous chromosomes. B is wrong: Sister chromatids only. C is wrong: Unrelated proteins. D is wrong: Cell membranes.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q72","source":"BS1040 Timed Mock","module":"BS1040","topic":"Describe how micro-organisms cause disease","number":"48","q":"Which statement best describes innate immunity?","opts":["Rapid and broadly acting, without antigen-specific adaptive memory","Dependent entirely on antibodies","Present only after vaccination","Specific to one pathogen strain from birth"],"a":"A","type":"Multiple choice","notes":"A is correct: Rapid and broadly acting, without antigen-specific adaptive memory. B is wrong: Dependent entirely on antibodies. C is wrong: Present only after vaccination. D is wrong: Specific to one pathogen strain from birth.","calc":false,"mode":"MCQ","lecture":"BS1040 Timed Mock"},{"id":"q73","source":"BS1040 Timed Mock","module":"BS1040","topic":"Describe how micro-organisms cause disease","number":"49","q":"How can cholera produce severe watery diarrhoea without extensive killing of intestinal epithelial cells?","opts":["The toxin alters ion tra ino acid with an acidic side chain and has phenylalanine at its carboxyl (C)-terminus. A is incorrect for this stem. B is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ","lecture":"Biochemistry Practice Paper"},{"id":"q98","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Discuss the relationship between protein structure and function","number":"22","q":"The pKa for the side-chain amino group in histidine is 6.0. If working at physiological pH 7.0, what would be the ratio of protonated to unprotonated histidine?","opts":["1:1","1:10","2:1","10:1"],"a":"B","type":"Multiple choice","notes":"B is correct: 1:10. A is wrong: 1:1. C is wrong: 2:1. D is wrong: 10:1.","calc":true,"mode":"MCQ","lecture":"Biochemistry Practice Paper"},{"id":"q99","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Discuss the relationship between protein structure and function","number":"23","q":"Which one of the following statements is FALSE? The alpha-helix:","opts":["has the side chains of hydrophobic amino acids oriented towards the centre of the helix.","is a right-handed helix.","is stabilised by hydrogen bonds between N-H and C=O groups in peptide bonds.","is disrupted by the amino acid proline."],"a":"A","type":"Multiple choice","notes":"A is correct: has the side chains of hydrophobic amino acids oriented towards the centre of the helix. B is incorrect for this stem. C is incorrect for this stem. D is incorrect for this stem.","calc":false,"mode":"MCQ","lecture":"Biochemistry Practice Paper"},{"id":"q100","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"34","q":"Which bases are lost during depurination?","opts":["Adenine and Guanine","Thymine and Adenine","Thymine and Uracil","Cytosine and Guanine"],"a":"A","type":"Multiple choice","notes":"A is correct: Adenine and Guanine. B is wrong: Thymine and Adenine. C is wrong: Thymine and Uracil. D is wrong: Cytosine and Guanine.","calc":false,"mode":"MCQ","lecture":"Biochemistry Practice Paper"},{"id":"q101","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"35","q":"Which of the following can cause spontaneous mutations in DNA?","opts":["alkylating agents","deamination of cytosine","errors in RNA polymerase action","intercalating agents"],"a":"B","type":"Multiple choice","notes":"B is correct: deamination of cytosine. A is wrong: alkylating agents. C is wrong: errors in RNA polymerase action. D is wrong: intercalating agents.","calc":false,"mode":"MCQ","lecture":"Biochemistry Practice Paper"},{"id":"q102","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"36","q":"A point mutation that occurs in the protein-coding region of a gene where one nucleotide is added to the DNA is known as a:","opts":["frameshift mutation.","missense mutation.","promoter mutation.","silent mutation."],"a":"A","type":"Multiple choice","notes":"A is correct: frameshift mutation. B is wrong: missense mutation. C is wrong: promoter mutation. D is wrong: silent mutation.","calc":false,"mode":"MCQ","lecture":"Biochemistry Practice Paper"},{"id":"q103","source":"Biochemistry Practice Paper","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","number":"37","q":"What is the correct order of events in Base Excision Repair?","opts":["base excision, cutting sugar-phosphate backbone, polymerisation, ligation","base excision, polymerisation, cutting sugar-phosphate backbone, ligation","cutting sugar-phosphate backbone, base excision, polymerisation, ligation","cutting sugar-phosphate backbone, base excision, ligation, polymerisation"],"a":"A","type":"Multiple choice","notes":"A is correct: base excision, cutti
