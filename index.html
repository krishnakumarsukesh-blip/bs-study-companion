 "number": "3", "q": "How does this difference affect the stability of these polymers?", "opts": [], "a": "The lack of the slightly reactive C2-OH means that DNA is more stable than RNA", "type": "Short answer", "notes": "Why: The lack of the slightly reactive C2-OH means that DNA is more stable than RNA. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q4", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Chemistry of nucleic acids", "number": "4", "q": "Why do you not get purine-purine or pyrimidine -pyrimidine base-pairs in duplex DNA?", "opts": [], "a": "They could not form optimal complementary \"Watson-Crick\" base pairs, but more importantly they would cause a narrowing or widening of the spacing between the DNA strands.", "type": "Short answer", "notes": "Why: They could not form optimal complementary \"Watson-Crick\" base pairs, but more importantly they would cause a narrowing or widening of the spacing between the DNA strands. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q5", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Chemistry of nucleic acids", "number": "5", "q": "How many carbon atoms are in the ring of a ribose sugar?", "opts": [], "a": "Four - the fifth carbon is not part of the ribose ring which include an oxygen.", "type": "Short answer", "notes": "Why: Four - the fifth carbon is not part of the ribose ring which include an oxygen. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q6", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Chemistry of nucleic acids", "number": "6", "q": "What is a beta-glycosidic bond? How does it differ from a phosphodiester bond?", "opts": [], "a": "A beta-glycosidic bond joins a nitrogenous base to the 1′ carbon of a pentose sugar. A phosphodiester bond links the 3′ and 5′ carbons of adjacent sugars through phosphate, forming the nucleic-acid backbone.", "type": "Short answer", "notes": "Why: A beta-glycosidic bond joins a nitrogenous base to the 1′ carbon of a pentose sugar. A phosphodiester bond links the 3′ and 5′ carbons of adjacent sugars through phosphate, forming the nucleic-acid backbone. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q7", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Chemistry of nucleic acids", "number": "7", "q": "Why do we say that single stranded DNA is polar, but DNA duplexes are not polar?", "opts": [], "a": "One strand of DNA has a 5' end and a 3' end. Duplex DNA has both 5' and 3' ends at each end of the duplex.", "type": "Short answer", "notes": "Why: One strand of DNA has a 5' end and a 3' end. Duplex DNA has both 5' and 3' ends at each end of the duplex. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q8", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Chemistry of nucleic acids", "number": "8", "q": "What is the sequence hypothesis?", "opts": [], "a": "The sequence of bases in DNA determines the sequence of amino acids in proteins.", "type": "Short answer", "notes": "Why: The sequence of bases in DNA determines the sequence of amino acids in proteins. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q9", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Forces", "number": "9", "q": "List in order of strength the forces involved in determining macromolecular structure?", "opts": [], "a": "Covalent bonds - Electrostatic bonds - Hydrogen bonds - Van der Waals interactions.", "type": "Short answer", "notes": "Why: Covalent bonds - Electrostatic bonds - Hydrogen bonds - Van der Waals interactions. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q10", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Forces", "number": "10", "q": "Which one is not relevant when considering interaction between two different macromolecules?", "opts": [], "a": "Covalent bonds - if there were covalent interactions between \"two\" macromolecules they would be \"one\" macromolecule", "type": "Short answer", "notes": "Why: Covalent bonds - if there were covalent interactions between \"two\" macromolecules they would be \"one\" macromolecule. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q11", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA structure", "number": "11", "q": "What suggests the DNA is helical?", "opts": [], "a": "The \"X\" shaped diffraction pattern.", "type": "Short answer", "notes": "Why: The \"X\" shaped diffraction pattern. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q12", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA structure", "number": "12", "q": "What are the differences between the DNA double helix and an alpha-helix?", "opts": [], "a": "Many, but most of all alpha-helices are secondary structures found in proteins", "type": "Short answer", "notes": "Why: Many, but most of all alpha-helices are secondary structures found in proteins. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q13", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA structure", "number": "13", "q": "How can DNA-binding proteins (such as restriction enzymes) recognise the base sequence in a DNA duplex?", "opts": [], "a": "They can \"recognise\" the edges of the base-pairs in the major groove", "type": "Short answer", "notes": "Why: They can \"recognise\" the edges of the base-pairs in the major groove. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q14", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA structure", "number": "14", "q": "Why do DNA circles or constrained loops help DNA packaging?", "opts": [], "a": "They can be super-coiled to increase local density. This is effectively one of the functions of the histone octamers.", "type": "Short answer", "notes": "Why: They can be super-coiled to increase local density. This is effectively one of the functions of the histone octamers. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q15", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA structure", "number": "15", "q": "What are the conditions needed for two DNA strands to re-anneal?", "opts": [], "a": "They must have complementary sequence and be annealed by slow cooling.", "type": "Short answer", "notes": "Why: They must have complementary sequence and be annealed by slow cooling. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q16", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Polymerases", "number": "16", "q": "Why are restriction enzymes useful to microorganisms?", "opts": [], "a": "They serve a protective role by degrading foreign DNA", "type": "Short answer", "notes": "Why: They serve a protective role by degrading foreign DNA. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q17", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Polymerases", "number": "17", "q": "Why are restriction enzymes useful to molecular biologists?", "opts": [], "a": "They enable us to create DNA fragments with complementary sticky ends that can be joined together using DNA ligase.", "type": "Short answer", "notes": "Why: They enable us to create DNA fragments with complementary sticky ends that can be joined together using DNA ligase. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q18", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Polymerases", "number": "18", "q": "What are the three enzymatic activities of DNA Pol I", "opts": [], "a": "5'-3' polymerase; 3'-5' exonuclease; 5'-3' nuclease", "type": "Short answer", "notes": "Why: 5'-3' polymerase; 3'-5' exonuclease; 5'-3' nuclease. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q19", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Polymerases", "number": "19", "q": "How does the DNA clamp (two beta-subunits of DNA Pol III) contribute to the activity of the polymerase enzyme?", "opts": [], "a": "It reduces dissociation from the DNA template and thereby increases processivity", "type": "Short answer", "notes": "Why: It reduces dissociation from the DNA template and thereby increases processivity. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q20", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Replication", "number": "20", "q": "Have you read the Watson and Crick paper from 1953? What sentence did they include that indicated that they understood the implications of their model for DNA replication?", "opts": [], "a": "\"It has not escaped our notice that the specific pairing we have postulated immediately suggests a possible copying mechanism for the genetic material\"", "type": "Short answer", "notes": "Why: \"It has not escaped our notice that the specific pairing we have postulated immediately suggests a possible copying mechanism for the genetic material\". This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q21", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Replication", "number": "21", "q": "What is a replication fork?", "opts": [], "a": "It is point where the two parental strands are separated to enable each strand to be copied", "type": "Short answer", "notes": "Why: It is point where the two parental strands are separated to enable each strand to be copied. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q22", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Replication", "number": "22", "q": "Why do we call one strand discontinuous? Why must it be like that?", "opts": [], "a": "It is discontinuous because the DNA is copied in \"Okazaki fragments\" because DNA polymerases can only replicate DNA in the 5' to 3' direction.", "type": "Short answer", "notes": "Why: It is discontinuous because the DNA is copied in \"Okazaki fragments\" because DNA polymerases can only replicate DNA in the 5' to 3' direction. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q23", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Replication", "number": "23", "q": "What enzymes are located in the vicinity of the replication fork?", "opts": [], "a": "Helicase, DNA Pol I, DNA Pol III, Primase, DNA ligase", "type": "Short answer", "notes": "Why: Helicase, DNA Pol I, DNA Pol III, Primase, DNA ligase. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q24", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Replication", "number": "24", "q": "What enzymes are important for DNA replication but not necessarily located at the replication fork?", "opts": [], "a": "DNA Gyrase and pyrophosphatase.", "type": "Short answer", "notes": "Why: DNA Gyrase and pyrophosphatase. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q25", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Membranes, osmosis and transport", "number": "1", "q": "Which statement best explains why phospholipids spontaneously form bilayers in water?", "opts": ["Their hydrophilic tails bind one another covalently", "Their hydrophobic tails cluster away from water while hydrophilic heads face water", "Their phosphate groups move into the bilayer centre", "Every phospholipid is permanently attached to a membrane protein"], "a": "B", "type": "Multiple choice", "notes": "Why: Their hydrophobic tails cluster away from water while hydrophilic heads face water. This directly answers the question; the other options describe a different process, location, mechanism or condition.", "calc": false}, {"id": "q26", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Membranes, osmosis and transport", "number": "2", "q": "A cell is transferred to a hypotonic solution. What is the most immediate expected change?", "opts": ["Water leaves the cell and it shrinks", "Water enters the cell and it swells", "K+ enters and water follows immediately", "The plasma membrane becomes impermeable to water"], "a": "B", "type": "Multiple choice", "notes": "Why: Water enters the cell and it swells. This directly answers the question; the other options describe a different process, location, mechanism or condition.", "calc": false}, {"id": "q27", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Membranes, osmosis and transport", "number": "3", "q": "During regulatory volume decrease, why does loss of intracellular K+ help a swollen cell recover?", "opts": ["It raises intracellular osmolality", "It lowers intracellular osmolality so water can leave", "It directly digests excess water", "It makes the membrane completely rigid"], "a": "B", "type": "Multiple choice", "notes": "Why: It lowers intracellular osmolality so water can leave. This directly answers the question; the other options describe a different process, location, mechanism or condition.", "calc": false}, {"id": "q28", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Membranes, osmosis and transport", "number": "4", "q": "The osmotic gradient is unchanged, but a cell inserts more aquaporins into its membrane. What is most likely?", "opts": ["Water permeability and water flux increase", "Water permeability decreases but flux increases", "Only solute permeability increases", "No membrane property changes"], "a": "A", "type": "Multiple choice", "notes": "Why: Water permeability and water flux increase. This directly answers the question; the other options describe a different process, location, mechanism or condition.", "calc": false}, {"id": "q29", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Membranes, osmosis and transport", "number": "5", "q": "Which statement correctly distinguishes water flux from membrane permeability?", "opts": ["Flux is a membrane property only; permeability is the driving force", "Flux is movement per unit time; permeability describes how readily the membrane permits movement", "They are identical terms", "Permeability always increases when osmolality increases"], "a": "B", "type": "Multiple choice", "notes": "Why: Flux is movement per unit time; permeability describes how readily the membrane permits movement. This directly answers the question; the other options describe a different process, location, mechanism or condition.", "calc": false}, {"id": "q30", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Membranes, osmosis and transport", "number": "6", "q": "An inhibitor prevents ATP hydrolysis by an ABC transporter. What is the most direct consequence?", "opts": ["Transport driven by that ABC protein decreases or stops", "Passive diffusion through the lipid bilayer accelerates", "All membrane proteins are degraded", "The transported solute is converted into ATP"], "a": "A", "type": "Multiple choice", "notes": "Why: Transport driven by that ABC protein decreases or stops. This directly answers the question; the other options describe a different process, location, mechanism or condition.", "calc": false}, {"id": "q31", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Cell signalling and trafficking", "number": "7", "q": "A receptor-bound ligand is internalised by receptor-mediated ated volume is exactly 1 ml.", "type": "Short answer", "notes": "Why: False unless the plated volume is exactly 1 ml. This is the key mechanism or distinction the question is testing.", "calc": true}, {"id": "q195", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Scientific method and statistics", "number": "58", "q": "All purple structures in a Gram-stained clinical sample are necessarily Gram-positive bacteria. True or false?", "opts": [], "a": "False. Artefacts and nonbacterial structures must be considered.", "type": "Short answer", "notes": "Why: False. Artefacts and nonbacterial structures must be considered. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q196", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Immunity and disease", "number": "59", "q": "If a toxin does not kill cells, it cannot cause severe disease. True or false?", "opts": [], "a": "False. The statement confuses visual proximity or a true phrase with the actual biological criterion.", "type": "Short answer", "notes": "Why: False. This is the key mechanism or distinction the question is testing.", "calc": false}, {"id": "q197", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Classification and phylogeny", "number": "60", "q": "The two species drawn nearest to one another on a phylogenetic tree must be the closest relatives. True or false?", "opts": [], "a": "False. The statement confuses visual proximity or a true phrase with the actual biological criterion.", "type": "Short answer", "notes": "Why: False. This is the key mechanism or distinction the question is testing.", "calc": false}],KEY='bio-study-hub-v3',OLD='study-companion-v2';let session=[],pos=0,score=0,locked=false,shown=[],mistakes=[],timer=null,seconds=0,timed=false,finished=false,answeredCount=0;
const $=x=>document.getElementById(x),esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toISOString().slice(0,10);
function defaults(){return{stats:{},custom:[],sessions:[],settings:{goal:20},streak:{last:'',count:0}}}function load(){let x=null;try{x=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(x)return Object.assign(defaults(),x);try{let o=JSON.parse(localStorage.getItem(OLD));if(o){let d=defaults();d.stats=o.stats||{};d.sessions=o.sessions||[];d.settings=o.settings||d.settings;d.streak=o.streak||d.streak;d.custom=(o.questions||[]).filter(q=>!/^q\d+$/.test(q.id));return d}}catch(e){}return defaults()}let S=load();function save(){localStorage.setItem(KEY,JSON.stringify(S))}function questions(){let map=new Map(BUILTIN.map(q=>[q.id,q]));S.custom.forEach(q=>map.set(q.id,q));return[...map.values()]}function st(id){return S.stats[id]||(S.stats[id]={seen:0,ok:0,bad:0,conf:0,next:0})}function isDue(q){let x=st(q.id);return x.seen>0&&x.next<=Date.now()}function mastery(q){let x=st(q.id);return x.seen?Math.min(100,Math.round(x.ok/x.seen*70+x.conf*7.5)):null}function fisher(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function topicRows(){let m={};questions().forEach(q=>(m[q.module+' · '+q.topic]??=[]).push(q));return Object.entries(m).map(([name,a])=>{let attempted=a.filter(q=>st(q.id).seen),vals=attempted.map(mastery);return{name,a,total:a.length,newN:a.length-attempted.length,due:a.filter(isDue).length,score:vals.length?Math.round(vals.reduce((x,y)=>x+y,0)/vals.length):null}}).sort((a,b)=>(a.score??101)-(b.score??101))}function show(id){if(id!=='study')clearInterval(timer);document.querySelectorAll('main').forEach(x=>x.hidden=x.id!==id);document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===id));if(id==='home')home();if(id==='topics')renderTopics();if(id==='library')library();if(id==='settings')settings()}document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>show(b.dataset.p));
function card(t){let status=t.score===null?'Not started':t.score+'% mastery';return`<article class="topic"><b>${esc(t.name)}</b><span class="muted">${t.newN} new · ${t.due} due · ${t.total} total</span><div class="bar"><i style="width:${t.score??0}%"></i></div><footer><span class="status">${status}</span><button onclick='startTopic(${JSON.stringify(t.name)})'>Practise</button></footer></article>`}function home(){let qs=questions(),done=S.sessions.filter(x=>x.date===today()).reduce((a,x)=>a+x.total,0),seen=qs.filter(q=>st(q.id).seen).length,due=qs.filter(isDue).length,newN=qs.length-seen;$('home').innerHTML=`<section class="hero"><div><span class="muted">BIOLOGICAL SCIENCES REVISION</span><h1>Bio Study Hub</h1><p>Practise new questions, review due material, and focus on genuine weak topics.</p><div class="actions"><button class="primary" onclick="start('smart',10)">Start smart session</button><button class="secondary" onclick="start('due',15)">Review due questions</button></div></div><div class="goal" style="--p:${Math.min(100,done/S.settings.goal*100)}">${done}/${S.settings.goal}</div></section><div class="stats"><article><b>${qs.length}</b><span>Total</span></article><article><b>${newN}</b><span>New</span></article><article><b>${due}</b><span>Due</span></article><article><b>${seen}</b><span>Attempted</span></article><article><b>${S.streak.count}</b><span>Day streak</span></article></div><section class="panel"><div class="head"><div><h2>Topics needing attention</h2><span class="muted">Not-started topics are separate from low mastery.</span></div></div><div class="grid">${topicRows().filter(t=>t.score!==null).slice(0,6).map(card).join('')||'<p class="muted">Complete a session to build your mastery view.</p>'}</div></section><section class="panel"><h2>Study modes</h2><div class="modes"><button onclick="start('mix',5)"><b>5-question break</b><small>Quick mixed practice</small></button><button onclick="start('new',15)"><b>Learn new material</b><small>Only unseen questions</small></button><button onclick="start('smart',10)"><b>Weak-topic drill</b><small>Attempted low-mastery topics</small></button><button onclick="start('calc',10)"><b>Calculation trainer</b><small>Only tagged calculations</small></button><button onclick="start('mock',25,true)"><b>25-question timed mock</b><small>25 minutes + mistake review</small></button><button onclick="start('mock',50,true)"><b>50-question timed mock</b><small>50 minutes + mistake review</small></button></div></section>`}
function pool(mode,n,topic){let a=questions();if(topic)a=a.filter(q=>q.module+' · '+q.topic===topic);if(mode==='due')a=a.filter(isDue);if(mode==='new')a=a.filter(q=>!st(q.id).seen);if(mode==='smart'){let names=new Set(topicRows().filter(t=>t.score!==null).slice(0,3).map(t=>t.name));a=a.filter(q=>names.has(q.module+' · '+q.topic))}if(mode==='calc')a=a.filter(q=>q.calc);a=fisher(a);return a.slice(0,Math.min(n,a.length))}function start(mode,n,isTimed=false){session=pool(mode,n);if(!session.length){alert(mode==='due'?'Nothing is due yet. Try New questions.':'No matching questions are available.');return}pos=0;score=0;mistakes=[];finished=false;answeredCount=0;timed=isTimed;seconds=isTimed?n*60:0;show('study');startTimer();question()}function startTopic(t){session=pool('mix',15,t);pos=0;score=0;mistakes=[];finished=false;answeredCount=0;timed=false;show('study');question()}function startTimer(){clearInterval(timer);if(!timed)return;timer=setInterval(()=>{seconds--;let el=$('timer');if(el)el.textContent=formatTime(seconds);if(seconds<=0){clearInterval(timer);finish(true)}},1000)}function formatTime(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function makeShown(q){let correctText=/^[A-D]$/i.test(q.a)?q.opts['ABCD'.indexOf(q.a.toUpperCase())]:q.a;let opts=fisher(q.opts.map(text=>({text,correct:text===correctText})));shown=opts;return opts}function answerText(q){if(q.opts.length){let z=shown.find(x=>x.correct);return z?z.text:q.a}return q.a||'No answer supplied.'}function question(){let q=session[pos];locked=false;shown=[];let opts=q.opts.length?makeShown(q):[];$('study').innerHTML=`<div class="studytop"><button onclick="exitSession()">← Exit</button><div class="prog"><i style="width:${pos/session.length*100}%"></i></div><span>${pos+1}/${session.length}</span><span class="timer" id="timer">${timed?formatTime(seconds):''}</span></div><section class="card"><div class="chips"><span>${esc(q.module)}</span><span>${esc(q.topic)}</span><span>${esc(q.type)}</span>${q.calc?'<span>Calculation</span>':''}</div><h1>${esc(q.q)}</h1>${opts.length?`<div class="options">${opts.map((o,i)=>`<button data-i="${i}" onclick="grade(${i})"><b>${'ABCD'[i]}</b><span>${esc(o.text)}</span></button>`).join('')}</div><p class="muted">Keyboard: A–D to answer, Enter for next.</p>`:`<textarea id="typed" placeholder="Type or think through your answer..."></textarea><button id="reveal" class="primary" onclick="reveal()">Reveal answer</button>`}<div id="fb"></div></section>`}function exitSession(){clearInterval(timer);show('home')}function record(q,ok,chosenText=''){let x=st(q.id);x.seen++;answeredCount++;ok?(x.ok++,score++):x.bad++;x.conf=ok?Math.min(4,x.conf+1):0;x.next=Date.now()+([1,3,7,14,30][x.conf]||1)*864e5;if(!ok)mistakes.push({q,chosen:chosenText||(q.opts.length?'No option recorded':'Self-rated: needs work'),correct:answerText(q)});updateStreak();save()}function grade(i){if(locked)return;locked=true;let q=session[pos],chosen=shown[i];shown.forEach(x=>x.chosen=false);chosen.chosen=true;let ok=chosen.correct;record(q,ok,chosen.text);document.querySelectorAll('.options button').forEach((b,j)=>{b.disabled=true;if(shown[j].correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});feedback(q,ok)}function feedback(q,ok){$('fb').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Correct':'Not quite'}</b><p><strong>Correct answer:</strong> ${esc(answerText(q))}</p><p>${esc(q.notes||'Review the key concept and compare it with each alternative.')}</p><button class="primary next" onclick="next()">${pos+1===session.length?'Finish':'Next question'}</button></div>`}function reveal(){if(locked)return;locked=true;$('reveal').disabled=true;let q=session[pos];$('fb').innerHTML=`<div class="feedback neutral"><b>Model answer</b><p>${esc(q.a)}</p><p>${esc(q.notes||'Focus on explaining the mechanism, not only naming the term.')}</p><p>How well did you know it?</p><button class="secondary" onclick="selfGrade(false)">Needs work</button> <button class="primary" onclick="selfGrade(true)">Knew it</button></div>`}function selfGrade(ok){if($('fb').dataset.done)return;$('fb').dataset.done='1';record(session[pos],ok,ok?'Self-rated: knew it':'Self-rated: needs work');next()}function next(){if(finished)return;if(++pos<session.length)question();else finish(false)}function finish(timedOut=false){if(finished)return;finished=true;locked=true;clearInterval(timer);let total=session.length,completed=answeredCount;if(completed>0)S.sessions.push({date:today(),total:completed,score});save();$('study').innerHTML=`<div class="finish"><strong>✓</strong><h1>Session complete</h1><p>You scored ${score}/${completed} from ${completed} answered question${completed===1?'':'s'}${timedOut?' before time expired':''}.</p>${mistakes.length?`<button class="primary" onclick="reviewMistakes()">Review ${mistakes.length} mistake${mistakes.length===1?'':'s'}</button>`:'<p class="good feedback">No mistakes to review.</p>'} <button class="secondary" onclick="show('home')">Dashboard</button><div id="review"></div></div>`}function reviewMistakes(){$('review').innerHTML='<h2>Mistake review</h2>'+mistakes.map(m=>`<article class="mistake"><div><b>${esc(m.q.q)}</b><p><strong>Your answer:</strong> ${esc(m.chosen)}</p><p><strong>Correct:</strong> ${esc(m.correct)}</p><p>${esc(m.q.notes)}</p></div></article>`).join('')}
function renderTopics(){let ts=topicRows();$('topics').innerHTML=`<div class="title"><div><h1>Topic tracker</h1><p class="muted">Labels and text are provided alongside colour.</p></div></div><div class="legend"><span>🔴 Needs work</span><span>🟠 Developing</span><span>🟢 Strong</span><span>⚪ Not started</span></div><section class="panel"><div class="heat">${ts.map(t=>{let lab=t.score===null?'Not started':t.score<30?'Needs work':t.score<60?'Developing':'Strong',bg=t.score===null?'#f4f5f7':t.score<30?'#ffe0e6':t.score<60?'#fff0d5':'#dff8ee';return`<div style="background:${bg}"><b>${esc(t.name)}</b><br>${lab}${t.score===null?'':' · '+t.score+'%'}</div>`}).join('')}</div></section><div class="grid">${ts.map(card).join('')}</div>`}
function library(){$('library').innerHTML=`<div class="title"><div><h1>Question library</h1><p class="muted">Built-in questions update with the site. Your custom questions are stored separately.</p></div><button class="primary" onclick="editForm()">+ Add question</button></div><section class="panel import"><div><h2>Import CSV</h2><p class="muted">Handles Excel BOMs, quotes and line breaks.</p><input type="file" accept=".csv" onchange="importCSV(this.files[0])"></div><div><h2>Backup progress</h2><p class="muted">Backups contain progress, settings and custom questions, not the built-in bank.</p><button class="secondary" onclick="backup()">Export backup</button> <label class="secondary">Import backup<input hidden type="file" accept=".json" onchange="restore(this.files[0])"></label></div></section><section class="panel"><div class="head"><h2>${questions().length} questions</h2><input class="search" id="search" placeholder="Search questions" oninput="list()"></div><div id="editor"></div><div id="list" class="library"></div></section>`;list()}function list(){let v=($('search')?.value||'').toLowerCase();$('list').innerHTML=questions().filter(q=>(q.q+' '+q.topic+' '+q.module).toLowerCase().includes(v)).slice(0,250).map(q=>`<article><div><b>${esc(q.q)}</b><span>${esc(q.module)} · ${esc(q.topic)} · ${esc(q.type)}</span></div><div><button onclick="editForm('${q.id}')">Edit</button>${S.custom.some(x=>x.id===q.id)?`<button onclick="del('${q.id}')">Delete</button>`:''}</div></article>`).join('')}function editForm(id=''){let q=questions().find(x=>x.id===id)||{id:'u'+Date.now(),module:'Other',topic:'General',q:'',opts:[],a:'',type:'Short answer',notes:'',calc:false};$('editor').innerHTML=`<div class="form notice"><b>${id?'Edit question':'Add question'}</b><label>Module<input id="am" value="${esc(q.module)}"></label><label>Topic<input id="at" value="${esc(q.topic)}"></label><label>Question<textarea id="aq">${esc(q.q)}</textarea></label><label>Type<select id="ay"><option ${q.type==='Short answer'?'selected':''}>Short answer</option><option ${q.type==='Multiple choice'?'selected':''}>Multiple choice</option></select></label><label>Options A–D, separated by |<input id="ao" value="${esc(q.opts.join(' | '))}"></label><label>Correct answer or exact option text<input id="aa" value="${esc(q.a)}"></label><label>Explanation<textarea id="an">${esc(q.notes||'')}</textarea></label><label><input type="checkbox" id="ac" ${q.calc?'checked':''}> Calculation question</label><button class="primary" onclick="saveQuestion('${q.id}')">Save question</button></div>`}function saveQuestion(id){let type=$('ay').value,opts=type==='Multiple choice'?$('ao').value.split('|').map(x=>x.trim()).filter(Boolean):[],a=$('aa').value.trim();if(!$('aq').value.trim())return alert('Enter a question.');if(type==='Multiple choice'){if(opts.length<2)return alert('Enter at least two options.');if(/^[A-D]$/i.test(a)&&'ABCD'.indexOf(a.toUpperCase())>=opts.length)return alert('The answer letter does not match an option.');if(!/^[A-D]$/i.test(a)&&!opts.includes(a))return alert('Use A–D or paste the exact correct option text.')}let q={id,source:'Added by user',module:$('am').value||'Other',topic:$('at').value||'General',number:'',q:$('aq').value.trim(),opts,a,type,notes:$('an').value.trim(),calc:$('ac').checked};let i=S.custom.findIndex(x=>x.id===id),isBuiltin=BUILTIN.some(x=>x.id===id);if(i>=0)S.custom[i]=q;else if(isBuiltin)S.custom.push(q);else S.custom.push({...q,id:id&&id.startsWith('u')?id:'u'+Date.now()});save();library()}function del(id){if(confirm('Delete this custom question?')){S.custom=S.custom.filter(q=>q.id!==id);delete S.stats[id];save();library()}}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}function importCSV(f){if(!f)return;let r=new FileReader;r.onload=()=>{try{let rows=parseCSV(r.result);if(!rows.length)throw Error('Empty CSV');let h=rows.shift().map(x=>x.trim()),count=0,errors=[];rows.forEach((z,ri)=>{let o={};h.forEach((k,i)=>o[k]=z[i]||'');if(!o.Question)return;let opts=['Option A','Option B','Option C','Option D'].map(k=>o[k]?.trim()).filter(Boolean),a=(o['Correct Answer']||'').trim(),type=o['Question Type']|| (opts.length?'Multiple choice':'Short answer');if(opts.length&&!/^[A-D]$/i.test(a)){let ix=opts.findIndex(x=>x.toLowerCase()===a.toLowerCase());if(ix>=0)a='ABCD'[ix];else{errors.push('Row '+(ri+2)+': answer not found in options');return}}S.custom.push({id:'i'+Date.now()+count++,source:o.Source||'Imported',module:o.Module||'Other',topic:o.Topic||'General',number:o['Question ID']||'',q:o.Question.trim(),opts,a,type,notes:o.Notes||'',calc:/^(true|yes|1)$/i.test(o.Calculation||'')})});save();alert(count+' questions imported.'+(errors.length?'\n'+errors.slice(0,5).join('\n'):''));library()}catch(e){alert('Import failed: '+e.message)}};r.readAsText(f)}function download(name,text){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){download('bio-study-hub-backup.json',JSON.stringify({version:3,stats:S.stats,custom:S.custom,sessions:S.sessions,settings:S.settings,streak:S.streak},null,2))}function restore(f){if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(x.questions){let legacy=x;S.stats=legacy.stats||{};S.custom=(legacy.questions||[]).filter(q=>!/^q\d+$/.test(q.id));S.sessions=legacy.sessions||[];S.settings=legacy.settings||S.settings;S.streak=legacy.streak||S.streak}else{S.stats=x.stats||{};S.custom=x.custom||[];S.sessions=x.sessions||[];S.settings=x.settings||S.settings;S.streak=x.streak||S.streak}save();alert('Backup restored. Built-in questions remain updated.');library()}catch(e){alert('Invalid backup file.')}};r.readAsText(f)}function settings(){$('settings').innerHTML=`<div class="title"><div><h1>Settings</h1><p class="muted">Progress is stored only in this browser unless exported.</p></div></div><section class="panel form"><label>Daily question goal<input type="number" min="1" max="200" value="${S.settings.goal}" onchange="S.settings.goal=+this.value;save()"></label><button class="secondary" onclick="backup()">Export progress now</button><button class="danger" onclick="resetProgress()">Reset progress</button><button class="danger" onclick="resetAll()">Reset entire app</button></section>`}function resetProgress(){if(confirm('Clear scores and session history?')){S.stats={};S.sessions=[];S.streak={last:'',count:0};save();settings()}}function resetAll(){if(confirm('Remove progress and custom questions?')){localStorage.removeItem(KEY);location.reload()}}function updateStreak(){let t=today();if(S.streak.last===t)return;let d=new Date();d.setDate(d.getDate()-1);S.streak.count=S.streak.last===d.toISOString().slice(0,10)?S.streak.count+1:1;S.streak.last=t}document.addEventListener('keydown',e=>{if(!$('study')||$('study').hidden)return;let tag=(e.target&&e.target.tagName||'').toLowerCase();if(['input','textarea','select','button'].includes(tag)||e.target?.isContentEditable)return;if(!locked&&shown.length&&/^[a-d]$/i.test(e.key)){let i='ABCD'.indexOf(e.key.toUpperCase());if(i<shown.length)grade(i)}else if(locked&&!finished&&e.key==='Enter'&&document.querySelector('.next'))next()});show('home');</script></body></html>
