s the applied infectious dose per target cell, not the proportion of cells that necessarily become infected.","calc":false,"mode":"Flashcard"},{"id":"q128","source":"BS1040 Study Material","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","number":"17","q":"A plate has 42 colonies from 0.2 ml of a 10^-5 dilution. Calculate CFU/ml.","opts":[],"a":"2.1 × 10^7 CFU/ml.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":true,"mode":"Flashcard"},{"id":"q129","source":"BS1040 Study Material","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","number":"18","q":"A stock contains 4 × 10^9 PFU/ml. How much is needed to add 8 × 10^7 PFU?","opts":[],"a":"0.02 ml, or 20 µl.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":true,"mode":"Flashcard"},{"id":"q132","source":"BS1040 Study Material","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"21","q":"An ATP-hydrolysis inhibitor acts on an ABC transporter. Immediate effect?","opts":[],"a":"Active transport by that transporter falls or stops.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q134","source":"BS1040 Study Material","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"23","q":"A surface receptor is internalised and then returned to the membrane. Give the likely route.","opts":[],"a":"Early endosome → recycling endosome → plasma membrane.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q136","source":"BS1040 Study Material","module":"BS1040","topic":"Discuss and explain some of the diversity of life on earth","number":"25","q":"A phylogenetic tree is rotated at an internal node. What remains unchanged?","opts":[],"a":"Clades and common-ancestor relationships.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q141","source":"Academic Paper Analysis","module":"BS1040","topic":"Describe how micro-organisms cause disease","number":"4","q":"What cellular structure is targeted by β-lactam antibiotics?","opts":[],"a":"Peptidoglycan cell-wall synthesis.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q142","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"5","q":"Define an ABC transporter.","opts":[],"a":"An ATP-binding-cassette transporter using ATP for active transport.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q145","source":"Academic Paper Analysis","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"8","q":"What is a secondary metabolite?","opts":[],"a":"A product not directly required for basic growth, often associated with later growth phases.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q146","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss similarities and differences in structures and replication between viruses","number":"9","q":"What is a positive-sense RNA genome?","opts":[],"a":"RNA of mRNA polarity that can be translated directly.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q147","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss similarities and differences in structures and replication between viruses","number":"10","q":"Define multiplicity of infection.","opts":[],"a":"Infectious particles added per target cell.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q148","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"11","q":"Why does osmotic gradient alter water flux without necessarily altering water permeability?","opts":[],"a":"The gradient is the driving force; permeability is a membrane property.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q149","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss and explain some of the diversity of life on earth","number":"12","q":"Why is “all Archaea produce methane” scientifically defective?","opts":[],"a":"Methanogenesis is restricted to particular Archaea.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q151","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"14","q":"Why does negative feedback make signalling transient?","opts":[],"a":"Output suppresses upstream signalling.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q152","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"15","q":"Why are phospholipid tails located inside a bilayer?","opts":[],"a":"Hydrophobic regions minimise contact with water.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q153","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss and explain some of the diversity of life on earth","number":"16","q":"Why is “prokaryote” not a domain?","opts":[],"a":"It groups Bacteria and Archaea by cell organisation rather than ancestry.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q154","source":"Academic Paper Analysis","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"17","q":"Why can OD and CFU give different impressions of culture size?","opts":[],"a":"OD includes nonviable material; CFU measures colony-forming units.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q155","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss similarities and differences in structures and replication between viruses","number":"18","q":"Why does a positive-sense RNA genome permit rapid initiation of translation?","opts":[],"a":"Host ribosomes can recognise it as mRNA.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q156","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"19","q":"Why does the first endocytic compartment differ from the eventual destination?","opts":[],"a":"Endosomes sort cargo before recycling or degradation.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q158","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"21","q":"A membrane gains additional aquaporins while the osmotic gradient remains constant. Predict water flux.","opts":[],"a":"Increased flux. More aquaporins increase membrane water permeability at the same gradient.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q159","source":"Academic Paper Analysis","module":"BS1040","topic":"Describe how micro-organisms are used in biotechnology","number":"22","q":"A bacterium acquires resistance DNA from lysed neighbouring cells. Identify the transfer mechanism.","opts":[],"a":"Transformation. This occurs through uptake of free environmental DNA.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q160","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"23","q":"An inhibitor blocks ATP hydrolysis by an ABC transporter. Predict the immediate transport effect.","opts":[],"a":"Reduced or abolished active transport.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q161","source":"Academic Paper Analysis","module":"BS1040","topic":"Describe how micro-organisms cause disease","number":"24","q":"A toxin activates an ion channel without killing the cell. Explain how disease may result.","opts":[],"a":"Functional dysregulation can disturb homeostasis.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q162","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"25","q":"A cell in hypotonic medium cannot release potassium. Predict its volume response.","opts":[],"a":"Persistent swelling and increased lysis risk.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q164","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"27","q":"A protein binds a surface receptor and the receptor rapidly returns to the membrane. Suggest the intracellular sorting route.","opts":[],"a":"Early endosome to recycling endosome to plasma membrane.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q165","source":"Academic Paper Analysis","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"28","q":"A culture has high optical density but low CFU. Give two biological explanations.","opts":[],"a":"Dead cells, debris, or viable-but-nonculturable cells.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q166","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"29","q":"A mutation disables a signalling-pathway feedback inhibitor. Predict signal duration.","opts":[],"a":"Prolonged signal. Loss of feedback inhibition prevents normal pathway shut-off.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q167","source":"Academic Paper Analysis","module":"BS1040","topic":"Describe how micro-organisms cause disease","number":"30","q":"A bacterium is susceptible to penicillin only while growing rapidly. Explain why.","opts":[],"a":"Active wall synthesis creates vulnerability to cross-linking inhibition.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q168","source":"Academic Paper Analysis","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"31","q":"Plate counts are 4, 37 and 412 colonies at successive tenfold dilutions. Which plate is most useful and why?","opts":[],"a":"Usually 37, because 4 is imprecise and 412 may be overcrowded.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q169","source":"Academic Paper Analysis","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"32","q":"A culture’s OD increases while CFU remains constant. Suggest an interpretation.","opts":[],"a":"Increased biomass or nonviable particles without increased colony-forming cells.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q170","source":"Academic Paper Analysis","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"33","q":"A growth curve is horizontal after exponential growth. Name the phase and explain two possible causes.","opts":[],"a":"Stationary phase; nutrient limitation and waste accumulation are possibilities.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q171","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"34","q":"A cell initially swells and then recovers in hypotonic medium. What transport pattern would you expect?","opts":[],"a":"Initial water influx followed by solute efflux and water loss.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q172","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss and explain some of the diversity of life on earth","number":"35","q":"Two species share a node more recently than either shares a node with a third species. What relationship follows?","opts":[],"a":"The first two are more closely related to each other.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q173","source":"Academic Paper Analysis","module":"BS1040","topic":"Demonstrate competency in numeracy and basic statistical skills","number":"36","q":"A Gram stain contains purple cocci and large pink host cells. Which observations support classification?","opts":[],"a":"Gram reaction, cell shape, arrangement and relative size can support a tentative classification, but artefacts and host material must be considered.","type":"Short answer","notes":"Purple cocci may support identification of Gram-positive cocci, whereas large pink structures may be host cells; appearance alone is not definitive.","calc":false,"mode":"Flashcard"},{"id":"q175","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss similarities and differences in structures and replication between viruses","number":"38","q":"A phage stock has many particles by electron microscopy but a low PFU count. Explain.","opts":[],"a":"Many particles are noninfectious under assay conditions.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q176","source":"Academic Paper Analysis","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"39","q":"An experimental drug decreases dry biomass but not CFU immediately. What can and cannot be concluded?","opts":[],"a":"Biomass fell; immediate viability cannot be inferred from mass alone.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q177","source":"Academic Paper Analysis","module":"BS1040","topic":"Demonstrate competency in numeracy and basic statistical skills","number":"40","q":"A Q–Q plot shows severe deviation from linearity. What feature of a planned t-test requires attention?","opts":[],"a":"Normality, outliers, and possibly an alternative analysis.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q178","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"41","q":"Which membrane change would directly increase water permeability?","opts":[],"a":"Increased aquaporin abundance.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q179","source":"Academic Paper Analysis","module":"BS1040","topic":"Describe how micro-organisms are used in biotechnology","number":"42","q":"Which observation most strongly supports transformation rather than transduction?","opts":[],"a":"DNA acquisition is reduced by extracellular DNase.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q180","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"43","q":"Which sequence correctly describes receptor-mediated delivery to a lysosome?","opts":[],"a":"Plasma membrane to early endosome to late endosome to lysosome.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q181","source":"Academic Paper Analysis","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"44","q":"Which statement best distinguishes primary from secondary metabolites?","opts":[],"a":"Primary products are closely linked to growth; secondary products are not directly essential for growth.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q182","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells","number":"45","q":"Which cellular process depends primarily on actin rather than microtubules?","opts":[],"a":"Actin-based lamellipodium formation.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q183","source":"Academic Paper Analysis","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"46","q":"Which result would contradict spontaneous generation?","opts":[],"a":"Sterile medium remains sterile when exposed to air but protected from particulate contamination.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q184","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss similarities and differences in structures and replication between viruses","number":"47","q":"Which statement correctly distinguishes a viral capsid from an envelope?","opts":[],"a":"Capsid is protein; envelope is lipid-based.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q185","source":"Academic Paper Analysis","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","number":"48","q":"Which method most directly estimates viable bacterial concentration?","opts":[],"a":"Viable plate count.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q187","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells","number":"50","q":"Which comparison between bacterial and eukaryotic genomes is most defensible?","opts":[],"a":"Eukaryotes typically possess multiple linear chromosomes; bacteria often possess one principal chromosome.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q188","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss similarities and differences in structures and replication between viruses","number":"51","q":"A positive-sense RNA virus loses the ability to synthesise negative-strand intermediates. Which processes remain possible and which fail?","opts":[],"a":"Initial translation may occur, but genome amplification and progeny genomes fail.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q189","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"52","q":"A bacterial cell maintains volume in hypotonic medium despite blocked potassium channels. Propose an alternative compensatory mechanism.","opts":[],"a":"Efflux of other ions or organic osmolytes.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q190","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"53","q":"A membrane transporter uses ATP but transports different substrates in opposite directions in different tissues. Why does this not contradict its classification as an ABC transporter?","opts":[],"a":"ATP coupling defines the family more generally than direction.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q191","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"54","q":"A protein is glycosylated normally but never reaches the cell surface. Identify three distinct stages that could be defective.","opts":[],"a":"ER exit, Golgi sorting, vesicle transport, docking or fusion.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q192","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss and explain some of the diversity of life on earth","number":"55","q":"A tree is redrawn with branches rotated around every node. Which relationships must remain unchanged?","opts":[],"a":"Clades and common-ancestor relationships.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q194","source":"Academic Paper Analysis","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","number":"57","q":"A 10⁻⁶ dilution containing 20 colonies means the original sample contained 20 × 10⁶ CFU/ml. True or false?","opts":[],"a":"False unless the plated volume is exactly 1 ml.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":true,"mode":"Flashcard"},{"id":"q195","source":"Academic Paper Analysis","module":"BS1040","topic":"Demonstrate competency in numeracy and basic statistical skills","number":"58","q":"All purple structures in a Gram-stained clinical sample are necessarily Gram-positive bacteria. True or false?","opts":[],"a":"False. Artefacts and nonbacterial structures must be considered.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard"},{"id":"q196","source":"Academic Paper Analysis","module":"BS1040","topic":"Describe how micro-organisms cause disease","number":"59","q":"If a toxin does not kill cells, it cannot cause severe disease. True or false?","opts":[],"a":"False. Toxins can cause severe disease by disrupting cell signalling, ion transport or metabolism without killing the affected cells.","type":"Short answer","notes":"Disease severity can result from loss of normal function, not only cell death; cholera toxin is a clear example.","calc":false,"mode":"Flashcard"},{"id":"q197","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss and explain some of the diversity of life on earth","number":"60","q":"The two species drawn nearest to one another on a phylogenetic tree must be the closest relatives. True or false?","opts":[],"a":"False. Relatedness is determined by the most recent common ancestor and branching pattern, not by how close the names are drawn.","type":"Short answer","notes":"Branches can be rotated around a node without changing evolutionary relationships.","calc":false,"mode":"Flashcard"},{"id":"q198","module":"BS1040","topic":"Discuss and explain some of the diversity of life on earth","type":"Multiple choice","mode":"MCQ","q":"Which observation, by itself, would best distinguish Gram-positive from Gram-negative bacteria after Gram staining?","opts":["The bacteria are purple rather than pink after Gram staining","The bacteria are larger than a eukaryotic cell","The bacteria are rod-shaped rather than spherical","The bacteria are motile rather than non-motile"],"a":"A","notes":"Gram-positive cells retain crystal violet and appear purple. Size, shape and motility do not determine Gram reaction.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"1"},{"id":"q199","module":"BS1040","topic":"Describe how micro-organisms cause disease, are used in biotechnology and influence geochemical cycles","type":"Multiple choice","mode":"MCQ","q":"A microorganism obtains energy by oxidising organic chemicals in its surroundings. Which description matches this metabolism?","opts":["Chemoorganotroph","Chemolithotroph","Photoautotroph","Photolithotroph"],"a":"A","notes":"Chemoorganotrophs obtain energy by oxidising organic compounds; the other terms refer to inorganic electron donors or light energy.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"2"},{"id":"q200","module":"BS1040","topic":"Describe how micro-organisms are used in biotechnology","type":"Multiple choice","mode":"MCQ","q":"Which sequence correctly describes construction of a simple plasmid genomic library?","opts":["Fragment chromosomal DNA, digest the vector, ligate inserts and vector, transform bacteria, then select for a plasmid marker","Digest the vector, transform bacteria, fragment chromosomal DNA, ligate, then select","Select bacteria, ligate intact chromosomes to the vector, digest, transform, then fragment DNA","Fragment chromosomal DNA, select a plasmid marker, transform bacteria, digest the vector, then ligate"],"a":"A","notes":"The insert and vector must be prepared and ligated before transformation and selection.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"3"},{"id":"q202","module":"BS1040","topic":"Describe how micro-organisms cause disease","type":"Multiple choice","mode":"MCQ","q":"A bacterial pathogen attaches to an epithelial surface before causing infection. Which stage does this represent?","opts":["Dissemination after bloodstream entry","Toxin release after host-cell lysis","Adhesion, an early step in infection","Clearance by adaptive immune memory"],"a":"C","notes":"Attachment to a host surface is adhesion, an early step in colonisation and infection.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"5"},{"id":"q204","module":"BS1040","topic":"Describe how micro-organisms cause disease","type":"Multiple choice","mode":"MCQ","q":"Which bacterial process is targeted by ciprofloxacin?","opts":["Peptidoglycan cross-linking","Ribosomal peptide-bond formation","Lipid-bilayer synthesis","DNA-gyrase-dependent DNA topology"],"a":"D","notes":"Ciprofloxacin inhibits bacterial DNA gyrase/topoisomerase activity.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"7"},{"id":"q205","module":"BS1030","topic":"Demonstrate an ability to analyse experimental data","type":"Multiple choice","mode":"MCQ","q":"Which statement correctly defines the Michaelis constant, Km?","opts":["The substrate concentration at which the rate is half of Vmax","The maximum rate at saturating substrate","The number of substrate molecules converted per enzyme per unit time","The substrate concentration at which the enzyme is fully inactive"],"a":"A","notes":"Km is the substrate concentration at which the reaction rate is half Vmax.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"9"},{"id":"q206","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells","type":"Multiple choice","mode":"MCQ","q":"Which statement best describes the outcome of meiosis I?","opts":["It is a reductional division that leads towards haploid cells","Homologous chromosomes first pair in anaphase I","Recombination occurs between sister chromatids in prophase I","Two DNA replications occur without cell division"],"a":"A","notes":"Meiosis I separates homologous chromosomes and reduces chromosome number.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"10"},{"id":"q207","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","type":"Multiple choice","mode":"MCQ","q":"A eukaryotic cell is placed in a hypotonic environment. What is the immediate water movement?","opts":["Water enters the cytosol, prompting regulatory-volume-decrease mechanisms","Water enters the nucleus but cannot cross the plasma membrane","Water movement is unaffected by the osmotic gradient","Water leaves the cytosol because the external solution is dilute"],"a":"A","notes":"Water enters the cell down the osmotic gradient, causing swelling.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"11"},{"id":"q210","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","type":"Multiple choice","mode":"MCQ","q":"A culture begins with one bacterial cell and undergoes six complete generations with no deaths. How many cells are present?","opts":["6","32","64","12"],"a":"C","notes":"N = N0 × 2^n = 1 × 2^6 = 64.","calc":true,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"14"},{"id":"q211","module":"BS1040","topic":"Describe how micro-organisms are used in biotechnology","type":"Multiple choice","mode":"MCQ","q":"Which event is bacterial transformation?","opts":["DNA transfer between bacteria by a pilus","DNA delivery into bacteria by a bacteriophage","DNA replication within a plasmid-bearing cell","Uptake of free DNA from the environment by a bacterial cell"],"a":"D","notes":"Transformation is uptake of free environmental DNA; pilus transfer is conjugation and phage transfer is transduction.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"15"},{"id":"q212","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","type":"Multiple choice","mode":"MCQ","q":"A phage stock contains 6 × 10^8 PFU ml⁻¹. A culture contains 3 × 10^6 CFU ml⁻¹, and 1 ml is infected at an MOI of 20. What phage volume is required?","opts":["0.01 ml","0.10 ml","1.0 ml","10 ml"],"a":"B","notes":"Required PFU = 20 × 3 × 10^6 = 6 × 10^7; volume = 6 × 10^7 ÷ 6 × 10^8 = 0.10 ml.","calc":true,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"16"},{"id":"q213","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","type":"Multiple choice","mode":"MCQ","q":"Fifty colonies are counted after plating 0.4 ml of a 10⁻⁶ dilution. What is the estimated original concentration?","opts":["1.25 × 10⁷ CFU ml⁻¹","1.25 × 10⁸ CFU ml⁻¹","2.0 × 10⁸ CFU ml⁻¹","5.0 × 10⁸ CFU ml⁻¹"],"a":"B","notes":"50 ÷ (0.4 × 10⁻⁶) = 1.25 × 10⁸ CFU ml⁻¹. A omits a factor of ten; C and D use incorrect volume or dilution factors.","calc":true,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"17"},{"id":"q214","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","type":"Multiple choice","mode":"MCQ","q":"Why is a fresh pipette tip used for each transfer during serial dilution?","opts":["To increase bacterial viability","To give every dilution the same cell number","To make agar support every organism","To avoid carrying excess cells into the next dilution"],"a":"D","notes":"Fresh tips prevent carry-over that would change the intended dilution factor.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"18"},{"id":"q217","module":"BS1030","topic":"Demonstrate the acquisition of selected technical skills relevant to biochemistry","type":"Multiple choice","mode":"MCQ","q":"During an ONPG assay, what does increasing absorbance at 410 nm monitor?","opts":["Production of ONP as ONPG is hydrolysed by β-galactosidase","Binding of ONP to a membrane transporter","Consumption of oxygen by DNA gyrase","Formation of bacterial colonies from ONP"],"a":"A","notes":"β-galactosidase produces yellow ONP, which absorbs near 410 nm.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"21"},{"id":"q218","module":"BS1030","topic":"Discuss the relationship between protein structure and function","type":"Multiple choice","mode":"MCQ","q":"Which interaction is most likely between hydrophobic transmembrane amino-acid residues and lipid fatty-acyl chains?","opts":["Hydrophobic interactions","Hydrogen bonds with charged lipid heads only","Ionic bonds","Covalent peptide bonds to every lipid tail"],"a":"A","notes":"Non-polar side chains and fatty-acyl chains associate through hydrophobic interactions.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"22"},{"id":"q223","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","type":"Multiple choice","mode":"MCQ","q":"Which organism is expected to resist heat treatment better because it can form endospores?","opts":["Pseudomonas putida","Staphylococcus epidermidis","Bacillus subtilis","Escherichia coli"],"a":"C","notes":"Bacillus subtilis forms heat-resistant endospores.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"27"},{"id":"q224","module":"BS1040","topic":"Demonstrate competency in numeracy and basic statistical skills","type":"Multiple choice","mode":"MCQ","q":"Which test compares the mean height of two independent groups, such as poodles and spaniels?","opts":["An independent-samples t-test","Pearson product-moment correlation","A scatterplot alone","A Q–Q plot alone"],"a":"A","notes":"An independent-samples t-test compares two independent group means when assumptions are met.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"28"},{"id":"q225","module":"BS1030","topic":"Demonstrate an ability to analyse experimental data","type":"Multiple choice","mode":"MCQ","q":"A β-galactosidase assay is repeated with twice as much enzyme while substrate is saturating. What happens?","opts":["Vmax and Km remain unchanged","Vmax doubles while Km is unchanged","Vmax and Km are halved","Km doubles while Vmax is unchanged"],"a":"B","notes":"Vmax is proportional to enzyme concentration, whereas Km is not changed by enzyme concentration.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"29"},{"id":"q226","module":"BS1030","topic":"Demonstrate an ability to analyse experimental data","type":"Multiple choice","mode":"MCQ","q":"What kinetic effect is expected from a competitive inhibitor?","opts":["Apparent Km decreases and Vmax increases","Apparent Km increases while Vmax is unchanged","Apparent Km and Vmax both decrease","Apparent Km is unchanged while Vmax decreases"],"a":"B","notes":"Competitive inhibition increases apparent Km but can be overcome at high substrate, leaving Vmax unchanged.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"30"},{"id":"q227","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","type":"Multiple choice","mode":"MCQ","q":"Glutamate has a side-chain pKa of 4.25. What state predominates at pH 7.0?","opts":["Unable to ionise","Mostly deprotonated","Exactly half protonated","Mostly protonated"],"a":"B","notes":"Because pH is well above pKa, the carboxyl side chain is predominantly deprotonated.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"31"},{"id":"q230","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","type":"Multiple choice","mode":"MCQ","q":"In an antibiotic-disc assay, what does a clear zone around a disc indicate?","opts":["The disc increased bacterial growth","The bacterium is necessarily resistant","The bacterium is sensitive under the assay conditions","The serum antibiotic concentration is known exactly"],"a":"C","notes":"A zone of inhibition indicates that growth was suppressed under the test conditions.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"34"},{"id":"q231","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","type":"Multiple choice","mode":"MCQ","q":"Why can DNA fragments cut with the same restriction enzyme often be joined?","opts":["They have identical full-length sequences","They contain the same promoter","They are automatically converted into RNA","They can have compatible ends that can be ligated"],"a":"D","notes":"Matching restriction cuts can create complementary ends that anneal and are sealed by ligase.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"35"},{"id":"q233","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","type":"Multiple choice","mode":"MCQ","q":"Why can ethanol treatment reduce formaldehyde production after methanol poisoning?","opts":["Ethanol irreversibly destroys alcohol dehydrogenase","Ethanol increases the enzyme affinity for methanol","Ethanol binds alcohol dehydrogenase with higher affinity and is metabolised preferentially","Ethanol converts formaldehyde back into methanol without an enzyme"],"a":"C","notes":"Ethanol has the lower Km and competitively occupies alcohol dehydrogenase, reducing methanol metabolism.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"37"},{"id":"q234","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","type":"Multiple choice","mode":"MCQ","q":"Why is a Bunsen burner lit near an aseptic transfer area?","opts":["To create an upward current of air near the work area","To sterilise the entire room","To remove all microorganisms by boiling the broth","To provide the culture incubation temperature"],"a":"A","notes":"The flame creates convection that reduces settling of airborne contaminants near the transfer area.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"38"},{"id":"q235","module":"BS1030","topic":"Discuss the relationship between protein structure and function","type":"Multiple choice","mode":"MCQ","q":"Why might replacing arginine with glutamate substantially affect protein function?","opts":["Side-chain charge and character remain unchanged","The peptide backbone is removed","One hydrophobic residue replaces another","A positively charged side chain is replaced by a negatively charged one"],"a":"D","notes":"The substitution reverses side-chain charge and can disrupt ionic interactions and structure.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"39"},{"id":"q236","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells","type":"Multiple choice","mode":"MCQ","q":"What is a consequence of a bacterial cell having a high surface-area-to-volume ratio?","opts":["A lower rate of interaction with surroundings","Inability to exchange nutrients across the membrane","More surface is available relative to cell contents for environmental exchange","The cell must contain multiple membrane-bound nuclei"],"a":"C","notes":"A high surface-area-to-volume ratio supports efficient exchange with the environment.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"40"},{"id":"q237","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","type":"Short answer","mode":"Flashcard","q":"A student plates 0.20 ml of a 10⁻⁵ dilution and counts 48 colonies. Calculate the original concentration in CFU ml⁻¹.","opts":[],"a":"2.4 × 10⁷ CFU ml⁻¹. Working: 48 ÷ (0.20 × 10⁻⁵) = 48 ÷ (2 × 10⁻⁶) = 2.4 × 10⁷.","notes":"Include both plated volume and dilution in the denominator; omitting either gives a tenfold or fivefold error.","calc":true,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"41"},{"id":"q241","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","type":"Short answer","mode":"Flashcard","q":"Describe the roles of helicase, single-strand DNA-binding protein and DNA gyrase at a bacterial replication fork.","opts":[],"a":"Helicase separates the parental strands; single-strand DNA-binding proteins stabilise exposed DNA and prevent reannealing; DNA gyrase relieves torsional strain and positive supercoiling ahead of the fork.","notes":"Common mistake: gyrase acts ahead of the fork, whereas single-strand DNA-binding proteins act on the separated templates.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"45"},{"id":"q242","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","type":"Short answer","mode":"Flashcard","q":"A solution has pH 7.1 rather than pH 7.4. How does the hydrogen-ion concentration change? Show the working.","opts":[],"a":"The hydrogen-ion concentration increases by about two-fold. Working: [H⁺] ratio = 10⁻7.1 ÷ 10⁻7.4 = 10^0.3 ≈ 2.0.","notes":"A 0.3-unit pH fall means a 10⁰·³ ≈ 2-fold rise in [H⁺]; pH is logarithmic, not linear.","calc":true,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"47"},{"id":"q244","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","type":"Short answer","mode":"Flashcard","q":"How is replication of the circular E. coli chromosome initiated?","opts":[],"a":"Replication begins at oriC and proceeds bidirectionally, creating two replication forks. Helicase opens the duplex, single-strand DNA-binding proteins stabilise exposed DNA, and gyrase relieves torsional strain.","notes":"Common mistake: oriC is a DNA origin sequence, not an enzyme; two forks move away from it in opposite directions.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"50"},{"id":"q245","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"50b","type":"Short answer","mode":"Flashcard","q":"How are the leading and lagging strands elongated during E. coli DNA replication?","opts":[],"a":"DNA polymerases extend primers 5′→3′. The leading strand is synthesised continuously towards the fork, while the antiparallel lagging strand is synthesised discontinuously as Okazaki fragments.","notes":"Common mistake: both new strands grow 5′→3′; their different patterns result from antiparallel templates.","calc":false},{"id":"q246","module":"BS1030","topic":"Explain the basic mechanisms o let S=load();S.hidden=S.hidden||[];S.errors=S.errors||[];S.confidence=S.confidence||{};function save(){localStorage.setItem(KEY,JSON.stringify(S))}function normalise(q){return{...q,opts:q.opts||[],mode:q.mode||((q.opts||[]).length?'MCQ':'Flashcard')}}function questions(){let map=new Map(BUILTIN.map(q=>[q.id,normalise(q)]));S.custom.forEach(q=>map.set(q.id,normalise(q)));let hidden=new Set(S.hidden||[]);return[...map.values()].filter(q=>!hidden.has(q.id))}function st(id){return S.stats[id]||(S.stats[id]={seen:0,ok:0,bad:0,conf:0,next:0,lastCorrect:0})}function eligible(q,allowRecent=includeRecent){let x=st(q.id);return allowRecent||!x.lastCorrect||Date.now()>=(x.next||x.lastCorrect+S.settings.correctDays*DAY)}function isDue(q){let x=st(q.id);return x.seen>0&&x.next<=Date.now()&&eligible(q,false)}function fisher(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function mastery(q){let x=st(q.id);return x.seen?Math.min(100,Math.round(x.ok/x.seen*70+x.conf*7.5)):null}function updateStreak(){let t=today();if(S.streak.last===t)return;let d=new Date();d.setDate(d.getDate()-1);S.streak.count=S.streak.last===d.toISOString().slice(0,10)?S.streak.count+1:1;S.streak.last=t}

function recordMistake(q,chosen){mistakes.push({q,chosen,correct:answerText(q)});let key=q.module+' · '+q.topic,e=S.errors.find(x=>x.key===key);if(!e){e={key,module:q.module,topic:q.topic,count:0,last:0,items:[]};S.errors.push(e)}e.count++;e.last=Date.now();let item=e.items.find(x=>x.id===q.id);if(!item){item={id:q.id,q:q.q,count:0};e.items.push(item)}item.count++;save()}function requeueWrong(q){if(!session.slice(pos+1).some(x=>x.id===q.id))session.push(q)}
function grade(i){if(locked)return;locked=true;let q=session[pos],choice=shown[i],ok=choice.correct;schedule(q,ok);recordConfidence(q,ok);if(!ok){recordMistake(q,choice.text);requeueWrong(q)}document.querySelectorAll('.options button').forEach((b,j)=>{b.disabled=true;if(shown[j].correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('fb').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Correct':'Not quite'}</b><p><strong>Correct answer:</strong> ${esc(answerText(q))}</p>${usefulNote(q)?`<p>${esc(usefulNote(q))}</p>`:''}${teachBlock(q,choice.text)}<button class="primary next" onclick="next()">Next question</button></div>`}

function next(){if(finished)return;if(++pos<session.length)question();else finish(false)}function finish(timedOut=false){if(finished)return;finished=true;clearInterval(timer);if(sessionAnswered.size)S.sessions.push({date:today(),total:sessionAnswered.size,score});save();let rate=answeredCount?Math.round(score/answeredCount*100):0,msg=rate>=85?'Strong session.':rate>=60?'Review the questions you missed.':'Focus next on the missed questions.';$('study').innerHTML=`<div class="finish celebrate"><strong>✓</strong><h1>Session complete</h1><p class="encourage">${msg}</p><p>${score} correct ratings from ${answeredCount} attempts${timedOut?' before time expired':''}.</p>${mistakes.length?`<button class="primary" onclick="reviewMistakes()">Review mistakes</button>`:''} <button class="secondary" onclick="show('home')">Dashboard</button><div id="review"></div></div>`}function reviewMistakes(){$('review').innerHTML='<h2>Mistake review</h2>'+mistakes.map(m=>`<article class="mistake"><div><b>${esc(m.q.q)}</b><p><strong>Your answer:</strong> ${esc(m.chosen)}</p><p><strong>Correct:</strong> ${esc(m.correct)}</p><p>${esc(usefulNote(m.q))}</p></div></article>`).join('')}
function confidenceSummary(){let out={guess:{n:0,ok:0},unsure:{n:0,ok:0},confident:{n:0,ok:0}};Object.values(S.confidence||{}).forEach(x=>Object.keys(out).forEach(k=>{if(x[k]){out[k].n+=x[k].n||0;out[k].ok+=x[k].ok||0}}));return out}function errorNotebook(){let groups=[...(S.errors||[])].sort((a,b)=>b.count-a.count),c=confidenceSummary(),cw=c.confident.n-c.confident.ok;$('errors').innerHTML=`<div class="title"><div><h1>Error notebook</h1><p class="muted">Mistakes grouped by concept, not question number.</p></div>${groups.length?'<button class="danger" onclick="clearErrors()">Clear notebook</button>':''}</div><section class="panel"><h2>Confidence check</h2><div class="stats"><article><b>${c.guess.n?Math.round(c.guess.ok/c.guess.n*100):'—'}</b><span>Guess accuracy %</span></article><article><b>${c.unsure.n?Math.round(c.unsure.ok/c.unsure.n*100):'—'}</b><span>Unsure accuracy %</span></article><article><b>${c.confident.n?Math.round(c.confident.ok/c.confident.n*100):'—'}</b><span>Confident accuracy %</span></article><article><b>${cw}</b><span>Confident errors</span></article><article><b>${groups.reduce((n,g)=>n+g.count,0)}</b><span>Total logged errors</span></article></div></section>${groups.length?groups.map(g=>`<section class="panel error-group"><div class="head"><div><h3>${esc(shortTopicName(g.key))}</h3><p class="muted">${g.count} mistake${g.count===1?'':'s'} across ${g.items.length} question${g.items.length===1?'':'s'}.</p></div><button class="primary" onclick='startTopic(${JSON.stringify(g.key)})'>Practise concept</button></div>${g.items.sort((a,b)=>b.count-a.count).slice(0,5).map(i=>`<p><b>${i.count}×</b> ${esc(i.q)}</p>`).join('')}</section>`).join(''):'<section class="panel"><h2>No errors logged yet</h2><p class="muted">Incorrect answers and self-rated weak flashcards will appear here automatically.</p></section>'}`}function clearErrors(){if(confirm('Clear the error notebook? Progress scores will remain.')){S.errors=[];save();errorNotebook()}}
function renderTopics(){$('topics').innerHTML=`<div class="title"><div><h1>Topic tracker</h1><p class="muted">Mastery is based on attempted questions.</p></div></div><div class="grid">${topicRows().map(topicCard).join('')}</div>`}

function saveForm(mode){let id=$('editId').value,module=$('fModule').value,topic=$('fTopic').value.trim(),question=$('fQuestion').value.trim(),notes=$('fNotes').value.trim(),errors=[],existing=id?questions().find(x=>x.id===id):null,original=id?BUILTIN.find(x=>x.id===id):null,base=existing||original||{};if(!topic)errors.push('Topic is required.');if(!question)errors.push(mode==='MCQ'?'Question is required.':'Front is required.');let q={...base,id:id||'u'+Date.now(),module,topic,q:question,source:base.source||'Added by user',number:base.number||'',mode:base.mode||mode,type:base.type||(mode==='MCQ'?'Multiple choice':'Short answer'),notes,calc:base.calc||false,opts:[],a:''};if(mode==='MCQ'){q.opts='ABCD'.split('').map(l=>$('opt'+l).value.trim());let chosen=document.querySelector('input[name="correct"]:checked');q.a=chosen?chosen.value:'';q.calc=$('fCalc').checked;q.mode='MCQ';q.type='Multiple choice';if(q.opts.some(x=>!x))errors.push('All four options are required.');if(new Set(q.opts.map(x=>x.toLowerCase())).size!==4)errors.push('Options must not be duplicates.');if(!q.a)errors.push('Select the correct answer.')}else{q.a=$('fAnswer').value.trim();q.calc=$('fCalc').checked;q.mode='Flashcard';q.type='Short answer';if(!q.a)errors.push('Back is required.')}if(formErrors(errors))return;let i=S.custom.findIndex(x=>x.id===q.id);if(i>=0)S.custom[i]=q;else S.custom.push(q);formState={module,topic};save();openForm(mode);let ok=$('formSuccess');ok.hidden=false;ok.textContent=(id?'Question updated.':'Question saved.');list();$('fQuestion').focus()}

function parseCSV(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}function importCSV(f){if(!f)return;let r=new FileReader;r.onload=()=>{let rows=parseCSV(r.result),h=rows.shift()||[],count=0;rows.forEach(row=>{let o={};h.forEach((k,i)=>o[k.trim()]=row[i]||'');if(!o.Question)return;let opts=['Option A','Option B','Option C','Option D'].map(k=>(o[k]||'').trim()),hasAny=opts.some(Boolean),mode=hasAny?'MCQ':'Flashcard',answer=(o['Correct Answer']||'').trim().toUpperCase();if(mode==='MCQ'&&(opts.some(x=>!x)||new Set(opts.map(x=>x.toLowerCase())).size!==4||!/^[A-D]$/.test(answer)))return;S.custom.push({id:'i'+Date.now()+count++,module:o.Module||'Other',topic:o.Topic||'General',q:o.Question,opts:mode==='MCQ'?opts:[],a:mode==='MCQ'?answer:(o['Correct Answer']||''),notes:o.Notes||'',calc:/^(true|yes|1)$/i.test(o.Calculation||''),source:o.Source||'Imported',number:o['Question ID']||'',mode,type:mode==='MCQ'?'Multiple choice':'Short answer'})});save();library()};r.readAsText(f)}
function download(name,text){let u=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function backup(){download('bio-study-hub-backup.json',JSON.stringify({version:4,stats:S.stats,custom:S.custom,sessions:S.sessions,settings:S.settings,hidden:S.hidden||[],errors:S.errors||[],confidence:S.confidence||{},streak:S.streak},null,2))}function restore(f){if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);S.stats=x.stats||{};S.custom=x.custom||(x.questions||[]).filter(q=>!/^q\d+$/.test(q.id));S.sessions=x.sessions||[];S.settings=Object.assign(defaults().settings,x.settings||{});S.hidden=x.hidden||[];S.errors=x.errors||[];S.confidence=x.confidence||{};S.streak=x.streak||defaults().streak;save();library()}catch(e){alert('Invalid backup file.')}};r.readAsText(f)}
function auditData(){let q=[...BUILTIN,...S.custom],issues=[],ids=new Set(),texts=new Map();q.forEach(x=>{if(ids.has(x.id))issues.push('Duplicate ID: '+x.id);ids.add(x.id);let k=(x.q||'').trim().toLowerCase();if(k&&texts.has(k))issues.push('Duplicate question: '+x.q);else if(k)texts.set(k,x.id);if(!x.a||!x.q)issues.push('Missing question or answer: '+(x.id||'unnamed'));let mode=x.mode||((x.opts||[]).length?'MCQ':'Flashcard');if(mode==='MCQ'&&((x.opts||[]).length!==4||!/^[A-D]$/i.test(x.a||'')||new Set((x.opts||[]).map(v=>v.trim().toLowerCase())).size!==4))issues.push('Malformed MCQ: '+x.id)});return issues}function runAudit(){let issues=auditData(),el=$('auditResult');el.innerHTML=issues.length?`<p class="audit-bad">${issues.length} issue${issues.length===1?'':'s'} found</p><ul>${issues.slice(0,30).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="audit-ok">No duplicate IDs, duplicate question text, missing answers or malformed MCQs detected.</p>'}
function settings(){$('settings').innerHTML=`<div class="title"><div><h1>Settings</h1><p class="muted">Correct answers are hidden from every study mode for the selected period.</p></div></div><section class="panel form"><label>Daily question goal<input type="number" min="1" value="${S.settings.goal}" onchange="S.settings.goal=+this.value;save()"></label><label>Hide correctly answered questions for days<input type="number" min="3" value="${S.settings.correctDays}" onchange="S.settings.correctDays=Math.max(3,+this.value||3);this.value=S.settings.correctDays;save()"></label><button class="secondary" onclick="backup()">Export progress</button><button class="secondary" onclick="runAudit()">Check question-bank integrity</button><div id="auditResult"></div><button class="danger" onclick="resetProgress()">Reset progress</button></section>`}function resetProgress(){if(confirm('Clear scores and sessions?')){S.stats={};S.sessions=[];S.streak=defaults().streak;save();settings()}}
document.addEventListener('keydown',e=>{if(!$('study')||$('study').hidden)return;let tag=(e.target&&e.target.tagName||'').toLowerCase();if(['input','textarea','select','button'].includes(tag)||e.target?.isContentEditable)return;if(!locked&&shown.length&&/^[a-d]$/i.test(e.key)){let i='ABCD'.indexOf(e.key.toUpperCase());if(i<shown.length)grade(i)}else if(!locked&&!shown.length&&e.code==='Space'){e.preventDefault();flipCard()}else if(locked&&!finished&&e.key==='Enter'&&document.querySelector('.next'))next()});show('home');</script></body></html>
