<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12335f"><title>Sukesh Study Companion</title><style>
*{box-sizing:border-box}:root{--b:#2563eb;--n:#10233d;--m:#66758a;--l:#dfe6ef;--bg:#f4f7fb;--g:#0c9b6b;--r:#dc4963}body{margin:0;background:var(--bg);color:var(--n);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}header{height:64px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100% - 1120px)/2));position:sticky;top:0;z-index:5}header b{display:flex;align-items:center;gap:9px}header i{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#10b981);color:#fff;display:grid;place-items:center;font-style:normal}nav button{border:0;background:transparent;padding:10px;color:var(--m);border-radius:10px}nav button.active{background:#eaf2ff;color:var(--b);font-weight:700}main{max-width:1120px;margin:auto;padding:28px 18px 92px}.hero{background:linear-gradient(120deg,#12335f,#087b7b);color:#fff;border-radius:25px;padding:34px;display:grid;grid-template-columns:1fr auto;gap:22px}.hero h1{font-size:clamp(29px,5vw,48px);margin:4px 0}.hero p{color:#d9e9f4}.goal{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#5ce1c3 calc(var(--p)*1%),#ffffff30 0);font-weight:800}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:12px;padding:12px 16px;font-weight:750}.primary{background:var(--b);color:#fff}.hero .primary{background:#fff;color:#174276}.secondary{background:#fff;border:1px solid var(--l);color:var(--n)}.hero .secondary{background:transparent;border-color:#91bdc6;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:18px 0}.stats article,.panel,.topic{background:#fff;border:1px solid var(--l);border-radius:17px;padding:19px}.stats b{display:block;font-size:28px}.muted,.stats span{color:var(--m);font-size:13px}.panel{margin:18px 0}.head,.title{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.head h2,.title h1{margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.topic b,.topic span{display:block}.bar{height:8px;background:#edf1f5;border-radius:9px;margin:13px 0;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ef8e5f,#16a37a)}.topic footer{display:flex;justify-content:space-between;align-items:center}.topic button{border:0;background:#eaf2ff;color:var(--b);border-radius:8px;padding:7px 9px;font-weight:700}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.modes button{text-align:left;padding:18px;background:#f8faff;border:1px solid var(--l);border-radius:14px}.modes b,.modes small{display:block}.modes small{color:var(--m);margin-top:5px}.studytop{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;max-width:820px;margin:auto}.prog{height:8px;background:#dfe7f0;border-radius:9px;overflow:hidden}.prog i{height:100%;display:block;background:var(--b)}.card{max-width:820px;margin:16px auto;background:#fff;border:1px solid var(--l);border-radius:22px;padding:clamp(22px,5vw,42px)}.card h1{font-size:clamp(23px,4vw,33px)}.chips span{background:#eaf2ff;color:#245aae;border-radius:99px;padding:6px 9px;font-size:12px;margin-right:5px}.options{display:grid;gap:11px;margin-top:22px}.options button{display:flex;gap:13px;text-align:left;background:#fff;border:1px solid var(--l);border-radius:13px;padding:15px}.options button b{min-width:29px;height:29px;background:#edf2f7;border-radius:8px;display:grid;place-items:center}.options .correct{background:#e9faf3;border-color:var(--g)}.options .wrong{background:#fff0f3;border-color:var(--r)}textarea{width:100%;min-height:130px;border:1px solid var(--l);border-radius:12px;padding:12px;margin:15px 0}.feedback{padding:17px;border-radius:13px;margin-top:18px}.good{background:#e9faf3}.bad{background:#fff0f3}.neutral{background:#f1f5f9}.next{display:block;margin:14px 0 0 auto}.library article{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding:12px 0;gap:12px}.library span{display:block;color:var(--m);font-size:12px}.library article button{border:0;background:transparent;color:var(--r);font-size:20px}.import{display:grid;grid-template-columns:1fr 1fr;gap:22px}.search,input,select{border:1px solid var(--l);border-radius:10px;padding:11px}.form{display:grid;gap:10px}.form label{display:grid;gap:5px}.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.heat div{padding:10px;border-radius:9px;text-align:center;font-size:12px}body>footer{display:none}.finish{text-align:center;max-width:580px;margin:50px auto;background:#fff;border-radius:22px;padding:40px}.finish strong{display:grid;place-items:center;margin:auto;width:65px;height:65px;border-radius:50%;background:#dff8ee;color:var(--g);font-size:30px}@media(max-width:780px){header nav{display:none}.hero{grid-template-columns:1fr}.goal{width:82px;height:82px}.stats{grid-template-columns:1fr 1fr}.grid,.modes,.import{grid-template-columns:1fr}.title,.head{align-items:flex-start;flex-direction:column}.search{width:100%}body>footer{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);z-index:6;padding:6px}body>footer button{border:0;background:transparent;color:var(--m);font-size:18px}body>footer small{display:block;font-size:10px}main{padding-top:18px}.card{border-radius:17px;padding:21px}}
</style></head><body><header><b><i>S</i> Study Companion</b><nav><button data-p="home">Dashboard</button><button data-p="topics">Topics</button><button data-p="library">Questions</button><button data-p="settings">Settings</button></nav></header><main id="home"></main><main id="topics" hidden></main><main id="study" hidden></main><main id="library" hidden></main><main id="settings" hidden></main><footer><button data-p="home">⌂<small>Home</small></button><button data-p="topics">▦<small>Topics</small></button><button onclick="start('smart',10)">▶<small>Study</small></button><button data-p="library">＋<small>Questions</small></button><button data-p="settings">⚙<small>Settings</small></button></footer><script>const STARTER=[{"id": "q1", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Chemistry of nucleic acids", "number": "1", "q": "Why are phosphates charged at neutral pH?", "opts": [], "a": "The pKa of phosphate protons are such that they dissociate above pH2.0", "type": "Short answer", "notes": ""}, {"id": "q2", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Chemistry of nucleic acids", "number": "2", "q": "What is the difference between DNA and RNA?", "opts": [], "a": "The ribose in DNA lacks an OH group at position2 of the ribose", "type": "Short answer", "notes": ""}, {"id": "q3", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Chemistry of nucleic acids", "number": "3", "q": "How does this difference affect the stability of these polymers?", "opts": [], "a": "The lack of the slightly reactive C2-OH means that DNA is more stable than RNA", "type": "Short answer", "notes": ""}, {"id": "q4", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Chemistry of nucleic acids", "number": "4", "q": "Why do you not get purine-purine or pyrimidine -pyrimidine base-pairs in duplex DNA?", "opts": [], "a": "They could not form optimal complementary \"Watson-Crick\" base pairs, but more importantly they would cause a narrowing or widening of the spacing between the DNA strands.", "type": "Short answer", "notes": ""}, {"id": "q5", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Chemistry of nucleic acids", "number": "5", "q": "How many carbon atoms are in the ring of a ribose sugar?", "opts": [], "a": "Four - the fifth carbon is not part of the ribose ring which include an oxygen.", "type": "Short answer", "notes": ""}, {"id": "q6", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Chemistry of nucleic acids", "number": "6", "q": "What is a beta-glycosidic bond? How does it differ from a phosphodiester bond?", "opts": [], "a": "Please look at slides 11 and 16 in Episode 1.", "type": "Short answer", "notes": ""}, {"id": "q7", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Chemistry of nucleic acids", "number": "7", "q": "Why do we say that single stranded DNA is polar, but DNA duplexes are not polar?", "opts": [], "a": "One strand of DNA has a 5' end and a 3' end. Duplex DNA has both 5' and 3' ends at each end of the duplex.", "type": "Short answer", "notes": ""}, {"id": "q8", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Chemistry of nucleic acids", "number": "8", "q": "What is the sequence hypothesis?", "opts": [], "a": "The sequence of bases in DNA determines the sequence of amino acids in proteins.", "type": "Short answer", "notes": ""}, {"id": "q9", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Forces", "number": "9", "q": "List in order of strength the forces involved in determining macromolecular structure?", "opts": [], "a": "Covalent bonds - Electrostatic bonds - Hydrogen bonds - Van der Waals interactions.", "type": "Short answer", "notes": ""}, {"id": "q10", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "Forces", "number": "10", "q": "Which one is not relevant when considering interaction between two different macromolecules?", "opts": [], "a": "Covalent bonds - if there were covalent interactions between \"two\" macromolecules they would be \"one\" macromolecule", "type": "Short answer", "notes": ""}, {"id": "q11", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA structure", "number": "11", "q": "What suggests the DNA is helical?", "opts": [], "a": "The \"X\" shaped diffraction pattern", "type": "Short answer", "notes": ""}, {"id": "q12", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA structure", "number": "12", "q": "What are the differences between the DNA double helix and an alpha-helix?", "opts": [], "a": "Many, but most of all alpha-helices are secondary structures found in proteins", "type": "Short answer", "notes": ""}, {"id": "q13", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA structure", "number": "13", "q": "How can DNA-binding proteins (such as restriction enzymes) recognise the base sequence in a DNA duplex?", "opts": [], "a": "They can \"recognise\" the edges of the base-pairs in the major groove", "type": "Short answer", "notes": ""}, {"id": "q14", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA structure", "number": "14", "q": "Why do DNA circles or constrained loops help DNA packaging?", "opts": [], "a": "They can be super-coiled to increase local density. This is effectively one of the functions of the histone octamers.", "type": "Short answer", "notes": ""}, {"id": "q15", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA structure", "number": "15", "q": "What are the conditions needed for two DNA strands to re-anneal?", "opts": [], "a": "They must have complementary sequence and be annealed by slow cooling.", "type": "Short answer", "notes": ""}, {"id": "q16", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Polymerases", "number": "16", "q": "Why are restriction enzymes useful to microrganisms?", "opts": [], "a": "They serve a protective role by degrading foreign DNA", "type": "Short answer", "notes": ""}, {"id": "q17", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Polymerases", "number": "17", "q": "Why are restriction enzymes useful to molecular biologists?", "opts": [], "a": "They enable us to create DNA fragments with complementary sticky ends that can be joined together using DNA ligase.", "type": "Short answer", "notes": ""}, {"id": "q18", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Polymerases", "number": "18", "q": "What are the three enzymatic activities of DNA Pol I", "opts": [], "a": "5'-3' polymerase; 3'-5' exonuclease; 5'-3' nuclease", "type": "Short answer", "notes": ""}, {"id": "q19", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Polymerases", "number": "19", "q": "How does the DNA clamp (two beta-subunits of DNA Pol III) contribute to the activity of the polymerase enzyme?", "opts": [], "a": "It reduces dissociation from the DNA template and thereby increases processivity", "type": "Short answer", "notes": ""}, {"id": "q20", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Replication", "number": "20", "q": "Have you read the Watson and Crick paper from 1953? What sentence did they include that indicated that they understood the implications of their model for DNA replication?", "opts": [], "a": "\"It has not escaped our notice that the specific pairing we have postulated immediately suggests a possible copying mechanism for the genetic material\"", "type": "Short answer", "notes": ""}, {"id": "q21", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Replication", "number": "21", "q": "What is a replication fork?", "opts": [], "a": "It is point where the two parental strands are separated to enable each strand to be copied", "type": "Short answer", "notes": ""}, {"id": "q22", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Replication", "number": "22", "q": "Why do we call one strand discontinuous? Why must it be like that?", "opts": [], "a": "It is discontinuous because the DNA is copied in \"Okazaki fragments\" because DNA polymerases can only replicate DNA in the 5' to 3' direction.", "type": "Short answer", "notes": ""}, {"id": "q23", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Replication", "number": "23", "q": "What enzymes are located in the vicinity of the replication fork?", "opts": [], "a": "Helicase, DNA Pol I, DNA Pol III, Primase, DNA ligase", "type": "Short answer", "notes": ""}, {"id": "q24", "source": "BS1030 Self-test questions", "module": "BS1030", "topic": "DNA Replication", "number": "24", "q": "What enzymes are important for DNA replication but not necessarily located at the replication fork?", "opts": [], "a": "DNA Gyrase and Pyrophophatase", "type": "Short answer", "notes": ""}, {"id": "q25", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "1", "q": "Which statement best explains why phospholipids spontaneously form bilayers in water?", "opts": ["Their hydrophilic tails bind one another covalently", "Their hydrophobic tails cluster away from water while hydrophilic heads face water", "Their phosphate groups move into the bilayer centre", "Every phospholipid is permanently attached to a membrane protein"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q26", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "2", "q": "A cell is transferred to a hypotonic solution. What is the most immediate expected change?", "opts": ["Water leaves the cell and it shrinks", "Water enters the cell and it swells", "K+ enters and water follows immediately", "The plasma membrane becomes impermeable to water"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q27", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "3", "q": "During regulatory volume decrease, why does loss of intracellular K+ help a swollen cell recover?", "opts": ["It raises intracellular osmolality", "It lowers intracellular osmolality so water can leave", "It directly digests excess water", "It makes the membrane completely rigid"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q28", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "4", "q": "The osmotic gradient is unchanged, but a cell inserts more aquaporins into its membrane. What is most likely?", "opts": ["Water permeability and water flux increase", "Water permeability decreases but flux increases", "Only solute permeability increases", "No membrane property changes"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q29", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "5", "q": "Which statement correctly distinguishes water flux from membrane permeability?", "opts": ["Flux is a membrane property only; permeability is the driving force", "Flux is movement per unit time; permeability describes how readily the membrane permits movement", "They are identical terms", "Permeability always increases when osmolality increases"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q30", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "6", "q": "An inhibitor prevents ATP hydrolysis by an ABC transporter. What is the most direct consequence?", "opts": ["Transport driven by that ABC protein decreases or stops", "Passive diffusion through the lipid bilayer accelerates", "All membrane proteins are degraded", "The transported solute is converted into ATP"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q31", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "7", "q": "A receptor-bound ligand is internalised by receptor-mediated endocytosis. Which compartment does it usually enter first?", "opts": ["Nucleus", "Early endosome", "Mitochondrial matrix", "Golgi trans face"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q32", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "8", "q": "Which route best describes recycling of an internalised plasma-membrane receptor?", "opts": ["Early endosome -> recycling endosome -> plasma membrane", "Lysosome -> nucleus -> plasma membrane", "ER -> lysosome -> mitochondrion", "Plasma membrane -> nucleolus -> Golgi"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q33", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "9", "q": "Which sequence best represents a common degradative endocytic pathway?", "opts": ["Plasma membrane -> early endosome -> late endosome -> lysosome", "Plasma membrane -> nucleus -> peroxisome", "Golgi -> ribosome -> lysosome", "Early endosome -> ER -> chloroplast"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q34", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "10", "q": "A signalling response begins normally but remains activated much longer than usual. Which defect best explains this?", "opts": ["Excessive negative feedback", "Loss of negative feedback or pathway deactivation", "Complete absence of receptors", "Failure to produce the initial signal"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q35", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "11", "q": "A protein contains the sequence KKKRK. What destination is most consistent with this motif?", "opts": ["Nucleus", "Extracellular space only", "Lysosome via mannose-6-phosphate", "Peroxisome via SKL"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q36", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "12", "q": "What is the main role of an importin?", "opts": ["To synthesise proteins in the nucleus", "To recognise nuclear localisation signals and mediate nuclear import", "To digest proteins entering the nucleus", "To export all RNA without selection"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q37", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "13", "q": "A secreted protein is being synthesised. Which pathway is most appropriate?", "opts": ["Free ribosome -> nucleus -> plasma membrane", "Rough ER -> Golgi apparatus -> secretory vesicle -> plasma membrane", "Lysosome -> peroxisome -> cytosol", "Mitochondrion -> nucleus -> Golgi"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q38", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "14", "q": "Which organelle is especially associated with protein modification and the start of the secretory pathway?", "opts": ["Rough endoplasmic reticulum", "Centrosome", "Nucleolus", "Peroxisome only"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q39", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "15", "q": "Where do oxidative-phosphorylation reactions occur in a eukaryotic cell?", "opts": ["Cytosol", "Inner mitochondrial membrane", "Nuclear envelope only", "Lysosomal lumen"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q40", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "16", "q": "A plate contains 42 colonies after 0.20 ml of a 10^-5 dilution is plated. What was the original concentration?", "opts": ["2.1 x 10^5 CFU/ml", "2.1 x 10^6 CFU/ml", "2.1 x 10^7 CFU/ml", "8.4 x 10^7 CFU/ml"], "a": "C", "type": "Multiple choice", "notes": ""}, {"id": "q41", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "17", "q": "A count of 60 plaques is obtained from 0.10 ml of a 10^-7 dilution. What is the original titre?", "opts": ["6.0 x 10^7 PFU/ml", "6.0 x 10^8 PFU/ml", "6.0 x 10^9 PFU/ml", "6.0 x 10^10 PFU/ml"], "a": "C", "type": "Multiple choice", "notes": ""}, {"id": "q42", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "18", "q": "You have 2 x 10^6 cells and require an MOI of 5. How many infectious units are needed?", "opts": ["4 x 10^5", "2 x 10^6", "1 x 10^7", "1 x 10^8"], "a": "C", "type": "Multiple choice", "notes": ""}, {"id": "q43", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "19", "q": "A viral stock is 5 x 10^8 PFU/ml. What volume supplies 1 x 10^8 PFU?", "opts": ["0.02 ml", "0.20 ml", "2.0 ml", "5.0 ml"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q44", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "20", "q": "Why can optical density remain high when a viable-count result is low?", "opts": ["Optical density detects only living cells", "Dead cells and debris can still scatter light", "CFU counts every physical particle", "Optical density measures DNA sequence"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q45", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "21", "q": "What mainly occurs during the lag phase of a batch-culture growth curve?", "opts": ["Cells adapt to the new conditions before maximal division", "The viable count necessarily falls to zero", "Nutrients are unlimited and division is maximal", "Cell division exactly balances cell death"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q46", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "22", "q": "Which description best fits exponential phase?", "opts": ["Cells divide at an approximately maximal and regular rate", "Cells never divide", "Growth equals death exactly", "Only secondary metabolites can be produced"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q47", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "23", "q": "What best characterises stationary phase in a closed batch culture?", "opts": ["Growth rate exceeds death indefinitely", "Overall cell number is relatively stable because growth and death are balanced or net growth has ceased", "Every cell is metabolically inactive", "The culture has returned to lag phase"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q48", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "24", "q": "In microbial nutritional classification, what does 'photo-' specify?", "opts": ["Carbon source", "Energy source", "Electron acceptor only", "Cell-wall type"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q49", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "25", "q": "What does 'heterotroph' specify?", "opts": ["Use of organic carbon as a carbon source", "Use of light as energy", "Use of inorganic electron donors only", "Complete inability to use carbon"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q50", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "26", "q": "Which statement about secondary metabolites is most accurate?", "opts": ["They are always essential for basic growth", "They are often produced in later growth phases and are not directly required for basic growth", "They are identical to ATP", "They can be produced only by viruses"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q51", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "27", "q": "Why is a Bunsen burner flame used near an aseptic work area?", "opts": ["It sterilises all air in the room", "Its convection current helps reduce deposition of airborne contaminants near the work zone", "It makes bacteria unable to mutate", "It replaces all other sterilisation methods"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q52", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "28", "q": "What main conclusion came from Pasteur's swan-neck flask experiments?", "opts": ["Microorganisms arise spontaneously from sterile broth", "Air itself prevents growth", "Microorganisms come from pre-existing contamination rather than spontaneous generation", "Broth cannot support microbial growth"], "a": "C", "type": "Multiple choice", "notes": ""}, {"id": "q53", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "29", "q": "Which method specifically estimates viable colony-forming units under the chosen culture conditions?", "opts": ["Plate count", "Gram stain alone", "Dry mass only", "Genome sequencing"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q54", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "30", "q": "Which statement best defines transformation in bacteria?", "opts": ["Transfer of DNA by bacteriophage", "Uptake of free DNA from the environment", "Direct cell-to-cell transfer only", "Replication of viral RNA"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q55", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "31", "q": "Which observation most strongly supports transduction?", "opts": ["DNA transfer requires a bacteriophage", "DNA transfer is stopped by removing cell contact", "Cells take up purified DNA directly", "Only plasmids move through a pilus"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q56", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "32", "q": "Which feature defines conjugation most directly?", "opts": ["Uptake of naked DNA", "Phage-mediated transfer", "Direct cell-to-cell DNA transfer, often involving a conjugative plasmid", "Transfer of protein without nucleic acid"], "a": "C", "type": "Multiple choice", "notes": ""}, {"id": "q57", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "33", "q": "Extracellular DNase prevents acquisition of a resistance marker. Which mechanism was most likely responsible?", "opts": ["Transformation", "Transduction", "Conjugation", "Binary fission"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q58", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "34", "q": "Which is the correct order for constructing and selecting a simple genomic library?", "opts": ["Transform -> digest vector -> fragment DNA -> ligate", "Fragment genomic DNA -> digest vector -> ligate insert and vector -> transform bacteria -> select transformants", "Select bacteria -> fragment vector -> translate insert", "Ligate bacteria -> digest colonies -> transform DNA"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q59", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "35", "q": "What does an antibiotic-resistance marker on a cloning vector allow you to identify?", "opts": ["Cells that retained the vector", "Cells containing any DNA mutation", "Cells that lost the vector", "Viruses without nucleic acid"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q60", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "36", "q": "Which component is present in every virion?", "opts": ["A lipid envelope", "Both DNA and RNA", "Nucleic acid and a protein capsid", "A cellular ribosome"], "a": "C", "type": "Multiple choice", "notes": ""}, {"id": "q61", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "37", "q": "What distinguishes an enveloped virus from a non-enveloped virus?", "opts": ["The presence of a host-derived lipid bilayer around the capsid", "The absence of a genome", "The presence of bacterial ribosomes", "The ability to infect cells"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q62", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "38", "q": "A viral genome can be translated immediately after uncoating. Which genome type is most consistent with this?", "opts": ["Positive-sense single-stranded RNA", "Negative-sense single-stranded RNA without polymerase", "Double-stranded DNA that has not been transcribed", "A protein-only genome"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q63", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "39", "q": "Why must a negative-sense RNA virus supply or encode an RNA-dependent RNA polymerase?", "opts": ["To convert its genome into positive-sense RNA that can be translated", "To build a peptidoglycan wall", "To make host DNA enter a lysosome", "To translate proteins without RNA"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q64", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "40", "q": "What must occur before a retroviral RNA genome can become integrated DNA?", "opts": ["Reverse transcription", "Translation into peptidoglycan", "Conversion into a protein capsid only", "Direct chromosome segregation"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q65", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "41", "q": "What does PFU measure most directly?", "opts": ["All physical virus particles", "Infectious units capable of forming plaques under the assay conditions", "Only viral proteins", "Host-cell concentration"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q66", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "42", "q": "A virus acquires a mutation. Which conclusion is justified without further evidence?", "opts": ["It must be more virulent", "Its genotype changed, but its effect on phenotype or virulence must be tested", "It can no longer replicate", "It has become a bacterium"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q67", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "43", "q": "Which cytoskeletal component is the principal structural element of the mitotic spindle?", "opts": ["Microtubules", "Peptidoglycan", "Cellulose", "Phospholipid tails"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q68", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "44", "q": "Which cytoskeletal component is most directly associated with lamellipodia and the contractile ring?", "opts": ["Actin filaments", "Microtubules only", "Bacterial flagellin", "Collagen fibres"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q69", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "45", "q": "Which statement about post-translational modifications is best?", "opts": ["They can alter protein charge, shape, activity or interactions", "They always destroy the protein", "They occur only in bacteria", "They never affect localisation"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q70", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "46", "q": "What is the outcome of meiosis from one diploid precursor, in general terms?", "opts": ["One DNA replication followed by two divisions produces haploid cells", "Two DNA replications followed by one division produces diploid cells", "No DNA replication occurs", "The chromosome number always doubles"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q71", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "47", "q": "During meiotic recombination, crossing over normally occurs between which structures?", "opts": ["Non-sister chromatids of homologous chromosomes", "Sister chromatids only", "Unrelated proteins", "Cell membranes"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q72", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "48", "q": "Which statement best describes innate immunity?", "opts": ["Rapid and broadly acting, without antigen-specific adaptive memory", "Dependent entirely on antibodies", "Present only after vaccination", "Specific to one pathogen strain from birth"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q73", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "49", "q": "How can cholera produce severe watery diarrhoea without extensive killing of intestinal epithelial cells?", "opts": ["The toxin alters ion transport, causing water secretion", "The bacterium removes all intestinal blood vessels", "The toxin converts epithelial cells into viruses", "The disease is caused only by dehydration before infection"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q74", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "50", "q": "What is the principal target of penicillin and related beta-lactam antibiotics?", "opts": ["Peptidoglycan cell-wall synthesis", "Eukaryotic cholesterol synthesis", "Viral capsid assembly", "Host mitochondrial DNA replication"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q75", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "51", "q": "Which statement is a fair comparison of typical bacterial and eukaryotic cells?", "opts": ["Both commonly use double-stranded DNA as genetic material", "Bacteria always contain a nucleus", "Eukaryotes never contain ribosomes", "Only bacteria have plasma membranes"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q76", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "52", "q": "Which list correctly gives Woese's three domains?", "opts": ["Plants, animals and fungi", "Bacteria, Archaea and Eukaryotes", "Prokaryotes, viruses and eukaryotes", "Bacteria, protists and fungi"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q77", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "53", "q": "On a phylogenetic tree, which feature is the best guide to evolutionary relatedness?", "opts": ["How close names appear on the printed page", "The most recent common ancestor indicated by branching order", "The colour of each branch", "The length of each organism's name"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q78", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "54", "q": "An internal branch of a phylogenetic tree is rotated around a node. What changes?", "opts": ["The evolutionary relationships", "Only the visual arrangement, not the clades or ancestry", "The DNA sequence of every species", "The identity of the root"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q79", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "55", "q": "Which hypothesis is most scientifically useful?", "opts": ["Cells are interesting", "If aquaporin abundance increases while osmotic conditions are held constant, water permeability will increase", "This result will definitely prove the theory", "Membranes always behave normally"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q80", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "56", "q": "Two independent groups are compared for a continuous normally distributed outcome. Which test may be appropriate if assumptions are met?", "opts": ["Independent-samples t-test", "Paired t-test automatically", "A test for sequence alignment", "No statistical test can compare means"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q81", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "57", "q": "Which experimental design gives the strongest test of whether aquaporin abundance affects water permeability?", "opts": ["Change aquaporin abundance while controlling osmotic gradient, temperature and other relevant variables", "Change aquaporins and osmolality at the same time", "Measure only one untreated cell and generalise", "Choose results after seeing which support the prediction"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q82", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "58", "q": "A plate count is repeated three times under identical conditions and gives very different results. What is the best first interpretation?", "opts": ["The method may have poor precision or uncontrolled variation", "The mean is automatically correct", "The dilution factor no longer matters", "The organism has become a virus"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q83", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "59", "q": "Which action best improves reliability of a quantitative microbiology result?", "opts": ["Use replicate measurements and a consistent method", "Discard every value that differs from expectation", "Change several variables between repeats", "Report a value without units"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q84", "source": "BS1040 Timed Mock", "module": "BS1040", "topic": "Section A: Multiple-Choice Questions", "number": "60", "q": "Which conclusion is most appropriate when an experiment supports a prediction?", "opts": ["The hypothesis is proven permanently", "The result supports the hypothesis under the tested conditions, while alternatives and limitations should still be considered", "Every related mechanism is now known", "Contradictory evidence can be ignored"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q85", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section A: DNA Structure, Replication, Transcription and Translation", "number": "1", "q": "Components of DNA include", "opts": ["Adenine", "Alanine", "AMP", "ATP"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q86", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section A: DNA Structure, Replication, Transcription and Translation", "number": "2", "q": "In the structure of DNA, the backbone forms by:", "opts": ["hydrogen bonding between deoxyribose sugars.", "hydrogen bonding between nitrogenous bases.", "phosphodiester linkages between deoxyribose sugars.", "phosphodiester linkages between nitrogenous bases."], "a": "C", "type": "Multiple choice", "notes": ""}, {"id": "q87", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section A: DNA Structure, Replication, Transcription and Translation", "number": "3", "q": "In the structure of DNA most commonly found in cells:", "opts": ["pairing of pyrimidine with purine bases creates a double helix with a diameter of 0.34 nm.", "pairing of pyrimidine with purine bases creates a double helix with a diameter of 2 nm.", "pairing of pyrimidine with pyrimidine and purine with purine bases creates a double helix with a diameter of 0.34 nm.", "pairing of pyrimidine with pyrimidine and purine with purine bases creates a double helix with a diameter of 2 nm."], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q88", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section A: DNA Structure, Replication, Transcription and Translation", "number": "4", "q": "During prokaryotic DNA replication, 3' to 5' exonuclease activity is required for:", "opts": ["proofreading.", "removal of supercoils ahead of the replication fork.", "RNA primer removal.", "unwinding the double helix."], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q89", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section A: DNA Structure, Replication, Transcription and Translation", "number": "5", "q": "In the replication of prokaryotic DNA, DNA ligase catalyses:", "opts": ["formation of hydrogen bonds between the template and daughter strands of DNA.", "formation of hydrogen bonds between Okazaki fragments.", "formation of phosphodiester bonds between the template and daughter strands of DNA.", "formation of phosphodiester bonds between Okazaki fragments."], "a": "D", "type": "Multiple choice", "notes": ""}, {"id": "q90", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section A: DNA Structure, Replication, Transcription and Translation", "number": "6", "q": "The enzyme primase, involved in the replication of prokaryotic DNA, is a(n):", "opts": ["DNA polymerase", "helicase", "RNA ligase", "RNA polymerase"], "a": "D", "type": "Multiple choice", "notes": ""}, {"id": "q91", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section A: DNA Structure, Replication, Transcription and Translation", "number": "7", "q": "Regarding the transcription of mRNA, which of the following statements is INCORRECT?", "opts": ["All the nucleotides that are transcribed will be translated into amino acids.", "The nucleotide after the transcription start site is called the +1 nucleotide.", "The promoter region is upstream (to the 5' side) of the transcription start site.", "The transcription termination site is downstream (to the 3' side) of the transcription start site."], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q92", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section A: DNA Structure, Replication, Transcription and Translation", "number": "8", "q": "The processing of pre-mRNA to mRNA includes:", "opts": ["addition of a cap at the 5' end.", "joining of Okazaki fragments by ligase.", "removal of exons.", "stabilisation of RNA through addition of a poly-U tail at the 3' end."], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q93", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section A: DNA Structure, Replication, Transcription and Translation", "number": "9", "q": "Stop codons on", "opts": ["mRNA signal the end of transcription.", "mRNA signal the end of translation.", "the coding strand of DNA signal the end of transcription.", "the non-coding strand of DNA signal the end of transcription."], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q94", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section A: DNA Structure, Replication, Transcription and Translation", "number": "10", "q": "Termination of transcription in prokaryotes may involve", "opts": ["addition of a poly-A tail.", "a stem-loop structure in the transcript.", "a stop codon.", "GTP hydrolysis by release factors."], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q95", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section A: DNA Structure, Replication, Transcription and Translation", "number": "11", "q": "During the process of translation, ribosomes move in which way?", "opts": ["along mRNA in the direction 3' to 5', synthesising a polypeptide in the C- to N-terminal direction.", "along mRNA in the direction 3' to 5', synthesising a polypeptide in the N- to C-terminal direction.", "along mRNA in the direction 5' to 3', synthesising a polypeptide in the C- to N-terminal direction.", "along mRNA in the direction 5' to 3', synthesising a polypeptide in the N- to C-terminal direction."], "a": "D", "type": "Multiple choice", "notes": ""}, {"id": "q96", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section A: DNA Structure, Replication, Transcription and Translation", "number": "12", "q": "During translation in prokaryotes, the majority of activated tRNA molecules enter the ribosome at the:", "opts": ["5' end", "3' end", "A-site.", "P-site."], "a": "C", "type": "Multiple choice", "notes": ""}, {"id": "q97", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section B: Amino Acids and Protein Structure", "number": "21", "q": "Which of the following best describes the peptide aspartate-alanine-phenylalanine? It contains:", "opts": ["one amino acid with a hydrophobic side chain and has phenylalanine at its carboxyl (C)-terminus.", "one amino acid with a hydrophobic side chain and has phenylalanine at its amino (N)-terminus.", "one amino acid with an acidic side chain and has phenylalanine at its carboxyl (C)-terminus.", "one amino acid with an acidic side chain and has phenylalanine at its amino (N)-terminus."], "a": "C", "type": "Multiple choice", "notes": ""}, {"id": "q98", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section B: Amino Acids and Protein Structure", "number": "22", "q": "The pKa for the side-chain amino group in histidine is 6.0. If working at physiological pH 7.0, what would be the ratio of protonated to unprotonated histidine?", "opts": ["1:1", "1:10", "2:1", "10:1"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q99", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section B: Amino Acids and Protein Structure", "number": "23", "q": "Which one of the following statements is FALSE? The alpha-helix:", "opts": ["has the side chains of hydrophobic amino acids oriented towards the centre of the helix.", "is a right-handed helix.", "is stabilised by hydrogen bonds between N-H and C=O groups in peptide bonds.", "is disrupted by the amino acid proline."], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q100", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section C: Mutation, DNA Repair and PCR", "number": "34", "q": "Which bases are lost during depurination?", "opts": ["Adenine and Guanine", "Thymine and Adenine", "Thymine and Uracil", "Cytosine and Guanine"], "a": "A", "type": "Multiple choice", "notes": ""}, {"id": "q101", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section C: Mutation, DNA Repair and PCR", "number": "35", "q": "Which of the following can cause spontaneous mutations in DNA?", "opts": ["alkylating agents", "deamination of cytosine", "errors in RNA polymerase action", "intercalating agents"], "a": "B", "type": "Multiple choice", "notes": ""}, {"id": "q102", "source": "Biochemistry Practice Paper", "module": "Biochemistry", "topic": "Section C: Mutation, DNA Repair and PCR", "number": "36", "q": "A point mutation that occurs in the p D: Metabolism", "number": "57", "q": "Gluconeogenesis is a process in the liver by which glucose can be synthesised from:", "opts": ["alanine, fatty acids and glycerol.", "alanine, fatty acids and lactate or pyruvate.", "alanine, glycogen and fatty acids.", "alanine, lactate or pyruvate, and glycerol."], "a": "D", "type": "Multiple choice", "notes": ""}, {"id": "q112", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "1", "q": "Why can an osmotic gradient increase water movement without increasing permeability?", "opts": [], "a": "The gradient changes the driving force, while permeability depends on membrane properties such as lipid composition and aquaporins.", "type": "Short answer", "notes": ""}, {"id": "q113", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "2", "q": "What happens if K+ release is blocked during hypotonic stress?", "opts": [], "a": "Swelling is likely to persist, increasing the risk of membrane damage or lysis.", "type": "Short answer", "notes": ""}, {"id": "q114", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "3", "q": "Why may OD be high when CFU is low?", "opts": [], "a": "OD includes scattering from nonviable cells and debris, whereas CFU counts colony-forming units under the culture conditions.", "type": "Short answer", "notes": ""}, {"id": "q115", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "4", "q": "What does a rising growth-curve segment usually indicate?", "opts": [], "a": "Exponential growth: nutrients are not yet strongly limiting and cells are actively dividing.", "type": "Short answer", "notes": ""}, {"id": "q116", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "5", "q": "What feature distinguishes enveloped viruses?", "opts": [], "a": "A lipid bilayer, commonly derived from host membranes during budding.", "type": "Short answer", "notes": ""}, {"id": "q117", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "6", "q": "A viral genome is translated immediately after uncoating. What is most consistent?", "opts": [], "a": "A positive-sense RNA genome.", "type": "Short answer", "notes": ""}, {"id": "q118", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "7", "q": "What is variolation?", "opts": [], "a": "Deliberate inoculation with smallpox material to induce protection.", "type": "Short answer", "notes": ""}, {"id": "q119", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "8", "q": "What is an ABC transporter?", "opts": [], "a": "An ATP-binding-cassette protein that uses ATP to transport solutes across membranes.", "type": "Short answer", "notes": ""}, {"id": "q120", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "9", "q": "What is an endosome?", "opts": [], "a": "A membrane-bound sorting compartment entered during endocytosis.", "type": "Short answer", "notes": ""}, {"id": "q121", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "10", "q": "What are Woese’s domains?", "opts": [], "a": "Bacteria, Archaea and Eukaryotes.", "type": "Short answer", "notes": ""}, {"id": "q122", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "11", "q": "What is MOI?", "opts": [], "a": "Infectious particles added per target cell.", "type": "Short answer", "notes": ""}, {"id": "q123", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "12", "q": "What is the first compartment after receptor-mediated uptake?", "opts": [], "a": "The endosomal compartment.", "type": "Short answer", "notes": ""}, {"id": "q124", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "13", "q": "What is the broad target of beta-lactams?", "opts": [], "a": "Peptidoglycan cell-wall synthesis.", "type": "Short answer", "notes": ""}, {"id": "q125", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "14", "q": "What does positive-sense RNA mean?", "opts": [], "a": "RNA with mRNA polarity that can be translated directly.", "type": "Short answer", "notes": ""}, {"id": "q126", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "15", "q": "What does negative feedback do?", "opts": [], "a": "Limits or terminates pathway activation.", "type": "Short answer", "notes": ""}, {"id": "q127", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "16", "q": "Where are phospholipid tails in a bilayer?", "opts": [], "a": "In the hydrophobic core, away from water.", "type": "Short answer", "notes": ""}, {"id": "q128", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "17", "q": "1. A plate has 42 colonies from 0.2 ml of a 10^-5 dilution. Calculate CFU/ml.", "opts": [], "a": "2.1 × 10^7 CFU/ml.", "type": "Short answer", "notes": ""}, {"id": "q129", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "18", "q": "2. A stock contains 4 × 10^9 PFU/ml. How much is needed to add 8 × 10^7 PFU?", "opts": [], "a": "0.02 ml, or 20 µl.", "type": "Short answer", "notes": ""}, {"id": "q130", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "19", "q": "3. A cell gains more aquaporins while the osmotic gradient stays constant. What changes?", "opts": [], "a": "Water permeability and water flux increase.", "type": "Short answer", "notes": ""}, {"id": "q131", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "20", "q": "4. Resistance DNA is acquired from lysed neighbours. Which mechanism?", "opts": [], "a": "Transformation.", "type": "Short answer", "notes": ""}, {"id": "q132", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "21", "q": "5. An ATP-hydrolysis inhibitor acts on an ABC transporter. Immediate effect?", "opts": [], "a": "Active transport by that transporter falls or stops.", "type": "Short answer", "notes": ""}, {"id": "q133", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "22", "q": "6. A signalling response rises normally but remains high. Suggest a defect.", "opts": [], "a": "Loss of negative feedback or impaired pathway deactivation.", "type": "Short answer", "notes": ""}, {"id": "q134", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "23", "q": "7. A surface receptor is internalised and then returned to the membrane. Give the likely route.", "opts": [], "a": "Early endosome → recycling endosome → plasma membrane.", "type": "Short answer", "notes": ""}, {"id": "q135", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "24", "q": "8. Why can cholera cause severe diarrhoea without killing epithelial cells?", "opts": [], "a": "The toxin alters ion transport, causing water secretion.", "type": "Short answer", "notes": ""}, {"id": "q136", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "25", "q": "9. A phylogenetic tree is rotated at an internal node. What remains unchanged?", "opts": [], "a": "Clades and common-ancestor relationships.", "type": "Short answer", "notes": ""}, {"id": "q137", "source": "BS1040 Study Material", "module": "BS1040", "topic": "Study material", "number": "26", "q": "10. True or false: a true option is automatically the answer to a “best explains” question.", "opts": [], "a": "False. It must answer the exact scope better than the alternatives.", "type": "Short answer", "notes": ""}, {"id": "q138", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "1", "q": "What structural feature distinguishes an enveloped virion?", "opts": [], "a": "Lipid envelope or bilayer.", "type": "Short answer", "notes": ""}, {"id": "q139", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "2", "q": "Define bacterial transformation.", "opts": [], "a": "Uptake of free environmental DNA.", "type": "Short answer", "notes": ""}, {"id": "q140", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "3", "q": "Name Woese’s three domains.", "opts": [], "a": "Bacteria, Archaea and Eukaryotes.", "type": "Short answer", "notes": ""}, {"id": "q141", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "4", "q": "What cellular structure is targeted by β-lactam antibiotics?", "opts": [], "a": "Peptidoglycan cell-wall synthesis.", "type": "Short answer", "notes": ""}, {"id": "q142", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "5", "q": "Define an ABC transporter.", "opts": [], "a": "An ATP-binding-cassette transporter using ATP for active transport.", "type": "Short answer", "notes": ""}, {"id": "q143", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "6", "q": "What is an endosome?", "opts": [], "a": "A membrane-bound sorting compartment entered during endocytosis.", "type": "Short answer", "notes": ""}, {"id": "q144", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "7", "q": "What is variolation?", "opts": [], "a": "Deliberate inoculation with smallpox material to induce protection.", "type": "Short answer", "notes": ""}, {"id": "q145", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "8", "q": "What is a secondary metabolite?", "opts": Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "15", "q": "Why are phospholipid tails located inside a bilayer?", "opts": [], "a": "Hydrophobic regions minimise contact with water.", "type": "Short answer", "notes": ""}, {"id": "q153", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "16", "q": "Why is “prokaryote” not a domain?", "opts": [], "a": "It groups Bacteria and Archaea by cell organisation rather than ancestry.", "type": "Short answer", "notes": ""}, {"id": "q154", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "17", "q": "Why can OD and CFU give different impressions of culture size?", "opts": [], "a": "OD includes nonviable material; CFU measures colony-forming units.", "type": "Short answer", "notes": ""}, {"id": "q155", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "18", "q": "Why does a positive-sense RNA genome permit rapid initiation of translation?", "opts": [], "a": "Host ribosomes can recognise it as mRNA.", "type": "Short answer", "notes": ""}, {"id": "q156", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "19", "q": "Why does the first endocytic compartment differ from the eventual destination?", "opts": [], "a": "Endosomes sort cargo before recycling or degradation.", "type": "Short answer", "notes": ""}, {"id": "q157", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "20", "q": "Why must every process in a composite MCQ option be correct? ## Application questions", "opts": [], "a": "One false component invalidates a composite answer.", "type": "Short answer", "notes": ""}, {"id": "q158", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "21", "q": "A membrane gains additional aquaporins while the osmotic gradient remains constant. Predict water flux.", "opts": [], "a": "Increased flux.", "type": "Short answer", "notes": ""}, {"id": "q159", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "22", "q": "A bacterium acquires resistance DNA from lysed neighbouring cells. Identify the transfer mechanism.", "opts": [], "a": "Transformation.", "type": "Short answer", "notes": ""}, {"id": "q160", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "23", "q": "An inhibitor blocks ATP hydrolysis by an ABC transporter. Predict the immediate transport effect.", "opts": [], "a": "Reduced or abolished active transport.", "type": "Short answer", "notes": ""}, {"id": "q161", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "24", "q": "A toxin activates an ion channel without killing the cell. Explain how disease may result.", "opts": [], "a": "Functional dysregulation can disturb homeostasis.", "type": "Short answer", "notes": ""}, {"id": "q162", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "25", "q": "A cell in hypotonic medium cannot release potassium. Predict its volume response.", "opts": [], "a": "Persistent swelling and increased lysis risk.", "type": "Short answer", "notes": ""}, {"id": "q163", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "26", "q": "A viral RNA genome is translated immediately after entering the cytoplasm. What genome class is most consistent?", "opts": [], "a": "Positive-sense RNA virus.", "type": "Short answer", "notes": ""}, {"id": "q164", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "27", "q": "A protein binds a surface receptor and the receptor rapidly returns to the membrane. Suggest the intracellular sorting route.", "opts": [], "a": "Early endosome to recycling endosome to plasma membrane.", "type": "Short answer", "notes": ""}, {"id": "q165", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "28", "q": "A culture has high optical density but low CFU. Give two biological explanations.", "opts": [], "a": "Dead cells, debris, or viable-but-nonculturable cells.", "type": "Short answer", "notes": ""}, {"id": "q166", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "29", "q": "A mutation disables a signalling-pathway feedback inhibitor. Predict signal duration.", "opts": [], "a": "Prolonged signal.", "type": "Short answer", "notes": ""}, {"id": "q167", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "30", "q": "A bacterium is susceptible to penicillin only while growing rapidly. Explain why. ## Data-interpretation questions", "opts": [], "a": "Active wall synthesis creates vulnerability to cross-linking inhibition.", "type": "Short answer", "notes": ""}, {"id": "q168", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "31", "q": "Plate counts are 4, 37 and 412 colonies at successive tenfold dilutions. Which plate is most useful and why?", "opts": [], "a": "Usually 37, because 4 is imprecise and 412 may be overcrowded.", "type": "Short answer", "notes": ""}, {"id": "q169", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "32", "q": "A culture’s OD increases while CFU remains constant. Suggest an interpretation.", "opts": [], "a": "Increased biomass or nonviable particles without increased colony-forming cells.", "type": "Short answer", "notes": ""}, {"id": "q170", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "33", "q": "A growth curve is horizontal after exponential growth. Name the phase and explain two possible causes.", "opts": [], "a": "Stationary phase; nutrient limitation and waste accumulation are possibilities.", "type": "Short answer", "notes": ""}, {"id": "q171", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "34", "q": "A cell initially swells and then recovers in hypotonic medium. What transport pattern would you expect?", "opts": [], "a": "Initial water influx followed by solute efflux and water loss.", "type": "Short answer", "notes": ""}, {"id": "q172", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "35", "q": "Two species share a node more recently than either shares a node with a third species. What relationship follows?", "opts": [], "a": "The first two are more closely related to each other.", "type": "Short answer", "notes": ""}, {"id": "q173", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "36", "q": "A Gram stain contains purple cocci and large pink host cells. Which observations support classification?", "opts": [], "a": "Colour, shape, arrangement and relative size, with causal limitations.", "type": "Short answer", "notes": ""}, {"id": "q174", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "37", "q": "A pathway response rises normally but fails to return to baseline. What regulatory defect is suggested?", "opts": [], "a": "Loss of negative feedback or deactivation.", "type": "Short answer", "notes": ""}, {"id": "q175", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "38", "q": "A phage stock has many particles by electron microscopy but a low PFU count. Explain.", "opts": [], "a": "Many particles are noninfectious under assay conditions.", "type": "Short answer", "notes": ""}, {"id": "q176", "source": "Academic Paper Analysis", "module": "BS1040", "topic": "Active-recall bank", "number": "39", "q": "An experimental drug decreases dry bi const K='study-companion-v2';let S=(()=>{try{return JSON.parse(localStorage.getItem(K))||null}catch(e){return null}})()||{questions:STARTER,stats:{},sessions:[],settings:{goal:20},streak:{last:'',count:0}};let session=[],pos=0,score=0;const $=x=>document.getElementById(x),save=()=>localStorage.setItem(K,JSON.stringify(S)),esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),st=id=>S.stats[id]||(S.stats[id]={seen:0,ok:0,bad:0,conf:0,next:0}),today=()=>new Date().toISOString().slice(0,10),due=q=>!st(q.id).next||st(q.id).next<=Date.now(),master=q=>{let x=st(q.id);return x.seen?Math.min(100,Math.round(x.ok/x.seen*70+x.conf*10)):0};function topics(){let m={};S.questions.forEach(q=>(m[q.module+' · '+q.topic]??=[]).push(q));return Object.entries(m).map(([name,a])=>({name,a,n:a.length,seen:a.filter(q=>st(q.id).seen).length,due:a.filter(due).length,score:Math.round(a.reduce((z,q)=>z+master(q),0)/a.length)})).sort((a,b)=>a.score-b.score)}function show(id){document.querySelectorAll('main').forEach(x=>x.hidden=x.id!==id);document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===id));if(id==='home')home();if(id==='topics')renderTopics();if(id==='library')library();if(id==='settings')settings()}document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>show(b.dataset.p));function tc(t){return `<article class="topic"><b>${esc(t.name)}</b><span class="muted">${t.seen}/${t.n} attempted · ${t.due} due</span><div class="bar"><i style="width:${t.score}%"></i></div><footer><span>${t.score}% mastery</span><button onclick='startTopic(${JSON.stringify(t.name)})'>Practise</button></footer></article>`}function home(){let done=S.sessions.filter(x=>x.date===today()).reduce((a,x)=>a+x.total,0),seen=S.questions.filter(q=>st(q.id).seen).length;$('home').innerHTML=`<section class="hero"><div><span class="muted">BIOLOGICAL SCIENCES REVISION</span><h1>Study in short, focused bursts.</h1><p>Smart practice identifies weak topics and schedules reviews after 1, 3, 7, 14 and 30 days.</p><div class="actions"><button class="primary" onclick="start('smart',10)">Start smart session</button><button class="secondary" onclick="start('due',15)">Review due questions</button></div></div><div class="goal" style="--p:${Math.min(100,done/S.settings.goal*100)}">${done}/${S.settings.goal}</div></section><div class="stats"><article><b>${S.questions.length}</b><span>Total questions</span></article><article><b>${seen}</b><span>Attempted</span></article><article><b>${S.questions.filter(due).length}</b><span>Due for review</span></article><article><b>${S.streak.count}</b><span>Day streak</span></article></div><section class="panel"><div class="head"><div><h2>Topics needing attention</h2><span class="muted">Lowest mastery first</span></div></div><div class="grid">${topics().slice(0,6).map(tc).join('')}</div></section><section class="panel"><h2>Study modes</h2><div class="modes"><button onclick="start('mix',5)"><b>5-question break</b><small>Ideal for a bus journey</small></button><button onclick="start('smart',10)"><b>Weak-topic drill</b><small>Focus on low mastery</small></button><button onclick="start('new',15)"><b>Learn new material</b><small>Unseen questions</small></button><button onclick="start('calc',10)"><b>Calculation trainer</b><small>CFU, PFU, MOI and maths</small></button><button onclick="start('mock25',25)"><b>25-question mock</b><small>Mixed exam practice</small></button><button onclick="start('mock50',50)"><b>50-question mock</b><small>Longer timed-style practice</small></button></div></section>`}function pool(mode,n,topic){let a=[...S.questions];if(topic)a=a.filter(q=>q.module+' · '+q.topic===topic);if(mode==='due')a=a.filter(due);if(mode==='new')a=a.filter(q=>!st(q.id).seen);if(mode==='smart'){let w=new Set(topics().slice(0,Math.max(2,Math.ceil(topics().length/3))).map(x=>x.name));a=a.filter(q=>w.has(q.module+' · '+q.topic))}if(mode==='calc')a=a.filter(q=>/calculate|cfu|pfu|moi|dilution|volume|ratio|pka|atp/i.test(q.q+' '+q.topic));a.sort(()=>Math.random()-.5);if(a.length<n)a.push(...S.questions.filter(q=>!a.includes(q)).sort(()=>Math.random()-.5));return a.slice(0,n)}function start(m,n){session=pool(m,n);pos=0;score=0;show('study');question()}function startTopic(t){session=pool('mix',15,t);pos=0;score=0;show('study');question()}function answer(q){if(q.opts.length&&/^[A-D]$/i.test(q.a)){let i='ABCD'.indexOf(q.a.toUpperCase());return q.a.toUpperCase()+'. '+(q.opts[i]||'')}return q.a||'No answer supplied.'}function question(){let q=session[pos];$('study').innerHTML=`<div class="studytop"><button onclick="show('home')">← Exit</button><div class="prog"><i style="width:${pos/session.length*100}%"></i></div><span>${pos+1}/${session.length}</span></div><section class="card"><div class="chips"><span>${esc(q.module)}</span><span>${esc(q.topic)}</span><span>${esc(q.type)}</span></div><h1>${esc(q.q)}</h1>${q.opts.length?`<div class="options">${q.opts.map((o,i)=>`<button onclick="grade('${'ABCD'[i]}',this)"><b>${'ABCD'[i]}</b>${esc(o)}</button>`).join('')}</div>`:`<textarea placeholder="Type or think through your answer..."></textarea><button class="primary" onclick="reveal()">Reveal answer</button>`}<div id="fb"></div></section>`}function streak(){let t=today();if(S.streak.last===t)return;let d=new Date();d.setDate(d.getDate()-1);S.streak.count=S.streak.last===d.toISOString().slice(0,10)?S.streak.count+1:1;S.streak.last=t}function grade(a){let q=session[pos],ok=a===q.a.toUpperCase(),x=st(q.id);x.seen++;ok?(x.ok++,score++):x.bad++;x.conf=ok?Math.min(4,x.conf+1):0;x.next=Date.now()+([1,3,7,14,30][x.conf]||1)*864e5;streak();save();document.querySelectorAll('.options button').forEach((b,i)=>{if('ABCD'[i]===q.a.toUpperCase())b.classList.add('correct');else if('ABCD'[i]===a)b.classList.add('wrong')});$('fb').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Correct':'Not quite'}</b><p>Answer: ${esc(answer(q))}</p>${q.notes?`<small>${esc(q.note <label class="secondary">Import backup<input hidden type="file" accept=".json" onchange="restore(this.files[0])"></label></div></section><section class="panel"><div class="head"><h2>${S.questions.length} questions</h2><input class="search" id="search" placeholder="Search questions" oninput="list()"></div><div id="list" class="library"></div></section>`;list()}function list(){let v=($('search')?.value||'').toLowerCase();$('list').innerHTML=S.questions.filter(q=>(q.q+' '+q.topic+' '+q.module).toLowerCase().includes(v)).slice(0,250).map(q=>`<article><div><b>${esc(q.q)}</b><span>${esc(q.module)} · ${esc(q.topic)} · ${esc(q.type)}</span></div><button onclick="del('${q.id}')">×</button></article>`).join('')}function addForm(){$('list').innerHTML=`<div class="form"><label>Module<input id="am" placeholder="BS1030"></label><label>Topic<input id="at"></label><label>Question<textarea id="aq"></textarea></label><label>Type<select id="ay"><option>Short answer</option><option>Multiple choice</option></select></label><label>Options A-D, separated by |<input id="ao"></label><label>Correct answer<input id="aa"></label><button class="primary" onclick="addQ()">Save question</button></div>`}function addQ(){let type=$('ay').value;S.questions.push({id:'u'+Date.now(),source:'Added by user',module:$('am').value||'Other',topic:$('at').value||'General',number:'',q:$('aq').value,opts:type==='Multiple choice'?$('ao').value.split('|').map(x=>x.trim()):[],a:$('aa').value,type,notes:''});save();library()}function del(id){if(confirm('Delete this question?')){S.questions=S.questions.filter(q=>q.id!==id);delete S.stats[id];save();library()}}function readCSV(t){let lines=t.replace(/\r/g,'').split('\n'),R=[];for(let line of lines){if(!line.trim())continue;let r=[],v='',q=false;for(let i=0;i<line.length;i++){let c=line[i],n=line[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){r.push(v);v=''}else v+=c}r.push(v);R.push(r)}return R}function importCSV(f){if(!f)return;let r=new FileReader;r.onload=()=>{let a=readCSV(r.result),h=a.shift().map(x=>x.trim()),n=0;a.forEach(z=>{let o={};h.forEach((k,i)=>o[k]=z[i]||'');if(!o.Question)return;S.questions.push({id:'i'+Date.now()+n++,source:o.Source||'Imported',module:o.Module||'Other',topic:o.Topic||'General',number:o['Question ID']||'',q:o.Question,opts:['Option A','Option B','Option C','Option D'].map(k=>o[k]).filter(Boolean),a:o['Correct Answer']||'',type:o['Question Type']||'Short answer',notes:o.Notes||''})});save();alert(n+' questions imported');library()};r.readAsText(f)}function dl(n,t,type='application/json'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;a.click()}function backup(){dl('study-companion-backup.json',JSON.stringify(S))}function restore(f){let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.questions)throw 0;S=x;save();library()}catch(e){alert('Invalid backup')}};r.readAsText(f)}function settings(){$('settings').innerHTML=`<div class="title"><div><h1>Settings</h1><p class="muted">Keep revision simple and focused.</p></div></div><section class="panel form"><label>Daily question goal<input type="number" value="${S.settings.goal}" onchange="S.settings.goal=+this.value;save()"></label><button class="secondary" onclick="resetProgress()">Reset progress</button><button class="secondary" onclick="resetAll()">Reset entire app</button></section>`}function resetProgress(){if(confirm('Clear scores and history?')){S.stats={};S.sessions=[];S.streak={last:'',count:0};save();settings()}}function resetAll(){if(confirm('Restore the starter bank and remove all progress?')){localStorage.removeItem(K);location.reload()}}show('home');</script></body></html>
