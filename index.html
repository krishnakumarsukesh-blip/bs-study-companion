ard","lecture":"Academic Paper Analysis"},{"id":"q188","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss similarities and differences in structures and replication between viruses","number":"51","q":"A positive-sense RNA virus loses the ability to synthesise negative-strand intermediates. Which processes remain possible and which fail?","opts":[],"a":"Initial translation may occur, but genome amplification and progeny genomes fail.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"Academic Paper Analysis"},{"id":"q189","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"52","q":"A bacterial cell maintains volume in hypotonic medium despite blocked potassium channels. Propose an alternative compensatory mechanism.","opts":[],"a":"Efflux of other ions or organic osmolytes.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"Academic Paper Analysis"},{"id":"q190","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","number":"53","q":"A membrane transporter uses ATP but transports different substrates in opposite directions in different tissues. Why does this not contradict its classification as an ABC transporter?","opts":[],"a":"ATP coupling defines the family more generally than direction.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"Academic Paper Analysis"},{"id":"q191","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells and cellular organelles","number":"54","q":"A protein is glycosylated normally but never reaches the cell surface. Identify three distinct stages that could be defective.","opts":[],"a":"ER exit, Golgi sorting, vesicle transport, docking or fusion.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"Academic Paper Analysis"},{"id":"q192","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss and explain some of the diversity of life on earth","number":"55","q":"A tree is redrawn with branches rotated around every node. Which relationships must remain unchanged?","opts":[],"a":"Clades and common-ancestor relationships.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"Academic Paper Analysis"},{"id":"q194","source":"Academic Paper Analysis","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","number":"57","q":"A 10⁻⁶ dilution containing 20 colonies means the original sample contained 20 × 10⁶ CFU/ml. True or false?","opts":[],"a":"False unless the plated volume is exactly 1 ml.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":true,"mode":"Flashcard","lecture":"Academic Paper Analysis"},{"id":"q195","source":"Academic Paper Analysis","module":"BS1040","topic":"Demonstrate competency in numeracy and basic statistical skills","number":"58","q":"All purple structures in a Gram-stained clinical sample are necessarily Gram-positive bacteria. True or false?","opts":[],"a":"False. Artefacts and nonbacterial structures must be considered.","type":"Short answer","notes":"Common mistake: distinguish the definition from a related process with a similar name.","calc":false,"mode":"Flashcard","lecture":"Academic Paper Analysis"},{"id":"q196","source":"Academic Paper Analysis","module":"BS1040","topic":"Describe how micro-organisms cause disease","number":"59","q":"If a toxin does not kill cells, it cannot cause severe disease. True or false?","opts":[],"a":"False. Toxins can cause severe disease by disrupting cell signalling, ion transport or metabolism without killing the affected cells.","type":"Short answer","notes":"Disease severity can result from loss of normal function, not only cell death; cholera toxin is a clear example.","calc":false,"mode":"Flashcard","lecture":"Academic Paper Analysis"},{"id":"q197","source":"Academic Paper Analysis","module":"BS1040","topic":"Discuss and explain some of the diversity of life on earth","number":"60","q":"The two species drawn nearest to one another on a phylogenetic tree must be the closest relatives. True or false?","opts":[],"a":"False. Relatedness is determined by the most recent common ancestor and branching pattern, not by how close the names are drawn.","type":"Short answer","notes":"Branches can be rotated around a node without changing evolutionary relationships.","calc":false,"mode":"Flashcard","lecture":"Academic Paper Analysis"},{"id":"q198","module":"BS1040","topic":"Discuss and explain some of the diversity of life on earth","type":"Multiple choice","mode":"MCQ","q":"Which observation, by itself, would best distinguish Gram-positive from Gram-negative bacteria after Gram staining?","opts":["The bacteria are purple rather than pink after Gram staining","The bacteria are larger than a eukaryotic cell","The bacteria are rod-shaped rather than spherical","The bacteria are motile rather than non-motile"],"a":"A","notes":"Gram-positive cells retain crystal violet and appear purple. Size, shape and motility do not determine Gram reaction.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"1","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q199","module":"BS1040","topic":"Describe how micro-organisms cause disease, are used in biotechnology and influence geochemical cycles","type":"Multiple choice","mode":"MCQ","q":"A microorganism obtains energy by oxidising organic chemicals in its surroundings. Which description matches this metabolism?","opts":["Chemoorganotroph","Chemolithotroph","Photoautotroph","Photolithotroph"],"a":"A","notes":"Chemoorganotrophs obtain energy by oxidising organic compounds; the other terms refer to inorganic electron donors or light energy.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"2","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q200","module":"BS1040","topic":"Describe how micro-organisms are used in biotechnology","type":"Multiple choice","mode":"MCQ","q":"Which sequence correctly describes construction of a simple plasmid genomic library?","opts":["Fragment chromosomal DNA, digest the vector, ligate inserts and vector, transform bacteria, then select for a plasmid marker","Digest the vector, transform bacteria, fragment chromosomal DNA, ligate, then select","Select bacteria, ligate intact chromosomes to the vector, digest, transform, then fragment DNA","Fragment chromosomal DNA, select a plasmid marker, transform bacteria, digest the vector, then ligate"],"a":"A","notes":"The insert and vector must be prepared and ligated before transformation and selection.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"3","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q202","module":"BS1040","topic":"Describe how micro-organisms cause disease","type":"Multiple choice","mode":"MCQ","q":"A bacterial pathogen attaches to an epithelial surface before causing infection. Which stage does this represent?","opts":["Dissemination after bloodstream entry","Toxin release after host-cell lysis","Adhesion, an early step in infection","Clearance by adaptive immune memory"],"a":"C","notes":"Attachment to a host surface is adhesion, an early step in colonisation and infection.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"5","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q204","module":"BS1040","topic":"Describe how micro-organisms cause disease","type":"Multiple choice","mode":"MCQ","q":"Which bacterial process is targeted by ciprofloxacin?","opts":["Peptidoglycan cross-linking","Ribosomal peptide-bond formation","Lipid-bilayer synthesis","DNA-gyrase-dependent DNA topology"],"a":"D","notes":"Ciprofloxacin inhibits bacterial DNA gyrase/topoisomerase activity.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"7","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q205","module":"BS1030","topic":"Demonstrate an ability to analyse experimental data","type":"Multiple choice","mode":"MCQ","q":"Which statement correctly defines the Michaelis constant, Km?","opts":["The substrate concentration at which the rate is half of Vmax","The maximum rate at saturating substrate","The number of substrate molecules converted per enzyme per unit time","The substrate concentration at which the enzyme is fully inactive"],"a":"A","notes":"Km is the substrate concentration at which the reaction rate is half Vmax.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"9","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q206","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells","type":"Multiple choice","mode":"MCQ","q":"Which statement best describes the outcome of meiosis I?","opts":["It is a reductional division that leads towards haploid cells","Homologous chromosomes first pair in anaphase I","Recombination occurs between sister chromatids in prophase I","Two DNA replications occur without cell division"],"a":"A","notes":"Meiosis I separates homologous chromosomes and reduces chromosome number.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"10","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q207","module":"BS1040","topic":"Discuss membrane transport and cellular homeostasis","type":"Multiple choice","mode":"MCQ","q":"A eukaryotic cell is placed in a hypotonic environment. What is the immediate water movement?","opts":["Water enters the cytosol, prompting regulatory-volume-decrease mechanisms","Water enters the nucleus but cannot cross the plasma membrane","Water movement is unaffected by the osmotic gradient","Water leaves the cytosol because the external solution is dilute"],"a":"A","notes":"Water enters the cell down the osmotic gradient, causing swelling.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"11","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q210","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","type":"Multiple choice","mode":"MCQ","q":"A culture begins with one bacterial cell and undergoes six complete generations with no deaths. How many cells are present?","opts":["6","32","64","12"],"a":"C","notes":"N = N0 × 2^n = 1 × 2^6 = 64.","calc":true,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"14","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q211","module":"BS1040","topic":"Describe how micro-organisms are used in biotechnology","type":"Multiple choice","mode":"MCQ","q":"Which event is bacterial transformation?","opts":["DNA transfer between bacteria by a pilus","DNA delivery into bacteria by a bacteriophage","DNA replication within a plasmid-bearing cell","Uptake of free DNA from the environment by a bacterial cell"],"a":"D","notes":"Transformation is uptake of free environmental DNA; pilus transfer is conjugation and phage transfer is transduction.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"15","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q212","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","type":"Multiple choice","mode":"MCQ","q":"A phage stock contains 6 × 10^8 PFU ml⁻¹. A culture contains 3 × 10^6 CFU ml⁻¹, and 1 ml is infected at an MOI of 20. What phage volume is required?","opts":["0.01 ml","0.10 ml","1.0 ml","10 ml"],"a":"B","notes":"Required PFU = 20 × 3 × 10^6 = 6 × 10^7; volume = 6 × 10^7 ÷ 6 × 10^8 = 0.10 ml.","calc":true,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"16","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q213","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","type":"Multiple choice","mode":"MCQ","q":"Fifty colonies are counted after plating 0.4 ml of a 10⁻⁶ dilution. What is the estimated original concentration?","opts":["1.25 × 10⁷ CFU ml⁻¹","1.25 × 10⁸ CFU ml⁻¹","2.0 × 10⁸ CFU ml⁻¹","5.0 × 10⁸ CFU ml⁻¹"],"a":"B","notes":"50 ÷ (0.4 × 10⁻⁶) = 1.25 × 10⁸ CFU ml⁻¹. A omits a factor of ten; C and D use incorrect volume or dilution factors.","calc":true,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"17","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q214","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","type":"Multiple choice","mode":"MCQ","q":"Why is a fresh pipette tip used for each transfer during serial dilution?","opts":["To increase bacterial viability","To give every dilution the same cell number","To make agar support every organism","To avoid carrying excess cells into the next dilution"],"a":"D","notes":"Fresh tips prevent carry-over that would change the intended dilution factor.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"18","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q217","module":"BS1030","topic":"Demonstrate the acquisition of selected technical skills relevant to biochemistry","type":"Multiple choice","mode":"MCQ","q":"During an ONPG assay, what does increasing absorbance at 410 nm monitor?","opts":["Production of ONP as ONPG is hydrolysed by β-galactosidase","Binding of ONP to a membrane transporter","Consumption of oxygen by DNA gyrase","Formation of bacterial colonies from ONP"],"a":"A","notes":"β-galactosidase produces yellow ONP, which absorbs near 410 nm.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"21","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q218","module":"BS1030","topic":"Discuss the relationship between protein structure and function","type":"Multiple choice","mode":"MCQ","q":"Which interaction is most likely between hydrophobic transmembrane amino-acid residues and lipid fatty-acyl chains?","opts":["Hydrophobic interactions","Hydrogen bonds with charged lipid heads only","Ionic bonds","Covalent peptide bonds to every lipid tail"],"a":"A","notes":"Non-polar side chains and fatty-acyl chains associate through hydrophobic interactions.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"22","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q223","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","type":"Multiple choice","mode":"MCQ","q":"Which organism is expected to resist heat treatment better because it can form endospores?","opts":["Pseudomonas putida","Staphylococcus epidermidis","Bacillus subtilis","Escherichia coli"],"a":"C","notes":"Bacillus subtilis forms heat-resistant endospores.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"27","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q224","module":"BS1040","topic":"Demonstrate competency in numeracy and basic statistical skills","type":"Multiple choice","mode":"MCQ","q":"Which test compares the mean height of two independent groups, such as poodles and spaniels?","opts":["An independent-samples t-test","Pearson product-moment correlation","A scatterplot alone","A Q–Q plot alone"],"a":"A","notes":"An independent-samples t-test compares two independent group means when assumptions are met.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"28","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q225","module":"BS1030","topic":"Demonstrate an ability to analyse experimental data","type":"Multiple choice","mode":"MCQ","q":"A β-galactosidase assay is repeated with twice as much enzyme while substrate is saturating. What happens?","opts":["Vmax and Km remain unchanged","Vmax doubles while Km is unchanged","Vmax and Km are halved","Km doubles while Vmax is unchanged"],"a":"B","notes":"Vmax is proportional to enzyme concentration, whereas Km is not changed by enzyme concentration.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"29","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q226","module":"BS1030","topic":"Demonstrate an ability to analyse experimental data","type":"Multiple choice","mode":"MCQ","q":"What kinetic effect is expected from a competitive inhibitor?","opts":["Apparent Km decreases and Vmax increases","Apparent Km increases while Vmax is unchanged","Apparent Km and Vmax both decrease","Apparent Km is unchanged while Vmax decreases"],"a":"B","notes":"Competitive inhibition increases apparent Km but can be overcome at high substrate, leaving Vmax unchanged.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"30","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q227","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","type":"Multiple choice","mode":"MCQ","q":"Glutamate has a side-chain pKa of 4.25. What state predominates at pH 7.0?","opts":["Unable to ionise","Mostly deprotonated","Exactly half protonated","Mostly protonated"],"a":"B","notes":"Because pH is well above pKa, the carboxyl side chain is predominantly deprotonated.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"31","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q230","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","type":"Multiple choice","mode":"MCQ","q":"In an antibiotic-disc assay, what does a clear zone around a disc indicate?","opts":["The disc increased bacterial growth","The bacterium is necessarily resistant","The bacterium is sensitive under the assay conditions","The serum antibiotic concentration is known exactly"],"a":"C","notes":"A zone of inhibition indicates that growth was suppressed under the test conditions.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"34","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q231","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","type":"Multiple choice","mode":"MCQ","q":"Why can DNA fragments cut with the same restriction enzyme often be joined?","opts":["They have identical full-length sequences","They contain the same promoter","They are automatically converted into RNA","They can have compatible ends that can be ligated"],"a":"D","notes":"Matching restriction cuts can create complementary ends that anneal and are sealed by ligase.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"35","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q233","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","type":"Multiple choice","mode":"MCQ","q":"Why can ethanol treatment reduce formaldehyde production after methanol poisoning?","opts":["Ethanol irreversibly destroys alcohol dehydrogenase","Ethanol increases the enzyme affinity for methanol","Ethanol binds alcohol dehydrogenase with higher affinity and is metabolised preferentially","Ethanol converts formaldehyde back into methanol without an enzyme"],"a":"C","notes":"Ethanol has the lower Km and competitively occupies alcohol dehydrogenase, reducing methanol metabolism.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"37","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q234","module":"BS1040","topic":"Demonstrate knowledge of techniques to study and handle cells and micro-organisms","type":"Multiple choice","mode":"MCQ","q":"Why is a Bunsen burner lit near an aseptic transfer area?","opts":["To create an upward current of air near the work area","To sterilise the entire room","To remove all microorganisms by boiling the broth","To provide the culture incubation temperature"],"a":"A","notes":"The flame creates convection that reduces settling of airborne contaminants near the transfer area.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"38","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q235","module":"BS1030","topic":"Discuss the relationship between protein structure and function","type":"Multiple choice","mode":"MCQ","q":"Why might replacing arginine with glutamate substantially affect protein function?","opts":["Side-chain charge and character remain unchanged","The peptide backbone is removed","One hydrophobic residue replaces another","A positively charged side chain is replaced by a negatively charged one"],"a":"D","notes":"The substitution reverses side-chain charge and can disrupt ionic interactions and structure.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"39","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q236","module":"BS1040","topic":"Discuss and explain the basic structure and function of cells","type":"Multiple choice","mode":"MCQ","q":"What is a consequence of a bacterial cell having a high surface-area-to-volume ratio?","opts":["A lower rate of interaction with surroundings","Inability to exchange nutrients across the membrane","More surface is available relative to cell contents for environmental exchange","The cell must contain multiple membrane-bound nuclei"],"a":"C","notes":"A high surface-area-to-volume ratio supports efficient exchange with the environment.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"40","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q237","module":"BS1040","topic":"Demonstrate competency in numeracy and problem solving","type":"Short answer","mode":"Flashcard","q":"A student plates 0.20 ml of a 10⁻⁵ dilution and counts 48 colonies. Calculate the original concentration in CFU ml⁻¹.","opts":[],"a":"2.4 × 10⁷ CFU ml⁻¹. Working: 48 ÷ (0.20 × 10⁻⁵) = 48 ÷ (2 × 10⁻⁶) = 2.4 × 10⁷.","notes":"Include both plated volume and dilution in the denominator; omitting either gives a tenfold or fivefold error.","calc":true,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"41","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q241","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","type":"Short answer","mode":"Flashcard","q":"Describe the roles of helicase, single-strand DNA-binding protein and DNA gyrase at a bacterial replication fork.","opts":[],"a":"Helicase separates the parental strands; single-strand DNA-binding proteins stabilise exposed DNA and prevent reannealing; DNA gyrase relieves torsional strain and positive supercoiling ahead of the fork.","notes":"Common mistake: gyrase acts ahead of the fork, whereas single-strand DNA-binding proteins act on the separated templates.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"45","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q242","module":"BS1030","topic":"Explain the basic chemical principles that underpin biochemistry","type":"Short answer","mode":"Flashcard","q":"A solution has pH 7.1 rather than pH 7.4. How does the hydrogen-ion concentration change? Show the working.","opts":[],"a":"The hydrogen-ion concentration increases by about two-fold. Working: [H⁺] ratio = 10⁻7.1 ÷ 10⁻7.4 = 10^0.3 ≈ 2.0.","notes":"A 0.3-unit pH fall means a 10⁰·³ ≈ 2-fold rise in [H⁺]; pH is logarithmic, not linear.","calc":true,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"47","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q244","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","type":"Short answer","mode":"Flashcard","q":"How is replication of the circular E. coli chromosome initiated?","opts":[],"a":"Replication begins at oriC and proceeds bidirectionally, creating two replication forks. Helicase opens the duplex, single-strand DNA-binding proteins stabilise exposed DNA, and gyrase relieves torsional strain.","notes":"Common mistake: oriC is a DNA origin sequence, not an enzyme; two forks move away from it in opposite directions.","calc":false,"source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"50","lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q245","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"50b","type":"Short answer","mode":"Flashcard","q":"How are the leading and lagging strands elongated during E. coli DNA replication?","opts":[],"a":"DNA polymerases extend primers 5′→3′. The leading strand is synthesised continuously towards the fork, while the antiparallel lagging strand is synthesised discontinuously as Okazaki fragments.","notes":"Common mistake: both new strands grow 5′→3′; their different patterns result from antiparallel templates.","calc":false,"lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"q246","module":"BS1030","topic":"Explain the basic mechanisms of DNA replication, transcription and translation","source":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination","number":"50c","type":"Short answer","mode":"Flashcard","q":"How are Okazaki fragments processed and replication completed in E. coli?","opts":[],"a":"DNA polymerase I removes RNA primers and fills the gaps. DNA ligase seals remaining phosphodiester-backbone nicks, producing two semiconservative circular daughter DNA molecules.","notes":"Ligase seals nicks after gap filling; it does not remove RNA primers or synthesise the replacement DNA.","calc":false,"lecture":"Introduction to Cell Biology & Microbiology: Comprehensive Mock Examination"},{"id":"L1","module":"BS1030","lecture":"BS1030 Lecture 1: Thermodynamics","source":"BS1030 Lecture 1: Thermodynamics","topic":"Thermodynamics","q":"Calculate ΔG at 310 K when ΔH = −86.0 kJ mol⁻¹ and ΔS = +0.468 kJ K⁻¹ mol⁻¹.","a":"ΔG = ΔH − TΔS = −86.0 − (310 × 0.468) = −231.1 kJ mol⁻¹ (1 d.p.). The reaction is exergonic and thermodynamically spontaneous.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":true,"number":"1"},{"id":"L2","module":"BS1030","lecture":"BS1030 Lecture 1: Thermodynamics","source":"BS1030 Lecture 1: Thermodynamics","topic":"Thermodynamics","q":"Explain why a negative ΔG does not mean a reaction will proceed rapidly.","a":"ΔG describes thermodynamic favourability, not reaction rate. A reaction may still have a large activation-energy barrier and proceed negligibly without an enzyme.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"2"},{"id":"L3","module":"BS1030","lecture":"BS1030 Lecture 1: Thermodynamics","source":"BS1030 Lecture 1: Thermodynamics","topic":"Thermodynamics","q":"Which combination always gives a negative ΔG?","a":"B","notes":"Both terms favour ΔG < 0.","opts":["Positive ΔH and negative ΔS","Negative ΔH and positive ΔS","Positive ΔH and positive ΔS","Negative ΔH and negative ΔS"],"mode":"MCQ","type":"Multiple choice","calc":false,"number":"3"},{"id":"L4","module":"BS1030","lecture":"BS1030 Lecture 1: Thermodynamics","source":"BS1030 Lecture 1: Thermodynamics","topic":"Thermodynamics","q":"Compare exothermic with exergonic reactions.","a":"Exothermic means ΔH is negative and heat is released. Exergonic means ΔG is negative and the reaction is thermodynamically spontaneous. They are related but not interchangeable.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"4"},{"id":"L5","module":"BS1030","lecture":"BS1030 Lecture 1: Thermodynamics","source":"BS1030 Lecture 1: Thermodynamics","topic":"Thermodynamics","q":"Explain the relationship between standard free-energy change and equilibrium position.","a":"A negative ΔG°′ corresponds to an equilibrium favouring products and a larger equilibrium constant; a positive ΔG°′ favours reactants and a smaller equilibrium constant.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"5"},{"id":"L6","module":"BS1030","lecture":"BS1030 Lecture 2: Amino acids","source":"BS1030 Lecture 2: Amino acids","topic":"Amino acids","q":"Why do non-polar amino-acid side chains tend to become buried inside a soluble protein?","a":"Exposing non-polar groups orders surrounding water and lowers entropy. Burying them reduces contact with water and is thermodynamically favourable.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"6"},{"id":"L7","module":"BS1030","lecture":"BS1030 Lecture 2: Amino acids","source":"BS1030 Lecture 2: Amino acids","topic":"Amino acids","q":"Name the eight amino acids you are expected to draw at pH 7.","a":"Glycine, alanine, serine, tyrosine, glutamate, glutamine, lysine and cysteine.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"7"},{"id":"L8","module":"BS1030","lecture":"BS1030 Lecture 2: Amino acids","source":"BS1030 Lecture 2: Amino acids","topic":"Amino acids","q":"Which amino acid lacks a chiral α-carbon?","a":"B","notes":"Glycine has two hydrogens attached to its α-carbon.","opts":["Alanine","Glycine","Serine","Cysteine"],"mode":"MCQ","type":"Multiple choice","calc":false,"number":"8"},{"id":"L9","module":"BS1030","lecture":"BS1030 Lecture 2: Amino acids","source":"BS1030 Lecture 2: Amino acids","topic":"Amino acids","q":"Explain why histidine can readily gain or lose a proton near physiological pH.","a":"Its side-chain pKa is close to physiological pH, so both protonated and unprotonated forms are appreciably populated.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"9"},{"id":"L10","module":"BS1030","lecture":"BS1030 Lecture 2: Amino acids","source":"BS1030 Lecture 2: Amino acids","topic":"Amino acids","q":"Predict where hydrophobic residues would be found in a membrane-spanning region.","a":"They are commonly exposed on the outside of the transmembrane segment where they interact with hydrophobic lipid fatty-acyl chains.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"10"},{"id":"L11","module":"BS1030","lecture":"BS1030 Lecture 3: Protein structure","source":"BS1030 Lecture 3: Protein structure","topic":"Protein structure","q":"Explain why rotation is restricted around the peptide bond.","a":"Resonance gives the peptide C–N bond partial double-bond character, making the peptide unit planar and rigid. Folding therefore depends mainly on rotation about the φ and ψ bonds.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"11"},{"id":"L12","module":"BS1030","lecture":"BS1030 Lecture 3: Protein structure","source":"BS1030 Lecture 3: Protein structure","topic":"Protein structure","q":"Compare an α-helix with a β-sheet.","a":"An α-helix is a right-handed coil stabilised by backbone hydrogen bonds within one local chain region. A β-sheet contains extended strands hydrogen-bonded side by side, with side chains alternating above and below the sheet.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"12"},{"id":"L13","module":"BS1030","lecture":"BS1030 Lecture 3: Protein structure","source":"BS1030 Lecture 3: Protein structure","topic":"Protein structure","q":"Where are α-helix hydrogen bonds formed?","a":"B","notes":"","opts":["Between side chains only","Between backbone C=O and N–H groups","Between adjacent aromatic rings","Only between different subunits"],"mode":"MCQ","type":"Multiple choice","calc":false,"number":"13"},{"id":"L14","module":"BS1030","lecture":"BS1030 Lecture 3: Protein structure","source":"BS1030 Lecture 3: Protein structure","topic":"Protein structure","q":"What does a Ramachandran plot show?","a":"It shows sterically allowed and disallowed combinations of backbone φ and ψ torsion angles and helps explain recurring secondary structures.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"14"},{"id":"L15","module":"BS1030","lecture":"BS1030 Lecture 3: Protein structure","source":"BS1030 Lecture 3: Protein structure","topic":"Protein structure","q":"Distinguish primary, secondary, tertiary and quaternary protein structure.","a":"Primary is amino-acid sequence; secondary is local folding such as α-helices and β-sheets; tertiary is the overall fold of one polypeptide; quaternary is the association of multiple folded subunits.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"15"},{"id":"L16","module":"BS1040","lecture":"BS1040 Lecture 1: Origins of Life","source":"BS1040 Lecture 1: Origins of Life","topic":"Origins of life","q":"Why is the RNA-world hypothesis attractive?","a":"RNA can store sequence information and some RNA molecules can catalyse reactions, so one polymer could have supported both heredity and catalysis before DNA–protein systems.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"16"},{"id":"L17","module":"BS1040","lecture":"BS1040 Lecture 1: Origins of Life","source":"BS1040 Lecture 1: Origins of Life","topic":"Origins of life","q":"List the basic requirements proposed for abiogenesis.","a":"Building blocks, encapsulation, replicated information, variation and selection, enzyme-catalysed reactions, an energy source or electrochemical gradient, and time.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"17"},{"id":"L18","module":"BS1040","lecture":"BS1040 Lecture 1: Origins of Life","source":"BS1040 Lecture 1: Origins of Life","topic":"Origins of life","q":"Which feature makes hydrothermal vents plausible sites for abiogenesis?","a":"B","notes":"","opts":["Absence of chemical gradients","Heat, pH and redox gradients with mineral surfaces","Permanent exposure to oxygen-rich air","Lack of metals and sulphur"],"mode":"MCQ","type":"Multiple choice","calc":false,"number":"18"},{"id":"L19","module":"BS1040","lecture":"BS1040 Lecture 1: Origins of Life","source":"BS1040 Lecture 1: Origins of Life","topic":"Origins of life","q":"What is LUCA?","a":"The Last Universal Common Ancestor, the ancestral cellular population from which all currently known life descends.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"19"},{"id":"L20","module":"BS1040","lecture":"BS1040 Lecture 1: Origins of Life","source":"BS1040 Lecture 1: Origins of Life","topic":"Origins of life","q":"Explain why evidence for early life does not by itself prove the exact location of abiogenesis.","a":"Evidence can constrain when life existed and suggest plausible environments, but it does not directly observe the original event or uniquely identify one location.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"20"},{"id":"L21","module":"BS1040","lecture":"BS1040 Lecture 2: Bacterial taxonomy","source":"BS1040 Lecture 2: Bacterial taxonomy","topic":"Bacterial taxonomy","q":"Why is biological classification useful?","a":"It organises organisms by shared characteristics, describes relationships and supports identification of newly encountered organisms.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"21"},{"id":"L22","module":"BS1040","lecture":"BS1040 Lecture 2: Bacterial taxonomy","source":"BS1040 Lecture 2: Bacterial taxonomy","topic":"Bacterial taxonomy","q":"Which binomial name is formatted correctly?","a":"C","notes":"The genus is capitalised and the species epithet is lower case; both are normally italicised.","opts":["escherichia Coli","Escherichia Coli","Escherichia coli","E. Coli"],"mode":"MCQ","type":"Multiple choice","calc":false,"number":"22"},{"id":"L23","module":"BS1040","lecture":"BS1040 Lecture 2: Bacterial taxonomy","source":"BS1040 Lecture 2: Bacterial taxonomy","topic":"Bacterial taxonomy","q":"Distinguish taxonomy from a taxon.","a":"Taxonomy is the scientific study of naming, defining and classifying organisms; a taxon is a named group at a particular rank.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"23"},{"id":"L24","module":"BS1040","lecture":"BS1040 Lecture 2: Bacterial taxonomy","source":"BS1040 Lecture 2: Bacterial taxonomy","topic":"Bacterial taxonomy","q":"Why can phenotype alone be unreliable for bacterial classification?","a":"Phenotypes can vary with environmental conditions and unrelated organisms can share similar traits. Molecular evidence can provide additional evidence of relatedness.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"24"},{"id":"L25","module":"BS1040","lecture":"BS1040 Lecture 2: Bacterial taxonomy","source":"BS1040 Lecture 2: Bacterial taxonomy","topic":"Bacterial taxonomy","q":"After first writing Escherichia coli in full, how may it be abbreviated?","a":"E. coli, retaining the full stop after the abbreviated genus and the lower-case species epithet.","notes":"","opts":[],"mode":"Flashcard","type":"Short answer","calc":false,"number":"25"}],KEY='bio-study-hub-max-v1',DAY=86400000;let session=[],pos=0,shown=[],locked=false,sessionMistakes=new Map();

function store(){try{return window.localStorage}catch(e){return null}}function def(){return{stats:{},daily:{},errors:{},imported:[],moduleMeta:{BS1030:{year:'Year 1',name:'Biochemistry and Molecular Biology'},BS1040:{year:'Year 1',name:'Cell Biology and Microbiology'}},streak:{last:'',n:0},settings:{goal:20,interval:3,module:'All',year:'All',exam:''}}}function load(){try{let d=def(),v=JSON.parse(store()?.getItem(KEY)||'{}');return {...d,...v,settings:{...d.settings,...(v.settings||{})},stats:v.stats||{},daily:v.daily||{},errors:v.errors||{},streak:{...d.streak,...(v.streak||{})},imported:Array.isArray(v.imported)?v.imported:[],moduleMeta:{...d.moduleMeta,...(v.moduleMeta||{})}}}catch(e){return def()}}let S=load();if(!Array.isArray(S.imported))S.imported=[];if(!S.moduleMeta)S.moduleMeta={};let BANK=[...BUILTIN_BANK,...S.imported.filter(x=>x&&x.id&&!BUILTIN_BANK.some(b=>b.id===x.id))];function save(){try{store()?.setItem(KEY,JSON.stringify(S))}catch(e){}}
function moduleYear(code){return S.moduleMeta?.[code]?.year||'Other'}function moduleCodes(){return [...new Set(BANK.map(q=>q.module).filter(Boolean))].sort()}function moduleName(code){return S.moduleMeta?.[code]?.name||code}function moduleQuestions(code){return BANK.filter(q=>q.module===code)}function moduleSummary(code){let q=moduleQuestions(code),attempted=q.filter(x=>st(x.id).seen),dueN=q.filter(due).length,score=attempted.length?Math.round(attempted.reduce((n,x)=>n+mastery(x),0)/attempted.length):null;return{code,total:q.length,seen:attempted.length,due:dueN,score,year:moduleYear(code)}}
function st(id){return S.stats[id]||(S.stats[id]={seen:0,ok:0,next:0,last:0})}function due(q){let x=st(q.id);return x.seen&&x.next<=Date.now()}function fisher(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}function uniqueToday(){return new Set(S.daily[today()]||[])}function markDay(id){let x=uniqueToday();x.add(id);S.daily[today()]=[...x]}function activeDays(){let n=0;for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()-i);if((S.daily[d.toISOString().slice(0,10)]||[]).length)n++}return n}function recovered(id){let e=S.errors[id];return e&&e.recoveredDay}function unresolved(){return BANK.filter(q=>S.errors[q.id]&&!recovered(q.id))}function mastery(q){let x=st(q.id);return x.seen?Math.round(x.ok/x.seen*100):null}
function lectureRows(){let m=new Map();scopedBank().forEach(q=>{let name=String(q.lecture||'Unassigned');let a=m.get(name);if(!a){a=[];m.set(name,a)}a.push(q)});return Array.from(m,([name,a])=>{let attempted=a.filter(q=>st(q.id).seen),score=attempted.length?Math.round(attempted.reduce((n,q)=>n+mastery(q),0)/attempted.length):null;return{name,a,total:a.length,seen:attempted.length,due:a.filter(due).length,score}}).sort((a,b)=>a.name.localeCompare(b.name))}
function show(id){document.querySelectorAll('main').forEach(x=>x.hidden=x.id!==id);document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===id));if(id==='home')home();if(id==='lectures')lectures();if(id==='errors')errors();if(id==='library')library();if(id==='settings')settings()}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>show(b.dataset.p));
function scopedBank(){return BANK.filter(q=>(S.settings.year==='All'||moduleYear(q.module)===S.settings.year)&&(S.settings.module==='All'||q.module===S.settings.module))}function examDays(){if(!S.settings.exam)return null;let end=new Date(S.settings.exam+'T12:00:00'),now=new Date();return Math.ceil((end-now)/DAY)}function smartPool(){let bank=scopedBank(),d=bank.filter(due),w=bank.filter(q=>st(q.id).seen&&mastery(q)<70&&!d.includes(q)),n=bank.filter(q=>!st(q.id).seen);return fisher(d).concat(fisher(w),fisher(n))}
function home(){let bank=scopedBank(),u=uniqueToday().size,goal=S.settings.goal,p=smartPool(),focus=unresolved().find(q=>bank.includes(q))||p[0],ed=examDays(),exam=ed===null?'':ed<0?' · exam date passed':ed===0?' · exam today':' · '+ed+' day'+(ed===1?'':'s')+' to exam';$('home').innerHTML=`<div class="crumb">${S.settings.module==='All'?'All modules':esc(S.settings.module+' · '+moduleName(S.settings.module))}</div><section class="hero"><div><span class="muted">TODAY'S LEARNING</span><h1>Do the next useful thing.</h1><p>${bank.filter(due).length} due · ${unresolved().filter(q=>bank.includes(q)).length} unresolved · ${bank.filter(q=>!st(q.id).seen).length} unseen${exam}</p><div class="actions"><button class="primary" onclick="startSmart(10)">Start smart session</button><button class="secondary" onclick="startSmart(5)">5-question quick session</button></div></div><div class="goal" style="--p:${Math.min(100,u/goal*100)}">${u}/${goal}</div></section><section class="focus"><span>Next focus</span><strong>${focus?esc(focus.topic):'Mixed maintenance'}</strong><span>${activeDays()}/7 active days</span><button class="primary" onclick="startSmart(5)">Begin now</button></section><section class="panel"><div class="head"><div><h2>Progress in the selected module</h2><p class="muted">Question collections are generated from the material currently included in each module.</p></div><button class="secondary" onclick="show('lectures')">Browse modules</button></div><div class="grid">${lectureRows().slice(0,6).map(lectureCard).join('')}</div></section>`}
function coverageState(l){if(!l.seen)return{label:'Not started',cls:'',mark:'○'};if(l.seen<l.total||l.due)return{label:l.due?l.due+' review'+(l.due===1?'':'s')+' due':'In progress',cls:'started',mark:'◐'};return{label:'Covered',cls:'covered',mark:'✓'}}function collectionCoverage(rows){return `<div class="coverage-list">${rows.map(l=>{let c=coverageState(l);return `<div class="coverage-row"><span class="coverage-mark ${c.cls}">${c.mark}</span><div><strong>${esc(l.name)}</strong><small>${l.seen}/${l.total} questions attempted · ${l.score===null?'no accuracy yet':l.score+'% accuracy'}</small></div><span class="pill">${c.label}</span></div>`}).join('')}</div>`}function lectureCard(l){return `<article class="panel lecture"><span class="type-tag">${lectureType(l.name)}</span><h3>${esc(l.name)}</h3><span class="pill">${l.seen}/${l.total} questions completed</span><span class="pill">${l.due} due</span><div class="bar"><i style="width:${l.score||0}%"></i></div><p class="muted">${l.score===null?'Not started':l.score+'% accuracy on attempted questions'}</p><button class="secondary" onclick='startLecture(${JSON.stringify(l.name)})'>Study collection</button></article>`}function contentType(q){let v=(q.source+' '+q.lecture).toLowerCase();if(/practical|onpg|aseptic|serial dilution|disc assay/.test(v))return 'Practical collection';if(/mock|practice paper|exam|academic paper analysis|self-test/.test(v))return 'Exam-practice collection';if(/lecture|protein structure|cell biology|topic 3/.test(v))return 'Lecture collection';return 'Question collection'}
function lectureType(name){let q=BANK.find(x=>x.lecture===name);return q?contentType(q):'Study set'}
function modulesByYear(){let years={'Year 1':[],'Year 2':[],'Year 3':[],'Other':[]};moduleCodes().forEach(c=>years[moduleYear(c)].push(moduleSummary(c)));return years}
function moduleCard(m){return `<article class="module-card ${S.settings.module===m.code?'active':''}"><span class="type-tag">${esc(m.year)}</span><h3>${esc(m.code)}</h3><p class="muted">${esc(moduleName(m.code))}</p><span class="pill">${m.seen}/${m.total} completed</span><span class="pill">${m.due} due</span><div class="bar"><i style="width:${m.score||0}%"></i></div><p class="muted">${m.score===null?'Not started':m.score+'% accuracy on attempted questions'}</p><div class="module-actions"><button class="primary" onclick="openModule('${esc(m.code)}')">Open module</button><button class="secondary" onclick="studyModule('${esc(m.code)}')">Quick study</button></div></article>`}
function lectures(){let years=modulesByYear();$('lectures').innerHTML=`<div class="head"><div><h1>My modules</h1><p class="muted">Modules are tucked into academic years, ready for future content packs.</p></div></div><div class="module-shelf">${Object.entries(years).map(([year,mods],i)=>`<details class="year-block" ${i===0?'open':''}><summary><span>${year}</span><span class="pill">${mods.length} module${mods.length===1?'':'s'}</span></summary><div class="module-grid">${mods.length?mods.map(moduleCard).join(''):`<article class="module-card module-empty"><h3>No modules added yet</h3><p>Import a content pack when this year begins.</p></article>`}</div></details>`).join('')}</div><section class="panel"><h2>Coverage checklist</h2><p class="muted">This is automatic. A collection is covered only when every included question has been attempted and no reviews are due. It measures app content, not the whole lecture.</p>${collectionCoverage(lectureRows())}</section><details class="source-pack"><summary><strong>Author tools: add content packs</strong></summary><h2>Author content import</h2><p>Import a reviewed JSON content pack containing module metadata and a <code>questions</code> array. Imported packs are saved in this browser and survive reloads. Each pack needs an explicit academic year and module code. Questions need a unique ID, collection name, topic, question and answer.</p><label class="secondary" style="display:inline-block">Import reviewed content pack<input hidden type="file" accept="application/json,.json" onchange="importContentPack(this.files[0])"></label></details>`}
function openModule(code){S.settings.module=code;S.settings.year=moduleYear(code);save();home()}
function studyModule(code){S.settings.module=code;S.settings.year=moduleYear(code);save();startSmart(10)}
function startLecture(n){launch(fisher(BANK.filter(q=>q.lecture===n)).slice(0,15))}function startSmart(n){launch(smartPool().slice(0,n))}
function launch(a){if(!a.length)return alert('No eligible questions.');session=a;pos=0;sessionMistakes=new Map();show('study');question()}
function learningNote(q){let generic=/^Common mistake: distinguish the definition from a related process with a similar name\.?$/i.test((q.notes||'').trim()),answer=correctText(q),source=q.source||q.lecture||'Source not recorded';if(!generic&&q.notes)return q.notes+' Source: '+source+'.';let focus=answer.length>190?answer.slice(0,187)+'…':answer;return 'Key point: '+focus+' Source: '+source+'. When reviewing, check that your answer addresses the exact wording of the question rather than only naming a related concept.'}function correctText(q){return q.opts.length?q.opts['ABCD'.indexOf(q.a.toUpperCase())]:q.a}function question(){let q=session[pos];locked=false;shown=q.opts.length?fisher(q.opts.map((text,i)=>({text,ok:'ABCD'[i]===q.a.toUpperCase()}))):[];$('study').innerHTML=`<div class="studytop"><button class="secondary" onclick="show('home')">Exit</button><div class="prog"><i style="width:${pos/session.length*100}%"></i></div><b>${pos+1}/${session.length}</b></div><section class="card"><div class="chips"><span>${esc(q.module)}</span><span>${esc(contentType(q))}</span><span>Set: ${esc(q.lecture)}</span><span>Source: ${esc(q.source||'Unspecified')}</span><span>${esc(q.topic)}</span></div><h1>${esc(q.q)}</h1>${q.opts.length?`<div class="options">${shown.map((o,i)=>`<button onclick="grade(${i})">${esc(o.text)}</button>`).join('')}</div>`:`<textarea id="attempt" placeholder="Write or say your answer before revealing it."></textarea><button class="primary" onclick="reveal()">Compare with model answer</button>`}<div id="fb"></div></section>`}
function record(q,ok){let x=st(q.id),wasWrong=S.errors[q.id]?.wrongDay;x.seen++;x.last=Date.now();markDay(q.id);if(ok){x.ok++;x.next=Date.now()+Math.max(3,S.settings.interval)*DAY;if(wasWrong&&wasWrong<today())S.errors[q.id].recoveredDay=today()}else{x.next=Date.now()+DAY;S.errors[q.id]={q:q.q,topic:q.topic,wrongDay:today(),recoveredDay:''};sessionMistakes.set(q.id,q)}let t=today(),y=new Date();y.setDate(y.getDate()-1);let yd=y.toISOString().slice(0,10);if(S.streak.last!==t){S.streak.n=S.streak.last===yd?S.streak.n+1:1;S.streak.last=t}save()}
function grade(i){if(locked)return;locked=true;let q=session[pos],ok=shown[i].ok;record(q,ok);document.querySelectorAll('.options button').forEach((b,j)=>{if(shown[j].ok)b.classList.add('correct');else if(j===i)b.classList.add('wrong');b.disabled=true});$('fb').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Correct':'Not yet'}</b><p>${esc(correctText(q))}</p><p class="muted">${esc(learningNote(q))}</p><button class="primary" onclick="next()">Next</button></div>`}
function reveal(){if(locked)return;locked=true;let q=session[pos];$('fb').innerHTML=`<div class="feedback"><b>Model answer</b><p>${esc(q.a)}</p><p class="muted">${esc(learningNote(q))}</p><button class="secondary" onclick="self(false)">Needs work</button> <button class="primary" onclick="self(true)">Knew it</button></div>`}function self(ok){record(session[pos],ok);next()}function next(){if(++pos<session.length)question();else finish()}
function finish(){let n=sessionMistakes.size;$('study').innerHTML=`<section class="panel finish"><h1>Session complete</h1><p>${uniqueToday().size} unique questions completed today.</p><p>${n?n+' question'+(n===1?'':'s')+' added to your recovery queue.':'No unresolved questions from this session.'}</p><button class="primary" onclick="show('home')">Back to Today</button></section>`}
function errors(){let bank=scopedBank(),a=unresolved().filter(q=>bank.includes(q));$('errors').innerHTML=`<div class="head"><div><h1>Recovery queue</h1><p class="muted">A question leaves only after a correct answer on a later day.</p></div></div>${a.length?a.map(q=>`<section class="panel error"><b>${esc(q.topic)}</b><p>${esc(q.q)}</p><button class="secondary" onclick='launch([BANK.find(x=>x.id===${JSON.stringify(q.id)})])'>Recover now</button></section>`).join(''):'<section class="panel"><h2>Queue clear</h2><p>No outstanding mistakes.</p></section>'}`}
function library(){$('library').innerHTML=`<div class="head"><div><h1>${scopedBank().length} questions</h1><p class="muted">Search by lecture, topic or wording.</p></div><input id="search" placeholder="Search" oninput="list()"></div><div id="list" class="panel library"></div>`;list()}function list(){let v=($('search')?.value||'').toLowerCase();$('list').innerHTML=scopedBank().filter(q=>(q.q+' '+q.topic+' '+q.lecture).toLowerCase().includes(v)).map(q=>`<article><b>${esc(q.q)}</b><span class="muted">${esc(q.module)} · ${esc(contentType(q))} · ${esc(q.lecture)} · ${esc(q.mode)}</span></article>`).join('')}
function normaliseQuestion(q,i,prefix,moduleCode){return{id:String(q.id||prefix+'-'+(i+1)),module:String(q.module||moduleCode),lecture:String(q.collection||q.lecture||q.set||'Imported collection'),source:String(q.source||'Imported content pack'),topic:String(q.topic||'General'),number:String(q.number||i+1),q:String(q.q||q.question||''),a:String(q.a||q.answer||''),opts:Array.isArray(q.opts)?q.opts:(Array.isArray(q.options)?q.options:[]),type:String(q.type||((q.opts||q.options||[]).length?'Multiple choice':'Short answer')),mode:String(q.mode||((q.opts||q.options||[]).length?'MCQ':'Flashcard')),notes:String(q.notes||''),calc:Boolean(q.calc)}}function importContentPack(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let p=JSON.parse(r.result),arr=Array.isArray(p)?p:p.questions,moduleCode=String(p.module||'').trim(),year=String(p.year||'').trim(),name=String(p.moduleName||p.name||moduleCode).trim();if(!moduleCode||!/^Year [123]$|^Other$/.test(year))throw Error('Pack must include module and year (Year 1, Year 2, Year 3 or Other)');if(!Array.isArray(arr)||!arr.length)throw Error('No questions array');let prefix=moduleCode+'-'+Date.now(),ids=new Set(BANK.map(x=>x.id)),fresh=[];arr.map((q,i)=>normaliseQuestion(q,i,prefix,moduleCode)).forEach(q=>{if(!q.q||!q.a||q.module!==moduleCode||ids.has(q.id))return;fresh.push(q);ids.add(q.id)});if(!fresh.length)throw Error('No valid unique questions');S.imported.push(...fresh);S.moduleMeta[moduleCode]={year,name};BANK.push(...fresh);save();alert(fresh.length+' questions saved for '+moduleCode+'. They will remain after reload in this browser. Export a backup or commit the pack to GitHub for use on other devices.');lectures()}catch(e){alert('Content pack could not be imported: '+e.message)}};r.readAsText(f)}
function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.href=u;a.download='bio-study-hub-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function importBackup(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!v||typeof v!=='object'||!v.stats||!v.settings)throw Error();let d=def();S={...d,...v,settings:{...d.settings,...v.settings},streak:{...d.streak,...(v.streak||{})},imported:Array.isArray(v.imported)?v.imported:[],moduleMeta:{...d.moduleMeta,...(v.moduleMeta||{})}};BANK=[...BUILTIN_BANK,...(S.imported||[]).filter(x=>x&&x.id&&!BUILTIN_BANK.some(b=>b.id===x.id))];save();settings();alert('Progress and saved content imported successfully.')}catch(e){alert('This is not a valid Bio Study Hub backup.')}};r.readAsText(f)}function setModule(m){S.settings.module=m;S.settings.year=m==='All'?'All':moduleYear(m);save();home()}function resetProgress(){if(confirm('Clear study progress and recovery history? Imported content will be kept.')){let imported=S.imported,moduleMeta=S.moduleMeta;S=def();S.imported=imported;S.moduleMeta={...S.moduleMeta,...moduleMeta};save();settings()}}function settings(){$('settings').innerHTML=`<h1>Settings</h1><section class="panel"><label>Current module <select class="module-select" onchange="setModule(this.value)"><option value="All">All modules</option>${moduleCodes().map(c=>`<option value="${esc(c)}" ${S.settings.module===c?'selected':''}>${esc(c+' · '+moduleName(c))}</option>`).join('')}</select></label><p><label>Daily unique-question goal <input type="number" min="1" value="${S.settings.goal}" onchange="S.settings.goal=Math.max(1,+this.value||20);save()"></label></p><p><label>Correct-answer review interval <input type="number" min="3" value="${S.settings.interval}" onchange="S.settings.interval=Math.max(3,+this.value||3);save()"> days</label></p><label>Exam date <input type="date" value="${S.settings.exam||''}" onchange="S.settings.exam=this.value;save()"></label><details class="advanced"><summary>Advanced data controls</summary><p class="muted">Use these only when moving progress to another browser or starting again.</p><p><button class="secondary" onclick="backup()">Export progress</button> <label class="secondary" style="display:inline-block">Import progress<input hidden type="file" accept="application/json,.json" onchange="importBackup(this.files[0])"></label></p><button class="danger" onclick="resetProgress()">Reset all progress</button></details><p class="muted">Progress stays in this browser. Export before clearing browser data or changing device.</p><p class="disclaimer">Independent student revision tool. Question content should be checked against current module materials and is not an official University of Leicester resource.</p></section>`}
document.addEventListener('keydown',e=>{if($('study').hidden)return;if(!locked&&shown.length&&/^[a-d]$/i.test(e.key))grade('ABCD'.indexOf(e.key.toUpperCase()));else if(locked&&e.key==='Enter'){let b=document.querySelector('#fb .primary');if(b)b.click()}});show('home');
</script></body></html>
